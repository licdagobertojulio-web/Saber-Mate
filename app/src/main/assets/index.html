<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>SABER MATE</title>
  <meta name="description" content="Aplicación de estudio y preparación de Matemáticas Saber 11 con 500 preguntas, simulacros, lectura en voz alta y panel docente.">
  <meta property="og:title" content="SABER MATE">
  <meta property="og:description" content="Aplicación de estudio y preparación de Matemáticas Saber 11 con 500 preguntas, simulacros, lectura en voz alta y panel docente.">
  <meta name="theme-color" content="#2445C2">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="Saber Mate">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="apple-touch-icon" href="/apple-touch-icon.jpg">
  <link rel="icon" type="image/jpeg" href="/icon.jpg">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=STIX+Two+Text:ital,wght@0,400;0,600;1,400&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=JetBrains+Mono:wght@500;700&display=swap">
  <script src="config.js"></script>
<style>
/* Hoja de respuestas: papel azulado, tinta azul, lápiz amarillo para marcar */
:root{
  --bg:#F3F5FA; --surface:#FFFFFF; --surface2:#EAEEF7; --ink:#15203A; --muted:#58637D; --line:#D6DCEA;
  --accent:#2445C2; --accent-soft:#E2E8FB; --pencil:#F0B232; --pencil-ink:#3A2A00;
  --hero:#2445C2; --hero-ink:#FFFFFF; --ok:#1D8556; --ok-soft:#DDF3E7; --bad:#BF3434; --bad-soft:#F9E1E1; --paper:#FFFFFF;
  --f-display:"Bricolage Grotesque", "Segoe UI", system-ui, sans-serif;
  --f-body:"Atkinson Hyperlegible", "Segoe UI", system-ui, sans-serif;
  --f-mono:"JetBrains Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1322; --surface:#161D31; --surface2:#1E2740; --ink:#E6EAF4; --muted:#9BA5BF; --line:#2B3552;
  --accent:#8EA5FF; --accent-soft:#232F55; --pencil:#F0B232; --pencil-ink:#2A1E00;
  --hero:#1F2F78; --hero-ink:#F2F4FB; --ok:#52C78F; --ok-soft:#173A2B; --bad:#F27B7B; --bad-soft:#3F1F24; --paper:#F7F8FB; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1322; --surface:#161D31; --surface2:#1E2740; --ink:#E6EAF4; --muted:#9BA5BF; --line:#2B3552;
  --accent:#8EA5FF; --accent-soft:#232F55; --pencil:#F0B232; --pencil-ink:#2A1E00;
  --hero:#1F2F78; --hero-ink:#F2F4FB; --ok:#52C78F; --ok-soft:#173A2B; --bad:#F27B7B; --bad-soft:#3F1F24; --paper:#F7F8FB; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.55;margin:0}
.wrap{max-width:980px;margin:0 auto;padding-inline:16px;padding-block:0 48px}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);border-bottom:1px solid var(--line)}
.topin{max-width:980px;margin:0 auto;padding:12px 16px 0;display:flex;flex-wrap:wrap;align-items:flex-end;gap:8px 20px}
.brand{display:flex;flex-direction:column;padding-bottom:10px}
.brand b{font-family:var(--f-display);font-weight:800;font-size:22px;letter-spacing:-.01em;line-height:1.1}
.brand span{font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
nav.tabs{display:flex;gap:2px;overflow-x:auto;margin-left:auto;max-width:100%}
nav.tabs button{font:inherit;font-weight:700;font-size:14px;background:none;border:0;color:var(--muted);padding:10px 12px;border-bottom:3px solid transparent;cursor:pointer;white-space:nowrap}
nav.tabs button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent)}
button:focus-visible,select:focus-visible,input:focus-visible,.opt:focus-visible{outline:3px solid var(--pencil);outline-offset:2px}
h1,h2,h3{font-family:var(--f-display);text-wrap:balance;margin:0}
h1{font-size:30px;font-weight:800;letter-spacing:-.015em}
h2{font-size:21px;font-weight:600}
h3{font-size:16px;font-weight:600}
.muted{color:var(--muted)}
.lbl{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);font-weight:700}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stack{display:flex;flex-direction:column;gap:16px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:16px}
.btn{font:inherit;font-weight:700;font-size:15px;border-radius:8px;padding:10px 16px;border:1px solid var(--accent);background:var(--accent);color:var(--surface);cursor:pointer}
.btn.ghost{background:transparent;color:var(--accent)}
.btn.warn{background:var(--bad);border-color:var(--bad)}
.btn:disabled{opacity:.45;cursor:not-allowed}
select,input[type=text]{font:inherit;font-size:15px;padding:9px 10px;border:1px solid var(--line);border-radius:8px;background:var(--surface);color:var(--ink);min-width:0}
.field{display:flex;flex-direction:column;gap:4px;min-width:0}
.notice{border-left:4px solid var(--pencil);background:var(--surface2);padding:10px 14px;border-radius:6px;font-size:14px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi .v{font-family:var(--f-mono);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums}
.kpi .k{font-size:13px;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:10px}
.barrow{display:grid;grid-template-columns:120px 1fr 56px;gap:10px;align-items:center;font-size:14px}
.track{height:10px;background:var(--surface2);border-radius:6px;overflow:hidden}
.fill{height:100%;background:var(--accent);border-radius:6px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums;text-align:right}
/* Pregunta */
.qhead{display:flex;flex-wrap:wrap;gap:8px;align-items:center;justify-content:space-between}
.qnum{font-family:var(--f-display);font-weight:800;font-size:22px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--surface2);color:var(--muted)}
.chip.src{background:var(--accent-soft);color:var(--accent)}
.qbody{font-size:16.5px;min-width:0}
.qbody p{margin:0 0 12px}
.ctx{background:var(--surface2);border-radius:8px;padding:12px 14px;margin-bottom:14px;font-size:15px}
.ctx .ctxh,.ctxh{font-weight:700;text-transform:uppercase;font-size:12px;letter-spacing:.06em;color:var(--accent);margin-bottom:6px}
.fig{margin:10px auto 14px;text-align:center;background:var(--paper);border-radius:8px;padding:8px}
.fig img{width:100%;height:auto;display:block;margin:0 auto}
.svgf{margin:10px auto 14px;max-width:420px;background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:6px}
.svgf svg{width:100%;height:auto;display:block}
.svgf .gl{stroke:var(--line);stroke-width:1}
.svgf .ax{stroke:var(--ink);stroke-width:1.4}
.svgf .tk{fill:var(--muted);font:11px var(--f-mono)}
.svgf .lb{fill:var(--ink);font:600 11px var(--f-body)}
.svgf .ln{stroke-width:2.5}
.svgf .ln.s0,.svgf .dt.s0{stroke:var(--accent)} .svgf .dt.s0{fill:var(--accent)}
.svgf .ln.s1,.svgf .dt.s1{stroke:#D9822B} .svgf .dt.s1{fill:#D9822B}
.svgf .s0t{fill:var(--accent)} .svgf .s1t{fill:#D9822B}
.svgf .bar{fill:var(--accent)}
.tw{overflow-x:auto;margin:6px 0 12px}
table.dt{border-collapse:collapse;margin:0 auto;font-size:14.5px;font-variant-numeric:tabular-nums}
table.dt caption{font-weight:700;font-size:13px;padding-bottom:4px}
table.dt th,table.dt td{border:1px solid var(--line);padding:5px 10px;text-align:center}
table.dt th{background:var(--surface2)}
/* Tipografía matemática */
.qbody i,.ot i,.concept i,.fb i,.fr i,.rad i,.eq i,table.dt i{font-family:"STIX Two Text","Cambria Math",Cambria,"Times New Roman",serif;font-size:1.08em;font-style:italic;letter-spacing:.01em}
.fr{display:inline-flex;flex-direction:column;align-items:stretch;vertical-align:middle;text-align:center;font-size:.86em;line-height:1.12;margin:0 .18em;white-space:nowrap}
.fr>span{display:block;padding:0 .22em}
.fr>span:first-child{border-bottom:.09em solid currentColor;padding-bottom:.08em}
.fr>span:last-child{padding-top:.1em}
.fr .fr{font-size:.92em}
.pg{white-space:nowrap}
.pd{display:inline-block;font-size:1.55em;line-height:1;vertical-align:-0.2em;font-weight:300;transform:scaleX(.8);margin:0 -.02em}
.rad{display:inline-flex;align-items:stretch;vertical-align:-0.18em;margin:0 .08em;white-space:nowrap}
.rsign{width:.62em;flex:none;overflow:visible;fill:none;stroke:currentColor;stroke-width:1.5;stroke-linejoin:round}
.rarg{border-top:.09em solid currentColor;padding:.1em .14em 0 .08em;line-height:1.15}
.fr .rad{vertical-align:-0.1em}
sup,sub{font-size:.72em;line-height:0;position:relative;vertical-align:baseline}
sup{top:-.55em} sub{top:.25em}
.eq{font-family:var(--f-body)}
.eq{text-align:center;font-size:17px}
.steps,.bul{margin:4px 0 12px;padding-left:22px}
.steps{list-style:none;padding-left:8px}
.steps li,.bul li{margin-bottom:4px}
.note{font-size:13px;color:var(--muted);font-style:italic}
.three{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px;margin-bottom:12px}
.three>div{border:1px solid var(--line);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:2px;font-family:var(--f-mono);font-size:13.5px}
.three b{font-family:var(--f-body);margin-bottom:4px}
/* Opciones tipo hoja de respuestas */
.opts{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.opt{display:grid;grid-template-columns:38px 1fr;gap:12px;align-items:start;text-align:left;font:inherit;color:var(--ink);background:var(--surface);border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;cursor:pointer;width:100%}
.opt:hover:not(:disabled){border-color:var(--accent)}
.opt .bub{width:34px;height:34px;border-radius:50%;border:2px solid var(--muted);display:grid;place-items:center;font-family:var(--f-mono);font-weight:700;font-size:15px;color:var(--muted)}
.opt .ot{min-width:0;padding-top:4px}
.opt .ot .tw{margin:0}
.opt.sel .bub{background:var(--pencil);border-color:var(--pencil);color:var(--pencil-ink)}
.opt.sel{border-color:var(--pencil)}
.opt.right{border-color:var(--ok);background:var(--ok-soft)}
.opt.right .bub{background:var(--ok);border-color:var(--ok);color:var(--surface)}
.opt.wrong{border-color:var(--bad);background:var(--bad-soft)}
.opt.wrong .bub{background:var(--bad);border-color:var(--bad);color:var(--surface)}
.opt:disabled{cursor:default}
.fb{border-radius:10px;padding:12px 14px;margin-top:12px}
.fb.ok{background:var(--ok-soft);border:1px solid var(--ok)}
.fb.bad{background:var(--bad-soft);border:1px solid var(--bad)}
.fb b{display:block;margin-bottom:4px}
.fb.learn{background:var(--surface2);border:1px solid var(--line);border-left:5px solid var(--pencil)}
.fb.learn>b{color:var(--bad)}
.concept{margin-top:8px;display:flex;flex-direction:column;gap:6px}
.concept .lbl{color:var(--accent)}
.concept p{margin:0;font-size:15px}
.concept .tip{color:var(--muted)}
.exs{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:8px 12px}
.exs .exh{font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.exs ol{margin:4px 0 0;padding-left:20px;display:flex;flex-direction:column;gap:6px;font-size:15px;line-height:1.7}
/* Figuras geométricas */
.geo{margin:12px auto 14px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:10px}
.geo svg{width:100%;height:auto;display:block;overflow:visible}
.g-l{stroke:var(--ink);stroke-width:1.6;fill:none;stroke-linejoin:round;stroke-linecap:round}
.g-f{fill:var(--accent-soft);stroke:var(--ink);stroke-width:1.6;stroke-linejoin:round}
.g-top{fill-opacity:.65}.g-side{fill:var(--surface2)}.g-o{fill-opacity:.45}
.g-s{fill:var(--pencil);fill-opacity:.35;stroke:var(--ink);stroke-width:1.4}
.g-bgfill{fill:var(--surface);stroke:var(--ink);stroke-width:1.6}
.g-plane{fill:var(--pencil);fill-opacity:.22;stroke:var(--pencil);stroke-width:1.4}
.g-dash{stroke-dasharray:5 4}.g-hid{stroke-dasharray:4 4;stroke:var(--muted);stroke-width:1.2}
.g-acc{stroke:var(--accent);stroke-width:2.2}.g-thick{stroke-width:3.2}.g-thin{stroke-width:1.1}
.g-a{stroke:var(--accent);stroke-width:1.5;fill:none}
.g-t{fill:var(--ink);font:13px var(--f-body)}.g-small{font-size:11px}
.g-i{font-family:"STIX Two Text","Cambria Math",Cambria,"Times New Roman",serif;font-style:italic;font-size:15px}
.g-tick{fill:var(--muted);font:10px var(--f-mono)}
.g-grid{stroke:var(--line);stroke-width:1}.g-ax{stroke:var(--ink);stroke-width:1.4}
.g-dot{fill:var(--ink)}.g-dot.g-acc{fill:var(--accent);stroke:none}
.g-dim{stroke:var(--muted);stroke-width:1.1}.g-mk{fill:none;stroke:var(--muted);stroke-width:1.5}.g-mkf{fill:var(--ink)}
.g-hand{stroke:var(--ink);stroke-width:4;stroke-linecap:round}.g-thin2{stroke-width:2.5}
/* Rondas de práctica */
details.filt>summary{display:flex;flex-wrap:wrap;gap:10px;align-items:center;cursor:pointer;list-style:none}
details.filt>summary::-webkit-details-marker{display:none}
details.filt>summary::after{content:"Cambiar";margin-left:auto;font-weight:700;font-size:13px;color:var(--accent)}
details.filt[open]>summary::after{content:"Cerrar"}
.prog{display:flex;flex-direction:column;gap:10px}
.pbar{height:8px;background:var(--surface2);border-radius:6px;overflow:hidden}
.pbar>div{height:100%;background:var(--accent);border-radius:6px;transition:width .3s}
.pdots{display:flex;flex-wrap:wrap;gap:6px}
.pdot{width:14px;height:14px;border-radius:50%;border:2px solid var(--line);background:var(--surface);padding:0;cursor:pointer}
.pdot.ok{background:var(--ok);border-color:var(--ok)}.pdot.bad{background:var(--bad);border-color:var(--bad)}
.pdot.cur{outline:2px solid var(--accent);outline-offset:2px}
.qnum small{font-size:15px;color:var(--muted);font-weight:600}
.live{display:inline-flex;align-items:center;gap:8px;font-size:13px;font-weight:700;color:var(--ok)}
.live i{width:10px;height:10px;border-radius:50%;background:var(--ok);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 var(--ok)}70%{box-shadow:0 0 0 8px transparent}100%{box-shadow:0 0 0 0 transparent}}
.feed{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:14px}
.feed li{display:flex;gap:10px;align-items:baseline}
.linkbtn{font:inherit;font-size:13px;color:var(--muted);background:none;border:0;text-decoration:underline;cursor:pointer;padding:4px}
/* Accesibilidad */
#view{zoom:var(--zoom,1)}
html.wide .qbody,html.wide .ot,html.wide .concept,html.wide .fb{letter-spacing:.035em;word-spacing:.14em;line-height:1.95}
.acc{margin-left:0}
.qtop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.spk{display:inline-flex;align-items:center;gap:6px;font:700 13px var(--f-body);color:var(--accent);background:var(--accent-soft);border:1px solid transparent;border-radius:999px;padding:5px 12px 5px 9px;cursor:pointer}
.spk svg{width:17px;height:17px;fill:currentColor;stroke:currentColor;stroke-width:2;stroke-linecap:round}
.spk.on{background:var(--accent);color:var(--surface)}
.spk.on svg{animation:pulse 1.4s infinite;border-radius:50%}
.fbtools{margin-top:10px;display:flex;justify-content:flex-end}
.spkstop{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:40;font:700 14px var(--f-body);background:var(--ink);color:var(--surface);border:0;border-radius:999px;padding:12px 18px;box-shadow:0 6px 18px rgba(0,0,0,.25);cursor:pointer}
.accp{position:absolute;right:16px;top:calc(100% + 6px);z-index:30;width:min(360px,calc(100vw - 32px));background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:16px;box-shadow:0 12px 32px rgba(0,0,0,.18);display:flex;flex-direction:column;gap:12px}
.accrow{display:flex;flex-direction:column;gap:6px}
.segs{display:flex;flex-wrap:wrap;gap:6px}
.seg{font:700 14px var(--f-body);padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.seg.on{background:var(--accent);border-color:var(--accent);color:var(--surface)}
@media (max-width:640px){.snd.acc{position:absolute;top:12px;right:62px;margin:0;padding:7px}.snd.acc span{display:none}}
.spkstop[hidden],.accp[hidden]{display:none}
/* Navegador */
.navgrid{display:flex;flex-wrap:wrap;gap:4px;max-height:150px;overflow-y:auto;padding:2px}
.navgrid button{font:600 12px var(--f-mono);width:40px;height:30px;border-radius:6px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.navgrid button.cur{outline:2px solid var(--accent);outline-offset:1px}
.navgrid button.ok{background:var(--ok-soft);border-color:var(--ok)}
.navgrid button.bad{background:var(--bad-soft);border-color:var(--bad)}
.navgrid button.ans{background:var(--pencil);border-color:var(--pencil);color:var(--pencil-ink)}
.timer{font-family:var(--f-mono);font-weight:700;font-size:22px;font-variant-numeric:tabular-nums;padding:6px 12px;border-radius:8px;background:var(--surface2)}
.timer.low{background:var(--bad-soft);color:var(--bad)}
.score{font-family:var(--f-display);font-weight:800;font-size:54px;line-height:1}
.rev{border-top:1px solid var(--line);padding:10px 0}
.rev summary{cursor:pointer;display:flex;gap:10px;align-items:center;font-weight:700}
.dot{width:12px;height:12px;border-radius:50%;flex:none}
.dot.ok{background:var(--ok)} .dot.bad{background:var(--bad)} .dot.na{background:var(--muted)}
.tablewrap{overflow-x:auto}
table.list{width:100%;border-collapse:collapse;font-size:14px}
table.list th{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);text-align:left;border-bottom:2px solid var(--line);padding:8px}
table.list td{border-bottom:1px solid var(--line);padding:8px;white-space:nowrap}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 8px;border-radius:999px}
.pill.ok{background:var(--ok-soft);color:var(--ok)} .pill.mid{background:var(--surface2);color:var(--muted)} .pill.bad{background:var(--bad-soft);color:var(--bad)}
.empty{text-align:center;padding:30px 10px;color:var(--muted)}
.confirmbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;background:var(--bad-soft);border:1px solid var(--bad);border-radius:8px;padding:10px 12px}
.cover-banner{position:relative;border-radius:18px;overflow:hidden;border:1px solid rgba(142,165,255,0.24);box-shadow:0 14px 40px -10px rgba(14,20,40,0.38),0 0 32px -8px rgba(36,69,194,0.25);background:linear-gradient(125deg,#0A0F1E 0%,#131B38 25%,#1A2C63 50%,#162045 75%,#0A0F1E 100%);background-size:250% 250%;animation:coverShift 14s ease-in-out infinite}
.cover-banner::before{content:"";position:absolute;inset:0;border-radius:18px;padding:1.5px;background:linear-gradient(120deg,rgba(36,69,194,0.7),rgba(240,178,50,0.6),rgba(82,199,143,0.4),rgba(142,165,255,0.7));background-size:300% 300%;-webkit-mask:linear-gradient(#fff 0 0) content-box,linear-gradient(#fff 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:coverShift 8s ease-in-out infinite alternate;pointer-events:none;z-index:4}
@keyframes coverShift{0%{background-position:0% 50%}50%{background-position:100% 50%}100%{background-position:0% 50%}}
.cover-media{position:relative;width:100%;aspect-ratio:16/7.5;min-height:240px;max-height:360px;overflow:hidden}
.cover-img{width:100%;height:100%;object-fit:cover;object-position:center 45%;display:block;transform:scale(1.01);transition:transform .6s ease;opacity:.93}

<header class="top"><div class="topin"><div class="brand"><span>Matemáticas · Saber 11.º</span><b>SABER MATE</b></div><nav class="tabs" id="tabs" role="tablist" aria-label="Secciones"></nav><button id="installbtn" class="snd" type="button" title="Instalar aplicación en tu dispositivo" style="color:var(--accent);font-weight:700"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" style="margin-right:3px"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/></svg><span>Instalar</span></button><button id="accbtn" class="snd acc" type="button" aria-expanded="false" aria-controls="accp"></button><button id="sndbtn" class="snd" type="button" aria-pressed="true"></button></div></header><button id="spkstop" class="spkstop" type="button" hidden>Detener lectura</button>
<main class="wrap" id="view"></main>
<script>
// Tipografía matemática: convierte texto plano (1/2, √3, x², 10⁻³, x₁) en fracciones, radicales y exponentes bien formados.
const RADSVG = '<svg class="rsign" viewBox="0 0 10 24" preserveAspectRatio="none" aria-hidden="true"><path d="M0.5 14.5 L2.6 13.2 L5.2 23 L9.6 0.6 L10 0.6" vector-effect="non-scaling-stroke"/></svg>';
const RAD = (x) => `<span class="rad" role="math" aria-label="raíz de ${String(x).replace(/<[^>]+>/g, '')}">${RADSVG}<span class="rarg">${x}</span></span>`;
const SUPMAP = { '⁰': '0', '¹': '1', '²': '2', '³': '3', '⁴': '4', '⁵': '5', '⁶': '6', '⁷': '7', '⁸': '8', '⁹': '9', '⁻': '−', '⁺': '+', 'ⁿ': 'n', 'ˣ': 'x', 'ᵗ': 't' };
const SUBMAP = { '₀': '0', '₁': '1', '₂': '2', '₃': '3', '₄': '4', '₅': '5', '₆': '6', '₇': '7', '₈': '8', '₉': '9' };
const SUPC = '⁰¹²³⁴⁵⁶⁷⁸⁹⁻⁺ⁿˣᵗ', SUBC = '₀₁₂₃₄₅₆₇₈₉';
const NUM = '\\d+(?:[.,]\\d+)*';
const SUPR = `[${SUPC}]*`;
// Un "átomo" de fracción: número (con coeficiente literal), letra sola, radical, o grupo entre paréntesis/corchetes
const ATOM = `(?:\\d*√\\d+|\\d*√\\([^()]*\\)|${NUM}[a-zπθ]?!?${SUPR}|[a-zA-Zπθ][${SUBC}]?!?${SUPR}|\\([^()]*\\)${SUPR}|\\[[^\\[\\]]*\\])`;
const FRAC_RE = new RegExp(`(?<![\\wáéíóúñÁÉÍÓÚÑ.,√])(${ATOM})\\/(${ATOM})(?![\\wáéíóúñ])`, 'g');
const strip = (t) => (/^\(.*\)$/.test(t) && !/\)\s*\(/.test(t)) || /^\[.*\]$/.test(t) ? t.slice(1, -1) : t;
const isLetterOnly = (t) => /^[a-zA-Z][₀-₉]?$/.test(t);
function radParens(t) {
  let out = '', i = 0;
  while (i < t.length) {
    if (t[i] === '√' && t[i + 1] === '(') {
      let d = 0, j = i + 1;
      for (; j < t.length; j++) { if (t[j] === '(') d++; else if (t[j] === ')') { d--; if (!d) break; } }
      if (j < t.length) { out += '\u0004' + t.slice(i + 2, j) + '\u0005'; i = j + 1; continue; }
    }
    out += t[i++];
  }
  return out;
}
function fmtText(t) {
  // fracciones
  t = t.replace(FRAC_RE, (m, a, b) => {
    if (isLetterOnly(a) && isLetterOnly(b)) return m; // unidades como m/s
    return `\u0001${strip(a)}\u0002${strip(b)}\u0003`;
  });
  // exponentes escritos como ^( … )
  t = t.replace(/\^\(([^()]*)\)/g, '<sup>$1</sup>');
  // radicales
  t = radParens(t).replace(/√(\d+(?:[.,]\d+)?|[a-zπ])/g, (m, x) => `\u0004${x}\u0005`);
  // exponentes y subíndices unicode
  t = t.replace(new RegExp(`[${SUPC}]+`, 'g'), m => `<sup>${[...m].map(c => SUPMAP[c]).join('')}</sup>`);
  t = t.replace(new RegExp(`[${SUBC}]+`, 'g'), m => `<sub>${[...m].map(c => SUBMAP[c]).join('')}</sub>`);
  // paréntesis altos alrededor de fracciones
  for (let k = 0; k < 2; k++) t = t.replace(/\(([^()]*\u0001[^()]*)\)/g, '\u0006$1\u0007');
  // marcadores → HTML
  t = t.replace(/\u0004([^\u0005]*)\u0005/g, (m, x) => RAD(x));
  t = t.replace(/\u0001([^\u0002]*)\u0002([^\u0003]*)\u0003/g, (m, a, b) => `<span class="fr"><span>${a}</span><span>${b}</span></span>`);
  t = t.replace(/\u0006/g, '<span class="pg"><span class="pd">(</span>').replace(/\u0007/g, '<span class="pd">)</span></span>');
  return t;
}
// Aplica el formato solo al texto, nunca dentro de etiquetas HTML
function MF(html) {
  return String(html).split(/(<[^>]+>)/).map((part, i) => i % 2 ? part : fmtText(part)).join('');
}
// Banco de preguntas — Prueba de Matemáticas Saber 11.º (Icfes, 2026). Uso académico.
const F = (a, b) => `<span class="fr"><span>${a}</span><span>${b}</span></span>`;
const R = (x) => RAD(x);
const P = (s) => `<span class="pg"><span class="pd">(</span>${s}<span class="pd">)</span></span>`;
const tbl = (rows, opts = {}) => `<div class="tw"><table class="dt">${opts.caption ? `<caption>${opts.caption}</caption>` : ''}${rows.map((r, i) => `<tr>${r.map(c => (i === 0 && !opts.noHead) ? `<th>${c}</th>` : `<td>${c}</td>`).join('')}</tr>`).join('')}</table></div>`;
const img = (n, w) => `<figure class="fig"><img src="fig/${n}.png" alt="Figura de la pregunta" style="max-width:${w}px"></figure>`;
const steps = (l, lab = 'Paso') => `<ol class="steps">${l.map((s, i) => `<li><b>${lab} ${i + 1}.</b> ${s}</li>`).join('')}</ol>`;
const t33 = (a, b, c, d) => tbl([['', 'Hombre', 'Mujer'], ['En bus', a, b], ['Caminando', c, d]]);

const CTX = {
  m: `<p class="ctxh">Responde las preguntas 4 a 6 de acuerdo con la siguiente información</p>
<p>Para capacitar en informática básica a los trabajadores de algunas dependencias de una empresa, se contrata una institución que ofrece un plan educativo de 4 módulos (ver tabla).</p>
${tbl([['Módulo', 'Nombre del módulo', 'Intensidad horaria', 'Valor por hora'], ['I', 'Fundamentación', '40 h', '$ 35.000'], ['II', 'Procesador de texto', '30 h', '$ 30.000'], ['III', 'Hoja de cálculo', '40 h', '$ 40.000'], ['IV', 'Presentación con diapositivas', '10 h', '$ 45.000']], { caption: 'Capacitación en informática básica' })}
<p>La capacitación de cada módulo se hace con cursos de mínimo 20 y máximo 30 personas, de la misma dependencia.</p>`,
  c: `<p class="ctxh">Responde las preguntas 9 a 13 de acuerdo con la siguiente información</p>
<p>Para transportar mango y banano desde un pueblo cercano a dos ciudades, W y Z, un comerciante utiliza tres (3) camiones con capacidad de 5 toneladas cada uno; por cada camión contrata dos trabajadores en cada viaje. El comerciante compra a $ 400.000 la tonelada de banano y a $ 500.000 la de mango. En la tabla se muestra el precio de venta por tonelada de cada producto y los gastos de transporte y de trabajadores para cada ciudad.</p>
${tbl([['Ciudad', 'Precio de venta tonelada de banano', 'Precio de venta tonelada de mango', 'Costo transporte por camión', 'Pago por trabajador por viaje'], ['W', '$ 1.000.000', '$ 1.300.000', '$ 150.000', '$ 180.000'], ['Z', '$ 1.200.000', '$ 1.350.000', '$ 180.000', '$ 200.000']])}`,
};

const QS = [
{ a: 'B', s: `<p>Cuatro cursos, cada uno con igual número de estudiantes, presentan anualmente una prueba de matemáticas. La tabla muestra el puntaje promedio obtenido por cada curso.</p>
${tbl([['Curso', 'I', 'II', 'III', 'IV'], ['Promedio año anterior', '63', '61', '50', '53'], ['Promedio año actual', '65', '45', '53', '54']], { caption: 'Promedios de los puntajes en el examen por cursos' })}
<p>Al revisar los puntajes de la tabla, una persona afirma que hubo un aumento en el puntaje respecto al año anterior. Esta afirmación es</p>`,
  o: ['Correcta, ya que el promedio de la mayoría de los cursos aumentó respecto al año anterior.', 'Incorrecta, ya que el promedio total en el año anterior es superior al promedio total en el año actual.', 'Correcta, ya que al observar todos los promedios, el mayor corresponde al curso I en el año actual.', 'Incorrecta, ya que se necesita el puntaje de cada estudiante para realizar la comparación.'],
  e: 'Como los cursos tienen igual número de estudiantes, el promedio total es el promedio de los cuatro: año anterior (63+61+50+53)/4 = 56,75 y año actual (65+45+53+54)/4 = 54,25. Aunque tres cursos subieron, el promedio total bajó.' },
{ a: 'C', s: `<p>Una persona que vive en Colombia tiene inversiones en dólares en Estados Unidos, y sabe que la tasa de cambio del dólar respecto al peso colombiano se mantendrá constante este mes, siendo 1 dólar equivalente a 4.000 pesos colombianos, y que su inversión, en dólares, le dará ganancias del 3 % en el mismo periodo. Un amigo le asegura que en pesos sus ganancias también serán del 3 %.</p><p>¿La afirmación de su amigo es correcta?</p>`,
  o: ['Sí, porque, sin importar las variaciones en la tasa de cambio, la proporción en que aumenta la inversión en dólares es la misma que en pesos.', 'No, porque debería conocerse el valor exacto de la inversión para poder calcular la cantidad de dinero que ganará.', 'Sí, porque el 3 % representa una proporción fija en cualquiera de las dos monedas, puesto que la tasa de cambio permanecerá constante.', 'No, porque el 3 % representa un incremento, que será mayor en pesos colombianos, pues en esta moneda cada dólar representa un valor 4.000 veces mayor.'],
  e: 'Si la tasa es fija, el valor en pesos es siempre 4.000 veces el valor en dólares. Al multiplicar ambos por 1,03, la ganancia relativa es la misma: 3 %. La opción A falla porque sí importa que la tasa no cambie.' },
{ a: 'B', s: `<p>Las directivas de un colegio tienen que organizar un viaje a un museo con 140 estudiantes, quienes deben dividirse en 3 grupos. Cada grupo irá en una franja diferente, pero el costo total de las entradas se asumirá equitativamente por los estudiantes. En la tabla se muestran los horarios disponibles, la máxima cantidad de estudiantes y los precios respectivos de cada horario.</p>
${tbl([['Franja', 'Horario', 'Cantidad máxima de estudiantes', 'Precio entrada por estudiante'], ['1', '8:00 - 10:00', '50', '$ 35.000'], ['2', '10:00 - 12:00', '40', '$ 40.000'], ['3', '12:00 - 14:00', '30', '$ 50.000'], ['4', '14:00 - 16:00', '60', '$ 45.000']])}
<p>Con el fin de que todos los estudiantes asistan y paguen el menor precio, las directivas eligieron las franjas 1, 3 y 4. ¿Esta elección garantiza que asistan todos los estudiantes al menor precio posible?</p>`,
  o: ['Sí, porque esas franjas suman exactamente 140 estudiantes.', 'No, porque es posible obtener un precio menor eligiendo la franja 2 en lugar de la franja 3.', 'Sí, porque se incluyó la franja 1 que es la de menor precio por estudiante.', 'No, porque en la franja 3 la cantidad máxima de estudiantes es 30.'],
  e: 'Con las franjas 1, 3 y 4: 50×35.000 + 30×50.000 + 60×45.000 = $ 5.950.000. Con las franjas 1, 2 y 4 (50 + 40 + 50 estudiantes): 1.750.000 + 1.600.000 + 2.250.000 = $ 5.600.000, que es menor.' },
{ ctx: 'm', a: 'C', s: `<p>La empresa pagará $ 4.200.000 por capacitar a los trabajadores de la dependencia “Insumos” en el módulo I. ¿Cuántos empleados tiene esta dependencia?</p>`,
  o: ['Entre 20 y 30 trabajadores.', 'Entre 41 y 60 trabajadores.', 'Entre 61 y 90 trabajadores.', 'Entre 80 y 120 trabajadores.'],
  e: 'Un curso del módulo I cuesta 40 h × $ 35.000 = $ 1.400.000. Entonces 4.200.000 ÷ 1.400.000 = 3 cursos, y cada curso tiene entre 20 y 30 personas: entre 60 y 90 trabajadores.' },
{ ctx: 'm', a: 'B', s: `<p>Si se les cobrara a los 50 trabajadores de la dependencia “Recursos Humanos” la capacitación del módulo II, y todos pagaran el mismo valor, ¿cuánto debería pagar cada uno por esa capacitación?</p>`,
  o: ['$ 18.000', '$ 36.000', '$ 450.000', '$ 900.000'],
  e: 'Un curso del módulo II cuesta 30 h × $ 30.000 = $ 900.000. Para 50 personas se necesitan 2 cursos (máximo 30 por curso): $ 1.800.000 ÷ 50 = $ 36.000.' },
{ ctx: 'm', a: 'D', s: `<p>La empresa paga $ 900.000 por la capacitación de los 40 funcionarios de la dependencia “Importaciones”. De acuerdo con el valor pagado, ¿cuál de los siguientes módulos corresponde al tomado por la dependencia “Importaciones”?</p>`,
  o: ['I.', 'II.', 'III.', 'IV.'],
  e: 'Para 40 personas se necesitan 2 cursos, así que cada curso costó $ 450.000. Solo el módulo IV cuesta eso: 10 h × $ 45.000 = $ 450.000.' },
{ a: 'C', s: `<p>La figura muestra el portalápices de Eliécer. Él sabe que es posible colocar un caucho de 18 cm de perímetro alrededor de la base sin estirarlo, pero a medida que sube el caucho por el portalápices, este se estira hasta que, en la boca del portalápices, su perímetro es 24 cm.</p>${img('q7', 420)}
<p>El portalápices tiene base y boca cuadrada, por lo cual Eliécer afirma: “Como los perímetros de la base y la boca del portalápices están en relación ${F(18, 24)} = ${F(3, 4)}, el área de la base debe ser también tres cuartas partes del área de la boca del portalápices”. ¿Es verdadera esta afirmación?</p>`,
  o: ['No, porque la medición se realiza con el mismo caucho y, por tanto, las áreas de la base y la boca deben ser iguales.', 'Sí, porque el caucho se estira dependiendo del área que encierre, por lo que las relaciones de las áreas y los perímetros son iguales.', 'No, porque la relación obtenida se cumple para las longitudes de los lados, pero al calcular las áreas, la razón obtenida se eleva al cuadrado.', 'Sí, porque como las figuras son semejantes, todas sus medidas deben tener la misma razón que los perímetros.'],
  e: 'Los lados miden 4,5 cm y 6 cm (razón 3/4). Las áreas son 20,25 cm² y 36 cm²: su razón es (3/4)² = 9/16, no 3/4.' },
{ a: 'C', s: `<p>Un grupo de montañistas sabe que cada vez que aumenta la altitud en 100 m, la temperatura disminuye en 1 °C. Si el grupo se encuentra a una altitud de 1.000 m, donde la temperatura es de 20 °C, ¿cuál de las siguientes expresiones les permite determinar la temperatura que habrá cuando se encuentren a 4.000 m de altitud?</p>`,
  o: [`Temperatura = ${P(F('Altitud', 100))} + 10`, 'Temperatura = − Altitud × 100 + 30', `Temperatura = − ${P(F('Altitud', 100))} + 30`, 'Temperatura = Altitud × 100 + 10'],
  e: 'La temperatura baja 1 °C por cada 100 m, así que la pendiente es −1/100. Comprobación: −1.000/100 + 30 = 20 °C. A 4.000 m: −40 + 30 = −10 °C.' },
{ ctx: 'c', a: 'C', s: `<p>Una persona afirma que para el comerciante es más rentable vender 6 toneladas de mango en la ciudad Z que en la ciudad W. ¿Por qué la afirmación de esta persona es correcta?</p>`,
  o: ['Porque el dinero recibido en la venta del producto en la ciudad Z es mayor que el recibido en la ciudad W.', 'Porque la diferencia entre el precio de venta por tonelada es mayor que la diferencia entre el costo de transporte por camión.', 'Porque la diferencia entre las ventas totales en cada ciudad es mayor que la diferencia entre los gastos totales.', 'Porque el dinero total gastado en empleados y transporte es mayor en la ciudad W que en la ciudad Z.'],
  e: 'Ventas: Z = 6 × 1.350.000 = 8.100.000 y W = 7.800.000 (diferencia 300.000). Seis toneladas necesitan 2 camiones y 4 trabajadores: gastos Z = 1.160.000 y W = 1.020.000 (diferencia 140.000). Z gana más porque la diferencia en ventas supera la de gastos. Mirar solo las ventas (A) no basta.' },
{ ctx: 'c', a: 'C', s: `<p>Los tres (3) camiones se cargan con 5 toneladas de banano cada uno para venderse en la ciudad W. El comerciante necesita conocer la ganancia al hacer este negocio, ejecutando el siguiente procedimiento:</p>
${steps(['Halla el número de toneladas de banano que hay en los 3 camiones.', 'Halla la diferencia entre el precio de venta de una tonelada de banano en la ciudad W y el precio de compra.', 'Multiplica los valores hallados en los pasos 1 y 2.', 'Encuentra los costos totales de transporte y le suma el pago total de los trabajadores en los tres viajes.', 'Halla la diferencia entre el valor obtenido en el paso 3 y el paso 4.'])}
<p>¿Cuál es la ganancia que obtiene el comerciante?</p>`,
  o: ['$ 5.670.000', '$ 5.970.000', '$ 7.470.000', '$ 8.010.000'],
  e: '15 t × (1.000.000 − 400.000) = 9.000.000. Gastos: 3 × 150.000 + 6 × 180.000 = 1.530.000. Ganancia: 9.000.000 − 1.530.000 = $ 7.470.000.' },
{ ctx: 'c', a: 'B', s: `<p>Para diciembre, el comerciante decidió que por cada 5 toneladas del producto transportado en camión y vendido en alguna de las ciudades, cada uno de los dos empleados necesarios por camión recibirá un bono de 0,3 % del dinero recibido en la venta de esas 5 toneladas. En ese mes, dos empleados transportaron y vendieron 47 toneladas de mango a la ciudad W. Para hallar el bono recibido por cada uno de ellos, se ejecutó el siguiente procedimiento:</p>
${steps(['Se dividió el número de toneladas vendidas entre 5 y se halló su residuo.', 'Se restó del número de toneladas vendidas el valor obtenido en el paso 1.', 'Se multiplicó el valor obtenido en el paso 2 por el valor de venta de la tonelada del producto.', 'Al valor obtenido en el paso 3 se le sacó el 0,3 %.'])}
<p>¿De qué valor fue, aproximadamente, el bono recibido por cada empleado?</p>`,
  o: ['526.000 pesos.', '175.000 pesos.', '148.000 pesos.', '87.000 pesos.'],
  e: '47 ÷ 5 deja residuo 2, así que cuentan 45 toneladas. 45 × 1.300.000 = 58.500.000, y el 0,3 % es 175.500 ≈ 175.000 pesos.' },
{ ctx: 'c', a: 'B', s: `<p>Si se transportan 7 toneladas de fruta a la ciudad W y 10 toneladas de fruta a la ciudad Z, ¿cuál es la gráfica que muestra correctamente la relación de costos por ciudad?</p>${img('q12', 720)}`,
  o: ['Gráfica A.', 'Gráfica B.', 'Gráfica C.', 'Gráfica D.'],
  e: 'Cada envío necesita 2 camiones y 4 trabajadores. W: transporte 2 × 150.000 = 300.000 y trabajadores 4 × 180.000 = 720.000. Z: transporte 360.000 y trabajadores 800.000. Así lo muestra la gráfica B.' },
{ ctx: 'c', a: 'D', s: `<p>Durante enero, el comerciante vendió 100 toneladas de mango y 50 de banano, y contrató 10 trabajadores. ¿Qué se puede determinar con esta información?</p>`,
  o: ['La ganancia de los productores.', 'El pago que recibirá cada trabajador en enero.', 'Los costos totales del comerciante.', 'El número mínimo de viajes que se realizaron desde el pueblo.'],
  e: 'Cada camión lleva como máximo 5 toneladas: 150 ÷ 5 = 30 viajes de camión como mínimo. Para lo demás falta saber a qué ciudad se llevó cada carga.' },
{ a: 'B', s: `<p>Si en un rectángulo se aumenta la longitud de uno de sus lados en 100 %, ¿qué se puede concluir de su área?</p>`,
  o: ['Aumenta en un 50 %.', 'Se duplica.', 'No cambia.', 'Aumenta en 100 unidades.'],
  e: 'Aumentar un lado en 100 % es duplicarlo: (2a) × b = 2(a × b). El área se duplica.' },
{ a: 'C', s: `<p>Las sombras proyectadas por dos postes paralelos de 10 metros y 5 metros se muestran en la figura.</p>${img('q15', 380)}
<p>El ángulo entre la acera horizontal y la sombra del poste 1 es α = 30°. De acuerdo con esto, se puede afirmar que el ángulo entre la acera horizontal y la sombra del poste 2 es</p>`,
  o: ['β = 5°.', 'β = 15°.', 'β = 30°.', 'β = 60°.'],
  e: 'Los rayos del sol llegan paralelos a ambos postes, por lo que las sombras forman el mismo ángulo con la acera: β = 30°. La altura del poste cambia la longitud de la sombra, no el ángulo.' },
{ a: 'D', s: `<p>Una escuela de natación cuenta con un total de 16 estudiantes. Para las clases se usan 2 piscinas con distinta profundidad. Por seguridad, las personas con una estatura inferior a 1,80 m se envían a la piscina menos profunda, y las demás, a la más profunda.</p>
<p>Un día, el director de la escuela escucha que el promedio de estatura de las 16 personas es 1,70 m e insiste en aumentar la cantidad de alumnos para que el promedio sea 1,80 m, afirmando que de esta manera se logrará igualar la cantidad de personas en las dos piscinas. ¿Por qué es <b>errónea</b> la afirmación del director?</p>`,
  o: ['Porque las 16 personas se encuentran actualmente en la piscina menos profunda. El director de la escuela debe aceptar otros 16 alumnos con una estatura superior a 1,80 m.', 'Porque con el promedio es imposible determinar la cantidad de personas en las piscinas. Es necesario utilizar otras medidas, como la estatura máxima o mínima de las personas, en lugar de esta.', 'Porque incrementar el promedio a 1,80 m es insuficiente. El director de la escuela debe aceptar más estudiantes con una altura de 1,80 m hasta que la cantidad de alumnos sea igual en ambas piscinas.', 'Porque aunque el promedio de estatura de las 16 personas sea inferior a 1,80 m, no significa que la cantidad de personas en las piscinas sea diferente.'],
  e: 'El promedio no dice cuántas personas están por encima o por debajo de 1,80 m. Por ejemplo, 8 personas de 1,90 m y 8 de 1,50 m dan promedio 1,70 m y ya hay igual cantidad en cada piscina.' },
{ a: 'D', s: `<p>La longitud de las aristas de la caja de la figura son <i>l</i>, <i>a</i> y <i>h</i>.</p>${img('q17', 320)}<p>¿Cuál de las siguientes expresiones determina la longitud total de las aristas de la caja?</p>`,
  o: ['<i>lah</i>', '4<i>lah</i>', '<i>l</i> + <i>a</i> + <i>h</i>', '4<i>l</i> + 4<i>a</i> + 4<i>h</i>'],
  e: 'Una caja tiene 12 aristas: 4 de largo l, 4 de ancho a y 4 de alto h. Total: 4l + 4a + 4h. La expresión lah es el volumen.' },
{ a: 'C', s: `<p>Un barco navega entre dos faros, ubicados en la parte inferior de la figura.</p>${img('q18', 400)}
<p>En el instante en que el ángulo formado entre el barco, el faro superior y cualquiera de los otros faros es de 45°, ¿cuál es la distancia <i>x</i> entre el faro superior y el barco?</p>`,
  o: [`<i>x</i> = ${F('2 sen(30°)', 'sen(45°)')}`, `<i>x</i> = ${F('2 sen(60°)', 'sen(45°)')}`, `<i>x</i> = ${F('sen(60°)', 'sen(75°)')}`, `<i>x</i> = ${F('sen(30°)', 'sen(60°)')}`],
  e: 'En el triángulo faro superior–barco–faro derecho: el lado 1 está frente al ángulo de 75° (en el barco) y x está frente al ángulo de 60°. Por ley del seno: x / sen 60° = 1 / sen 75°, entonces x = sen 60° / sen 75°.' },
{ a: 'B', s: `<p>En una feria robótica, el robot P y el robot Q disputan un juego de tenis de mesa. En el momento en que el marcador se encuentra 7 a 2 a favor del robot P, estos se reprograman de tal forma que por cada 2 puntos que anota el robot P, el robot Q anota 3. ¿Cuál de las siguientes ecuaciones permite determinar cuándo igualará en puntos el robot Q al robot P?</p>`,
  o: [`${F(3, 2)}<i>x</i> = 0. Donde <i>x</i> es la cantidad de puntos que anotará P.`, `7 + <i>x</i> = ${F(3, 2)}<i>x</i> + 2. Donde <i>x</i> es la cantidad de puntos que anotará P.`, '7 + 3<i>x</i> = 2 + 2<i>y</i>. Donde <i>x</i> es la cantidad de puntos que anotará P, y <i>y</i> es la cantidad de puntos que anotará Q.', '<i>x</i> + <i>y</i> = 7 + 2. Donde <i>x</i> es la cantidad de puntos que anotará P, y <i>y</i> es la cantidad de puntos que anotará Q.'],
  e: 'Si P anota x puntos, Q anota (3/2)x. Se igualan cuando 7 + x = 2 + (3/2)x (ocurre con x = 10: ambos llegan a 17).' },
{ a: 'A', s: `<p>La tabla presenta la información sobre el gasto en publicidad y las ganancias de una empresa durante los años 2020 a 2022.</p>
${tbl([['Año', 'Gasto en publicidad*', 'Ganancia obtenida*'], ['2020', '200', '8.000'], ['2021', '280', '10.400'], ['2022', '250', '9.500']])}<p class="note">*Datos en millones de pesos.</p>
<p>¿Cuál es la función que representa la ganancia obtenida G, en millones de pesos, en función del gasto en publicidad <i>p</i>?</p>`,
  o: ['G(<i>p</i>) = 30<i>p</i> + 2.000', 'G(<i>p</i>) = 10<i>p</i>', 'G(<i>p</i>) = 40<i>p</i>', 'G(<i>p</i>) = 40<i>p</i> − 800'],
  e: 'Se comprueba con los tres datos: 30(200) + 2.000 = 8.000; 30(280) + 2.000 = 10.400; 30(250) + 2.000 = 9.500. Las otras funciones fallan con al menos un año.' },
{ a: 'A', s: `<p>En una tienda se venden mesas a $ 40.000 y sillas a $ 20.000. El dueño de la tienda olvidó registrar la cantidad total de mesas y sillas que se vendieron, pero sabe que los ingresos por ventas del mes fueron de $ 1.400.000 y que se vendieron 3 veces más sillas que mesas. Para determinar la cantidad vendida de cada artículo, siendo M la cantidad de mesas y S la de sillas vendidas, representó la información con las siguientes ecuaciones:</p>
<p class="eq"><b>Ecuación 1.</b> 40.000M + 20.000S = 1.400.000<br><b>Ecuación 2.</b> M = 3S</p><p>¿Las ecuaciones representan correctamente la situación?</p>`,
  o: ['No, porque aunque la ecuación 1 relaciona cada precio con la variable adecuada de forma correcta, la ecuación 2 significa que se venden 3 veces más mesas que sillas.', 'Sí, porque la ecuación 1 relaciona cada precio con la variable adecuada y la ecuación 2 tiene en cuenta que la cantidad de sillas es 3 veces mayor que la de mesas.', 'No, porque aunque la ecuación 2 tiene en cuenta que la cantidad de sillas es 3 veces mayor que la de mesas, en la ecuación 1 los precios deberían estar dividiendo y no multiplicando.', 'Sí, porque al solucionar las dos ecuaciones se obtiene un número entero, lo cual es consistente con las condiciones iniciales del problema.'],
  e: 'La ecuación 1 está bien. Pero “3 veces más sillas que mesas” se escribe S = 3M. La ecuación M = 3S dice lo contrario.' },
{ a: 'C', s: `<p>La línea punteada en la figura muestra un corte realizado a un triángulo. El corte es paralelo a la base y corta por la mitad a la altura, <i>h</i>, que es perpendicular a la base.</p>${img('q22', 300)}
<p>Para realizar el corte, se determinó la altura del triángulo usando la fórmula sen(45°) = ${F('<i>h</i>', 120)}; luego se dividió <i>h</i> entre dos. Realizando este procedimiento, y teniendo en cuenta que sen(45°) = ${F(R(2), 2)} ≈ 0,71, ¿cuál fue, aproximadamente, la distancia a la que se cortó la altura del triángulo?</p>`,
  o: ['85 cm.', '60 cm.', '42 cm.', '30 cm.'],
  e: 'h = 120 × 0,71 ≈ 85 cm. La mitad es 85 ÷ 2 ≈ 42 cm. (85 cm es la altura completa, no el corte).' },
{ a: 'B', s: `<p>Un cartabón es una plantilla que se utiliza en dibujo técnico y que tiene forma de triángulo rectángulo escaleno, de modo que su hipotenusa mide el doble del cateto de menor longitud.</p>${img('q23', 480)}
<p>Si el cateto más largo de un cartabón mide 32 centímetros, como muestra la figura, ¿cuál de las siguientes medidas corresponde a su cateto menor?</p>`,
  o: ['16 cm.', `${F(32, R(3))} cm.`, '27 cm.', `${F(64, R(3))} cm.`],
  e: 'Es un triángulo 30°-60°-90°. El cateto menor c está frente a 30°, y tan 60° = 32 / c = √3, entonces c = 32/√3 cm (≈ 18,5 cm). 64/√3 es la hipotenusa.' },
{ a: 'D', s: `<p>Una profesora de Matemáticas le entrega a sus estudiantes un cuadrado cuya área es 1 dm². En el cuadrado se encuentra la construcción de la Figura 1.</p>${img('q24a', 220)}
<p><i>P, Q, R</i> y <i>S</i> son los puntos medios de cada lado. La profesora le pide a sus estudiantes que calculen el área del paralelogramo sombreado, para lo cual Eloísa razona de la siguiente manera: “Si se mueven los triángulos de las esquinas es posible obtener una figura con cuatro paralelogramos congruentes al sombreado”. En la Figura 2 se muestra la construcción hecha por Eloísa.</p>${img('q24b', 220)}
<p>Eloísa concluye: “Como el área de esta figura es igual al área del cuadrado inicial, cada paralelogramo tiene un área de ${F(1, 4)} dm²”.</p>
<p>Al ver la solución de Eloísa, la profesora le dice: “Excelente idea; usa una estrategia similar para hallar fácilmente el área del cuadrado sombreado en la Figura 3. Recuerda que el cuadrado grande tiene 1 dm² de área”.</p>${img('q24c', 220)}
<p>¿Cuál es el área del cuadrado sombreado en la Figura 3?</p>`,
  o: [`${F(1, 9)} dm²`, `${F(1, 8)} dm²`, `${F(1, 6)} dm²`, `${F(1, 5)} dm²`],
  e: 'Al mover los cuatro triángulos que quedan fuera del cuadrito sombreado, cada uno completa un cuadrado igual al sombreado. El cuadrado grande queda formado por 5 cuadrados iguales, así que el sombreado mide 1/5 dm².' },
{ a: 'A', s: `<p>El sistema de comunicaciones de un hotel utiliza los dígitos 2, 3, 4 y 5 para asignar un número de extensión telefónica de 4 dígitos diferentes a cada habitación. ¿Cuántas habitaciones del hotel pueden tener extensión telefónica?</p>`,
  o: ['24', '56', '120', '256'],
  e: 'Son permutaciones de 4 dígitos sin repetir: 4 × 3 × 2 × 1 = 24. (256 = 4⁴ sería con repetición).' },
{ a: 'C', s: `<p>A continuación, se muestran los resultados de una encuesta que indagó sobre el parque automotor del transporte intermunicipal en Colombia.</p>${img('q26', 620)}<p>Según la información anterior, ¿cuál de las siguientes afirmaciones es verdadera?</p>`,
  o: ['La mayor parte del parque automotor son automóviles, camionetas y camperos.', 'La mitad del parque automotor corresponde a automóviles, camionetas y camperos.', 'La mayor parte del parque automotor son buses, microbuses y busetas.', 'La mitad del parque automotor corresponde a buses, microbuses y busetas.'],
  e: 'Bus (24 %) + microbús (23 %) + buseta (18 %) suman 65 %, más de la mitad. Automóvil, camioneta y campero suman 18 % + 9 % + 7 % = 34 %.' },
{ a: 'A', s: `<p>Una prueba atlética tiene un récord mundial de 10,49 segundos y un récord olímpico de 10,50 segundos. ¿Es posible que un atleta registre un tiempo, en el mismo tipo de prueba, que rompa el récord olímpico pero no el mundial?</p>`,
  o: ['Sí, porque puede registrar, por ejemplo, un tiempo de 10,497 segundos, que está entre los dos tiempos récord.', 'Sí, porque puede registrar un tiempo menor que 10,4 y marcaría un nuevo récord.', 'No, porque no existe un registro posible entre los dos tiempos récord.', 'No, porque cualquier registro menor que el récord olímpico va a ser menor que el récord mundial.'],
  e: 'Entre dos decimales siempre hay otros: 10,49 < 10,497 < 10,50. Ese tiempo rompe el olímpico (es menor que 10,50) sin romper el mundial (es mayor que 10,49).' },
{ a: 'A', s: `<p>En una institución educativa hay dos cursos en grado undécimo. El número de hombres y mujeres de cada curso se relaciona en la tabla:</p>
${tbl([['', 'Curso 11A', 'Curso 11B', 'Total'], ['Número de mujeres', '22', '23', '45'], ['Número de hombres', '18', '12', '30'], ['Total', '40', '35', '75']])}
<p>La probabilidad de escoger un estudiante de grado undécimo, de esta institución, que sea mujer es de ${F(3, 5)}. Si se sabe que uno de los valores de esta razón es el número total de mujeres, ¿cuál es el otro valor?</p>`,
  o: ['El número total de estudiantes de grado undécimo.', 'El número total de hombres de grado undécimo.', 'El número total de mujeres del curso 11 B.', 'El número total de hombres del curso 11 A.'],
  e: 'Probabilidad = casos favorables / casos posibles = 45 mujeres / 75 estudiantes = 3/5.' },
{ a: 'C', s: `<p>Para fijar un aviso publicitario se coloca sobre un muro una escalera a 12 metros del suelo como se muestra en las siguientes figuras.</p>${img('q29', 400)}<p>¿Cuál es el coseno del ángulo θ que forman el suelo y la escalera?</p>`,
  o: [F(12, 13), F(12, 5), F(5, 13), F(13, 5)],
  e: 'Catetos 12 y 5, hipotenusa 13. El coseno es cateto adyacente / hipotenusa = 5/13. (12/13 es el seno).' },
{ a: 'B', s: `<p>En la tabla se presentan las cartas que conforman una baraja de póquer.</p>${img('q30', 420)}
<p>Si la probabilidad de escoger una carta que cumpla dos características determinadas es cero, ¿cuáles características podrían ser?</p>`,
  o: ['Ser una carta negra y ser un número par.', 'Ser una carta roja y ser de picas.', 'Ser una carta de corazones y ser un número impar.', 'Ser una carta roja K y ser de diamantes.'],
  e: 'Las picas son negras: no existe una carta roja de picas, así que la probabilidad es 0. Las demás combinaciones sí existen (por ejemplo, la K de diamantes).' },
{ a: 'B', s: `<p>Un profesor de Matemáticas les pide a sus estudiantes solucionar la siguiente ecuación:</p><p class="eq">(<i>x</i> + 2)(<i>x</i> + 3) = 5(<i>x</i> + 3)</p>
<p>María, Nelson y Óscar realizan, cada uno, los siguientes procedimientos:</p>
<div class="three"><div><b>María</b><span>x² + 5x + 6 = 5x + 15</span><span>x² + 6 = 15</span><span>x² = 15 − 6</span><span>x² = 9</span><span>x = ±3</span></div>
<div><b>Nelson</b><span>(x + 2)(x + 3) − 5(x + 3) = 0</span><span>(x + 3)[(x + 2) − 5] = 0</span><span>(x + 3)(x − 3) = 0</span><span>x² − 9 = 0</span><span>x² = 9</span><span>x = ±3</span></div>
<div><b>Óscar</b><span>x + 2 + x + 3 = 5 + x + 3</span><span>2x + 5 = x + 8</span><span>2x − x = 8 − 5</span><span>x = 3</span></div></div>
<p>¿Cuál(es) estudiante(s) desarrolló(aron) un procedimiento correcto para solucionar la ecuación?</p>`,
  o: ['Solo Nelson y Óscar.', 'Solo María y Nelson.', 'Solamente Óscar.', 'Solamente María.'],
  e: 'María desarrolla los productos correctamente y Nelson factoriza (x + 3). Los dos llegan a x = ±3, y ambas soluciones cumplen la ecuación. Óscar convierte los productos en sumas, lo cual no es válido, y pierde x = −3.' },
{ a: 'B', s: `<p>Un trapecio isósceles es un trapecio cuyos lados no paralelos son congruentes. En un plano cartesiano se dibuja un trapecio isósceles de modo que el eje <i>y</i> divide al trapecio en dos figuras iguales.</p>
<p>Si las coordenadas de dos de los vértices del trapecio son (−4, 2) y (−2, 8), ¿cuáles son las coordenadas de los otros dos vértices?</p>`,
  o: ['(8, 2) y (2, 4).', '(2, 8) y (4, 2).', '(−2, −4) y (−8, −2).', '(−4, −2) y (−2, −8).'],
  e: 'Si el eje y es eje de simetría, cada vértice (x, y) tiene su reflejo en (−x, y): (−4, 2) → (4, 2) y (−2, 8) → (2, 8).' },
{ a: 'D', s: `<p>En una fábrica se aplica una encuesta a los empleados para saber el medio de transporte que usan para llegar al trabajo, y luego decidir si se implementa un servicio de ruta. Los resultados mostraron, entre otras, estas tres conclusiones sobre un grupo de 100 empleados que viven cerca de la fábrica y que se desplazan únicamente en bus o a pie:</p>
<ul class="bul"><li>El 60 % del grupo son mujeres.</li><li>El 20 % de las mujeres se desplazan en bus.</li><li>El 40 % de los hombres se desplazan caminando.</li></ul>
<p>¿Cuál de las siguientes tablas representa correctamente la información obtenida de ese grupo?</p>`,
  o: [t33(40, 60, 60, 40), t33(34, 12, 16, 38), t33(0, 20, 40, 40), t33(24, 12, 16, 48)],
  e: 'Mujeres: 60, de las cuales el 20 % (12) va en bus y 48 caminan. Hombres: 40, de los cuales el 40 % (16) camina y 24 van en bus.' },
{ a: 'C', s: `<p>Una regla usada en física indica que, para aumentar el nivel de intensidad del sonido en 10 dB (dB es decibelios, la unidad de medida del nivel de intensidad del sonido), es necesario que la intensidad medida se multiplique por 10. Ramiro es el encargado de aumentar en 20 dB la medida del nivel de intensidad del sistema de sonido de un evento y, según su interpretación de la regla, multiplica por 20 la intensidad actual del sistema. ¿Es correcta su interpretación?</p>`,
  o: ['No, porque la regla no considera aumentos de 20 dB, solamente de 10 dB; no hay consideraciones para aumentos mayores.', 'Sí, porque la regla presentada indica que para aumentar en x unidades el nivel de la medida de intensidad se agrega x a la intensidad.', 'No, porque aumentar 20 dB equivale a aumentar 10 dB dos veces, es decir, multiplicar por 10 la intensidad dos veces; en total, multiplicar por 100.', 'Sí, porque el resultado de multiplicar dos veces por 10 la intensidad es multiplicarla por 20; así, se ahorra un paso y obtiene el resultado correcto.'],

{ a: 'B', s: `<p>En una librería se ofrece un descuento del 10 % sobre el precio original de todos los libros impresos. Juan tiene un cupón de descuento adicional del 10 % sobre el precio de venta, el cual incluye el descuento inicial. Para saber cuánto debe pagar por un libro cuyo precio original es de $ 50, Juan efectúa el siguiente procedimiento:</p>

  o: ['En el paso 1, porque el precio de venta es el 90 % del precio original, por tanto, debe multiplicarse por 90 y no por 9.', 'En el paso 3, porque el precio final es el 90 % del precio de venta, por tanto, debe multiplicarse por 90 y no por 10.', 'En el paso 2, porque para calcular el precio al aplicar un porcentaje de descuento es necesario dividir entre 100 y no entre 10.', 'En el paso 4, porque solo es necesario dividir una vez para calcular el precio final; es suficiente con la división del paso 2.'],

{ a: 'C', s: `<p>En una bolsa hay 3 bolas rojas, 3 negras y 12 blancas. Una persona afirma que al sacar una bola al azar, los tres colores tienen la misma probabilidad de salir. ¿Es verdadera esta afirmación?</p>`,

{ a: 'B', s: `<p>Sobre una circunferencia de centro O se localizan dos puntos P y P’ diferentes. De las siguientes, ¿cuál figura <b>NO</b> puede resultar al unir entre sí los tres puntos P, P’ y O?</p>`,

{ a: 'C', s: `<p>Un sistema de información requiere que los usuarios ingresen una contraseña de solo tres caracteres de entre las 26 letras posibles, en minúscula o mayúscula, y los 10 dígitos del 0 al 9. Un ingeniero propone las siguientes posibles restricciones para la contraseña:</p>

{ a: 'B', s: `<p>Entre los 16 estudiantes de un salón de clases se va a rifar una boleta para ingresar a un parque de diversiones. Cada estudiante debe escoger un número del 3 al 18. El sorteo se efectúa de la siguiente manera: se depositan 6 balotas en una urna, cada una numerada del 1 al 6; se extrae una balota, se mira el número y se vuelve a depositar en la urna. El experimento se repite dos veces más. La suma de los tres puntajes obtenidos determina el número ganador de la rifa.</p>

// Gráficas SVG simples para las preguntas del banco complementario
const LG = (series, o = {}) => {
  const W = 360, H = 250, L = 44, B = 34, T = 26, Rr = 14;
  const { xmin = 0, xmax = 10, ymin = 0, ymax = 10, xstep = 1, ystep = 1, xl = 'x', yl = 'y', dots = true } = o;
  const sx = x => L + (x - xmin) / (xmax - xmin) * (W - L - Rr);
  const sy = y => H - B - (y - ymin) / (ymax - ymin) * (H - B - T);
  let g = '';
  for (let x = xmin; x <= xmax + 1e-9; x += xstep) g += `<line x1="${sx(x)}" y1="${sy(ymin)}" x2="${sx(x)}" y2="${sy(ymax)}" class="gl"/><text x="${sx(x)}" y="${H - B + 14}" class="tk" text-anchor="middle">${+x.toFixed(2)}</text>`;
  for (let y = ymin; y <= ymax + 1e-9; y += ystep) g += `<line x1="${sx(xmin)}" y1="${sy(y)}" x2="${sx(xmax)}" y2="${sy(y)}" class="gl"/><text x="${L - 6}" y="${sy(y) + 4}" class="tk" text-anchor="end">${+y.toFixed(2)}</text>`;
  const ax0 = ymin <= 0 && ymax >= 0 ? sy(0) : sy(ymin), ay0 = xmin <= 0 && xmax >= 0 ? sx(0) : sx(xmin);
  g += `<line x1="${sx(xmin)}" y1="${ax0}" x2="${sx(xmax)}" y2="${ax0}" class="ax"/><line x1="${ay0}" y1="${sy(ymin)}" x2="${ay0}" y2="${sy(ymax)}" class="ax"/>`;
  g += `<text x="${W - 4}" y="${H - 4}" class="lb" text-anchor="end">${xl}</text><text x="${L - 30}" y="13" class="lb">${yl}</text>`;
  series.forEach((s, i) => {
    g += `<polyline points="${s.pts.map(p => sx(p[0]) + ',' + sy(p[1])).join(' ')}" class="ln s${i}" fill="none"/>`;
    if (dots && s.dots !== false) s.pts.forEach(p => g += `<circle cx="${sx(p[0])}" cy="${sy(p[1])}" r="3" class="dt s${i}"/>`);
    if (s.label) { const p = s.pts[s.pts.length - 1]; g += `<text x="${sx(p[0]) - 4}" y="${sy(p[1]) - 7}" class="lb s${i}t" text-anchor="end">${s.label}</text>`; }
  });
  return `<figure class="svgf"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Gráfica">${g}</svg></figure>`;
};
const BG = (labels, values, o = {}) => {
  const W = 360, H = 240, L = 44, B = 40, T = 26, Rr = 10;
  const { ymax = Math.max(...values), ystep = Math.ceil(ymax / 5), yl = '' } = o;
  const n = labels.length, bw = (W - L - Rr) / n;
  const sy = y => H - B - y / ymax * (H - B - T);
  let g = '';
  for (let y = 0; y <= ymax + 1e-9; y += ystep) g += `<line x1="${L}" y1="${sy(y)}" x2="${W - Rr}" y2="${sy(y)}" class="gl"/><text x="${L - 6}" y="${sy(y) + 4}" class="tk" text-anchor="end">${y}</text>`;
  labels.forEach((lb, i) => {
    const x = L + i * bw + bw * 0.18, w = bw * 0.64;
    g += `<rect x="${x}" y="${sy(values[i])}" width="${w}" height="${sy(0) - sy(values[i])}" class="bar" rx="2"/><text x="${x + w / 2}" y="${H - B + 15}" class="tk" text-anchor="middle">${lb}</text>`;
  });
  g += `<line x1="${L}" y1="${sy(0)}" x2="${W - Rr}" y2="${sy(0)}" class="ax"/><text x="${L - 30}" y="13" class="lb">${yl}</text>`;
  if (o.xl) g += `<text x="${(W + L) / 2}" y="${H - 6}" class="lb" text-anchor="middle">${o.xl}</text>`;
  return `<figure class="svgf"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="Diagrama de barras">${g}</svg></figure>`;
};

N('V','F','Interceptos','<p>¿En qué punto corta la recta <i>y</i> = −2<i>x</i> + 8 al eje <i>x</i>?</p>',
['(4, 0)','(0, 8)','(−4, 0)','(8, 0)'],'En el eje x, y = 0: −2x + 8 = 0, entonces x = 4. (0, 8) es el corte con el eje y.');
N('V','A','Proporcionalidad y linealidad','<p>Pedro afirma que en la relación <i>y</i> = 3<i>x</i> + 2, la variable <i>y</i> es directamente proporcional a <i>x</i>. ¿Es correcta su afirmación?</p>',
['No, porque el cociente y/x no es constante; por ejemplo, si x = 1, y = 5, y si x = 2, y = 8.','Sí, porque cuando x aumenta, y también aumenta.','Sí, porque la gráfica es una línea recta.','No, porque la pendiente es positiva.'],'La proporcionalidad directa es de la forma y = kx y su gráfica pasa por el origen. Aquí el término +2 lo impide: al duplicar x, y no se duplica.');
N('V','F','Modelación lineal','<p>La batería de un celular está al 100 % y se descarga 8 % cada hora de uso continuo. ¿Después de cuántas horas de uso la batería estará en 20 %?</p>',
['10 horas','12,5 horas','8 horas','2,5 horas'],'100 − 8t = 20, entonces 8t = 80 y t = 10 horas.');
N('V','F','Despeje de fórmulas',`<p>La fórmula para convertir grados Celsius a Fahrenheit es F = ${F(9,5)}C + 32. ¿Cuál expresión permite hallar C a partir de F?</p>`,

N('V','F','Despeje de fórmulas',`<p>Usando la relación C = ${F(5,9)}(F − 32), ¿a cuántos grados Celsius equivalen 86 °F?</p>`,
['30 °C','54 °C','47,8 °C','18 °C'],'C = 5/9 × (86 − 32) = 5/9 × 54 = 30 °C.');
N('V','F','Modelación lineal','<p>Ana tiene $ 50.000 ahorrados y cada semana ahorra $ 15.000 más. ¿Cuántas semanas necesita para tener $ 200.000?</p>',
['10 semanas','13 semanas','15 semanas','8 semanas'],'50.000 + 15.000s = 200.000, entonces 15.000s = 150.000 y s = 10.');
N('V','I','Gráficas distancia-tiempo',`<p>La gráfica muestra la distancia recorrida por un grupo de caminantes durante una excursión.</p>${LG([{pts:[[0,0],[1,4],[2,4],[3,10]]}],{xmax:3,ymax:10,ystep:2,xl:'Tiempo (h)',yl:'Distancia (km)'})}<p>¿En qué intervalo de tiempo el grupo permaneció detenido?</p>`,
['Entre la hora 1 y la hora 2.','Entre la hora 0 y la hora 1.','Entre la hora 2 y la hora 3.','En ningún momento, porque la distancia siempre aumenta.'],'Entre 1 h y 2 h la distancia se mantiene en 4 km (segmento horizontal): no hubo desplazamiento.');
N('V','I','Gráficas distancia-tiempo',`<p>La gráfica muestra la distancia recorrida por un grupo de caminantes durante una excursión.</p>${LG([{pts:[[0,0],[1,4],[2,4],[3,10]]}],{xmax:3,ymax:10,ystep:2,xl:'Tiempo (h)',yl:'Distancia (km)'})}<p>¿En qué tramo caminaron con mayor velocidad?</p>`,
['Entre la hora 2 y la hora 3, a 6 km/h.','Entre la hora 0 y la hora 1, a 4 km/h.','Entre la hora 1 y la hora 2, a 4 km/h.','Entre la hora 2 y la hora 3, a 10 km/h.'],'La velocidad es la pendiente de cada tramo: 4 km/h en el primero, 0 en el segundo y (10 − 4)/1 = 6 km/h en el tercero.');
N('V','I','Solución gráfica de sistemas',`<p>La gráfica muestra las rectas <i>y</i> = <i>x</i> + 1 y <i>y</i> = −<i>x</i> + 5.</p>${LG([{pts:[[0,1],[5,6]],label:'y = x + 1',dots:false},{pts:[[0,5],[5,0]],label:'y = −x + 5',dots:false}],{xmax:5,ymax:6})}<p>¿Cuál es la solución del sistema formado por las dos ecuaciones?</p>`,
['<i>x</i> = 2, <i>y</i> = 3','<i>x</i> = 3, <i>y</i> = 2','<i>x</i> = 1, <i>y</i> = 5','<i>x</i> = 0, <i>y</i> = 1'],'La solución es el punto de corte. x + 1 = −x + 5 da x = 2 y y = 3.');
N('V','A','Sistemas sin solución','<p>Un estudiante intenta resolver el sistema <i>y</i> = 2<i>x</i> + 1 y <i>y</i> = 2<i>x</i> − 3, y concluye que no tiene solución. ¿Por qué tiene razón?</p>',
['Porque las rectas tienen la misma pendiente y distinto intercepto, así que son paralelas y nunca se cortan.','Porque las dos rectas son la misma y tienen infinitos puntos en común.','Porque las rectas son perpendiculares.','Porque los interceptos son números de distinto signo.'],'Igualando: 2x + 1 = 2x − 3 lleva a 1 = −3, que es falso. Gráficamente son rectas paralelas distintas.');
N('V','F','Ecuaciones con fracciones',`<p>¿Qué valor de <i>x</i> satisface ${F('<i>x</i>',3)} + ${F('<i>x</i>',4)} = 14?</p>`,

N('V','I','Modelación lineal','<p>Un vendedor gana un salario básico de $ 1.300.000 más una comisión del 5 % sobre sus ventas mensuales V. ¿Qué expresión representa su salario S?</p>',
['S = 1.300.000 + 0,05V','S = 1.300.000 × 0,05V','S = 1.300.000 + 5V','S = 0,05(1.300.000 + V)'],'La comisión es el 5 % de las ventas (0,05V) y se suma al básico.');
N('V','F','Modelación lineal','<p>Un vendedor gana S = 1.300.000 + 0,05V pesos, donde V son sus ventas mensuales. ¿Cuánto debe vender en un mes para ganar $ 2.000.000?</p>',
['$ 14.000.000','$ 700.000','$ 35.000','$ 40.000.000'],'0,05V = 700.000, entonces V = 700.000 ÷ 0,05 = 14.000.000.');
N('V','F','Punto de equilibrio','<p>Una microempresa vende cada artículo a $ 12.000. Producir cada uno cuesta $ 4.000 y además tiene gastos fijos mensuales de $ 200.000. ¿Cuántos artículos debe vender al mes para no ganar ni perder?</p>',
['25','17','50','20'],'Ingresos = costos: 12.000x = 4.000x + 200.000, entonces 8.000x = 200.000 y x = 25.');
N('V','F','Funciones de utilidad','<p>Una microempresa tiene ingresos I(<i>x</i>) = 12.000<i>x</i> y costos C(<i>x</i>) = 4.000<i>x</i> + 200.000, donde <i>x</i> es la cantidad de artículos vendidos. ¿Cuál es la utilidad si vende 40 artículos?</p>',
['$ 120.000','$ 320.000','$ 480.000','$ 280.000'],'Utilidad = I − C = 480.000 − 360.000 = 120.000.');
N('V','A','Errores en procedimientos','<p>Luis resolvió la ecuación 2<i>x</i> + 6 = 10 así:<br>Paso 1: 2<i>x</i> = 10 + 6<br>Paso 2: 2<i>x</i> = 16<br>Paso 3: <i>x</i> = 8<br>¿Es correcto su procedimiento?</p>',
['No, en el paso 1 debía restar 6 en ambos lados: 2x = 4 y x = 2.','Sí, porque al pasar un término al otro lado se suma.','No, en el paso 3 debía multiplicar por 2 y obtener x = 32.','Sí, porque 2(8) = 16.'],'Para eliminar +6 se resta 6 en ambos lados. Comprobación: 2(8) + 6 = 22 ≠ 10, y 2(2) + 6 = 10.');
N('V','F','Ecuaciones y área','<p>El largo de un rectángulo mide 3 cm más que su ancho y su perímetro es 26 cm. ¿Cuál es su área?</p>',

N('V','I','Modelos lineales con tablas',`<p>La tabla muestra el valor de la factura de energía de una familia según su consumo.</p>${tbl([['Consumo (kWh)','100','150','200'],['Valor a pagar','$ 70.000','$ 97.500','$ 125.000']])}<p>Si la factura se compone de un cargo fijo más un valor por kWh, ¿cuál es el cargo fijo?</p>`,
['$ 15.000','$ 70.000','$ 550','$ 27.500'],'Cada 50 kWh adicionales cuestan 27.500, es decir, 550 por kWh. Para 100 kWh: 70.000 − 100 × 550 = 15.000.');
N('V','F','Inecuaciones en contexto','<p>Un ascensor soporta máximo 600 kg. Un operario de 80 kg debe subir cajas de 26 kg cada una. ¿Cuál es el máximo número de cajas que puede subir en un solo viaje junto con él?</p>',
['20','23','21','19'],'80 + 26c ≤ 600, entonces 26c ≤ 520 y c ≤ 20.');
N('V','F','Problemas de mezclas','<p>Un comerciante mezcla café de $ 20.000 el kilo con café de $ 30.000 el kilo para obtener 10 kg de mezcla que valga $ 24.000 el kilo. ¿Cuántos kilos del café de $ 20.000 debe usar?</p>',
['6 kg','4 kg','5 kg','7 kg'],'x + y = 10 y 20.000x + 30.000y = 240.000. Reemplazando y = 10 − x: −10.000x = −60.000, luego x = 6.');
N('V','I','Puntos de una recta',`<p>¿Cuál de los siguientes puntos pertenece a la recta <i>y</i> = −${F('<i>x</i>',2)} + 3?</p>`,
['(4, 1)','(2, 4)','(−2, 2)','(6, 1)'],'Para x = 4: y = −2 + 3 = 1. En los demás casos la igualdad no se cumple.');
N('V','F','Ecuación de la recta','<p>¿Cuál es la ecuación de la recta que pasa por los puntos (0, −2) y (3, 4)?</p>',
['<i>y</i> = 2<i>x</i> − 2','<i>y</i> = −2<i>x</i> + 4','<i>y</i> = ½<i>x</i> − 2','<i>y</i> = 2<i>x</i> + 4'],'Pendiente: (4 − (−2))/3 = 2. El corte con el eje y es −2.');
N('V','A','Proporcionalidad inversa',`<p>El tiempo t (en horas) para recorrer 120 km a velocidad constante <i>v</i> (en km/h) es t = ${F(120,'<i>v</i>')}. Marcela afirma que si se duplica la velocidad, el tiempo se reduce a la mitad. ¿Es correcta su afirmación?</p>`,
['Sí, porque t y v son inversamente proporcionales: 120/(2v) = ½ · (120/v).','No, porque al duplicar la velocidad el tiempo también se duplica.','No, porque el tiempo disminuye en 2 horas.','Sí, pero solo si la velocidad es mayor que 60 km/h.'],'En la proporcionalidad inversa, el producto t · v = 120 es constante, así que multiplicar v por 2 divide t entre 2.');
N('V','F','Ecuaciones con valor absoluto','<p>¿Cuáles son las soluciones de la ecuación |<i>x</i> − 3| = 5?</p>',
['<i>x</i> = 8 y <i>x</i> = −2','<i>x</i> = 8 únicamente','<i>x</i> = 2 y <i>x</i> = −8','<i>x</i> = −2 únicamente'],'x − 3 = 5 da x = 8, y x − 3 = −5 da x = −2. Ambos están a 5 unidades de 3.');
N('V','F','Planteamiento de ecuaciones','<p>La suma de tres números enteros consecutivos es 72. ¿Cuál es el mayor de ellos?</p>',

N('V','F','Modelación lineal',`<p>La tabla muestra la altura de una planta durante sus primeras semanas.</p>${tbl([['Semana','0','1','2','3'],['Altura (cm)','2','3,5','5','6,5']])}<p>Si el crecimiento continúa con el mismo patrón, ¿qué altura tendrá la planta en la semana 10?</p>`,
['17 cm','15 cm','21,5 cm','20 cm'],'Crece 1,5 cm por semana: h = 2 + 1,5s. Para s = 10: 2 + 15 = 17 cm.');
N('V','A','Validez de modelos','<p>Una planta crece según el modelo h = 2 + 1,5s, donde h es la altura en centímetros y s el número de semanas, según los datos de sus primeras 3 semanas. Un estudiante concluye que en la semana 100 la planta medirá 152 cm. ¿Es confiable esta conclusión?</p>',
['No necesariamente, porque el modelo describe solo las semanas observadas y el crecimiento de una planta no suele mantenerse constante indefinidamente.','Sí, porque el modelo lineal es exacto para cualquier valor de s.','No, porque al reemplazar s = 100 se obtiene 150 cm.','Sí, porque la pendiente del modelo es positiva.'],'El cálculo es correcto (2 + 150 = 152), pero extrapolar tan lejos de los datos supone que el ritmo nunca cambia. Esa es una limitación del modelo.');
N('V','F','Despeje de fórmulas',`<p>El área de un triángulo es A = ${F('<i>b</i> · <i>h</i>',2)}. ¿Qué expresión permite calcular la altura <i>h</i>?</p>`,
[`<i>h</i> = ${F('2A','<i>b</i>')}`,`<i>h</i> = ${F('A','2<i>b</i>')}`,`<i>h</i> = 2A<i>b</i>`,`<i>h</i> = ${F('<i>b</i>','2A')}`],'Multiplicando por 2: 2A = bh. Dividiendo entre b: h = 2A/b.');
N('V','F','Razón de cambio','<p>¿Cuál es la razón de cambio promedio de la función <i>f</i>(<i>x</i>) = <i>x</i><sup>2</sup> entre <i>x</i> = 1 y <i>x</i> = 3?</p>',
['4','8','2','9'],'[f(3) − f(1)]/(3 − 1) = (9 − 1)/2 = 4.');
N('V','F','Depreciación lineal','<p>Un computador de $ 3.000.000 pierde $ 400.000 de su valor cada año. ¿Después de cuántos años tendrá un valor de $ 1.000.000?</p>',

N('V','I','Interpretación de parámetros','<p>El valor de una máquina, en pesos, después de <i>t</i> años es V(<i>t</i>) = 3.000.000 − 400.000<i>t</i>. ¿Qué representa 3.000.000?</p>',
['El valor de la máquina en el momento de comprarla.','La pérdida de valor de la máquina cada año.','El valor de la máquina después de un año.','El número de años que dura la máquina.'],'Para t = 0, V(0) = 3.000.000: es el valor inicial (el intercepto). El −400.000 es la pérdida anual.');
N('V','I','Representación gráfica','<p>¿Qué descripción corresponde a la gráfica de la recta <i>y</i> = −2<i>x</i> + 4?</p>',
['Una recta decreciente que corta el eje y en 4 y el eje x en 2.','Una recta creciente que corta el eje y en 4 y el eje x en −2.','Una recta decreciente que corta el eje y en −2 y el eje x en 4.','Una recta horizontal que pasa por y = 4.'],'La pendiente −2 indica que decrece. Para x = 0, y = 4. Para y = 0, x = 2.');
N('V','A','Errores en procedimientos','<p>Para resolver <i>x</i><sup>2</sup> = 4<i>x</i>, Marta dividió ambos lados entre <i>x</i> y obtuvo <i>x</i> = 4. ¿Es completo su procedimiento?</p>',
['No, porque al dividir entre x se pierde la solución x = 0; las soluciones son 0 y 4.','Sí, porque 4 es la única solución.','No, porque las soluciones son 2 y −2.','Sí, porque siempre se puede dividir entre la variable.'],'x² − 4x = 0, entonces x(x − 4) = 0, con soluciones x = 0 y x = 4. Dividir entre x supone x ≠ 0.');
N('V','I','Modelación lineal','<p>Una vela de 30 cm de altura se consume 2 cm cada hora. ¿Qué expresión representa su altura <i>h</i>, en cm, después de <i>t</i> horas encendida?</p>',
['<i>h</i> = 30 − 2<i>t</i>','<i>h</i> = 2<i>t</i> − 30','<i>h</i> = 30 + 2<i>t</i>','<i>h</i> = 30 − <i>t</i>/2'],'Parte de 30 cm y disminuye 2 cm por hora; se consume por completo en 15 horas.');

N('V','F','Función cuadrática','<p>¿Cuáles son las coordenadas del vértice de la parábola <i>f</i>(<i>x</i>) = <i>x</i><sup>2</sup> − 6<i>x</i> + 5?</p>',

N('V','F','Ecuaciones cuadráticas','<p>¿Cuáles son las soluciones de la ecuación <i>x</i><sup>2</sup> − 5<i>x</i> + 6 = 0?</p>',

N('V','F','Movimiento parabólico','<p>Un balón se lanza verticalmente hacia arriba y su altura, en metros, después de <i>t</i> segundos es <i>h</i>(<i>t</i>) = −5<i>t</i><sup>2</sup> + 20<i>t</i>. ¿Cuál es la altura máxima que alcanza?</p>',
['20 m','40 m','4 m','15 m'],'El máximo ocurre en t = −20/(2 · (−5)) = 2 s. h(2) = −20 + 40 = 20 m.');
N('V','F','Movimiento parabólico','<p>La altura de un balón, en metros, después de <i>t</i> segundos es <i>h</i>(<i>t</i>) = −5<i>t</i><sup>2</sup> + 20<i>t</i>. ¿Cuánto tiempo tarda el balón en volver al suelo?</p>',

N('V','A','Propiedades de la parábola','<p>Sobre la función <i>f</i>(<i>x</i>) = −2<i>x</i><sup>2</sup> + 3, ¿cuál de las siguientes afirmaciones es verdadera?</p>',
['Tiene un valor máximo igual a 3, porque la parábola abre hacia abajo y su vértice es (0, 3).','Tiene un valor mínimo igual a 3, porque el término independiente es positivo.','No tiene valor máximo ni mínimo, porque es una función cuadrática.','Tiene un valor máximo igual a −2, porque es el coeficiente principal.'],'Como a = −2 < 0, la parábola abre hacia abajo y el vértice es un máximo. Como b = 0, el vértice está en x = 0, con f(0) = 3.');
N('V','F','Optimización','<p>Con 40 metros de malla se quiere cercar un terreno rectangular. ¿Cuál es la mayor área que se puede encerrar?</p>',

N('V','F','Factorización','<p>¿Cuál es la factorización de <i>x</i><sup>2</sup> − 9?</p>',
['(<i>x</i> − 3)(<i>x</i> + 3)','(<i>x</i> − 3)<sup>2</sup>','(<i>x</i> − 9)(<i>x</i> + 1)','(<i>x</i> + 3)<sup>2</sup>'],'Es una diferencia de cuadrados: a² − b² = (a − b)(a + b), con a = x y b = 3.');
N('V','A','Discriminante','<p>Una estudiante afirma que la ecuación <i>x</i><sup>2</sup> + 2<i>x</i> + 5 = 0 no tiene soluciones en los números reales. ¿Tiene razón?</p>',
['Sí, porque el discriminante b² − 4ac = 4 − 20 = −16 es negativo.','No, porque toda ecuación cuadrática tiene dos soluciones reales.','No, porque las soluciones son x = 1 y x = 5.','Sí, porque todos los coeficientes son positivos.'],'Si b² − 4ac < 0, no hay raíces reales: la parábola nunca corta el eje x. Que los coeficientes sean positivos no basta (x² + 5x + 6 = 0 sí tiene soluciones).');
N('V','I','Crecimiento exponencial','<p>Un municipio tiene 2.000 habitantes y su población crece 3 % cada año. ¿Qué expresión representa la población P después de <i>t</i> años?</p>',

N('V','F','Decrecimiento exponencial','<p>Un paciente recibe una dosis de 200 mg de un medicamento. Cada 6 horas su cuerpo elimina la mitad del medicamento que hay en ese momento. ¿Cuántos miligramos quedan en su cuerpo después de 24 horas?</p>',
['12,5 mg','50 mg','0 mg','25 mg'],'24 horas son 4 periodos de 6 h: 200 × (1/2)⁴ = 200/16 = 12,5 mg.');
N('V','A','Vida media','<p>Un estudiante afirma: “Si una sustancia pierde la mitad de su masa cada 5 años, después de 10 años ya no quedará nada”. ¿Es correcta su afirmación?</p>',
['No, porque después de 10 años queda la cuarta parte de la masa inicial.','Sí, porque dos mitades forman el total.','No, porque después de 10 años queda la mitad de la masa inicial.','Sí, porque la masa disminuye de forma lineal.'],'Cada 5 años se reduce a la mitad de lo que hay: 1/2 × 1/2 = 1/4. En el decrecimiento exponencial nunca se llega exactamente a cero.');
N('V','F','Logaritmos','<p>¿Cuál es el valor de log<sub>2</sub> 32?</p>',
