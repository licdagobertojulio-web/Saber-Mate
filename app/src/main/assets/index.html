N('A','A','Probabilidad del complemento','<p>Un estudiante afirma que si se lanza un dado 6 veces, seguramente aparecerá al menos un 6. ¿Es correcta su afirmación?</p>',
['No, porque la probabilidad de no obtener ningún 6 es (5/6)⁶ ≈ 0,33; la probabilidad de al menos un 6 es aproximadamente 0,67.','Sí, porque la probabilidad de 6 es 1/6 y 6 × 1/6 = 1.','Sí, porque en 6 lanzamientos aparecen todos los números.','No, porque la probabilidad de obtener un 6 es 0.'],'Las probabilidades de eventos que no son excluyentes no se suman. Se usa el complemento: 1 − (5/6)⁶.');
N('N','A','Porcentajes','<p>Una tienda dice: “Pagar el 80 % del precio es lo mismo que tener un descuento del 20 %”. ¿Es correcta esta afirmación?</p>',

N('V','A','Proporcionalidad inversa','<p>Si 3 pintores pintan una casa en 4 días, Juana afirma que 6 pintores, trabajando al mismo ritmo, tardarán 8 días. ¿Es correcto?</p>',

N('E','A','Teorema de Pitágoras','<p>Un estudiante aplica el teorema de Pitágoras en un triángulo cuyos ángulos miden 50°, 60° y 70°. ¿Es válido su procedimiento?</p>',

N('M','A','Área del triángulo','<p>Un triángulo tiene una base de 10 cm, un lado inclinado de 6 cm y una altura de 4 cm sobre esa base. Un estudiante calcula su área como (10 × 6)/2 = 30 cm². ¿Es correcto?</p>',
['No, porque debe usar la altura perpendicular a la base, no el lado inclinado: (10 × 4)/2 = 20 cm².','Sí, porque usó dos lados del triángulo.','No, porque el área es 10 × 6 = 60 cm².','Sí, porque el lado inclinado es la altura.'],'La altura es la distancia perpendicular desde el vértice opuesto hasta la base. El lado inclinado siempre es mayor que esa altura.');
N('A','A','Eventos independientes','<p>La probabilidad de lluvia es 0,5 para hoy y 0,5 para mañana, y se suponen independientes. Alguien afirma que con seguridad lloverá ambos días, porque 0,5 + 0,5 = 1. ¿Es correcto?</p>',
['No, porque la probabilidad de que llueva ambos días es 0,5 × 0,5 = 0,25.','Sí, porque las probabilidades suman 1.','Sí, porque la lluvia de hoy causa lluvia mañana.','No, porque la probabilidad es 0,5.'],'Para que ocurran dos eventos independientes se multiplican sus probabilidades. Sumarlas no da la probabilidad de que ocurran ambos.');
N('V','A','Funciones racionales',`<p>Un estudiante afirma que la función <i>f</i>(<i>x</i>) = ${F(1,'<i>x</i>')} toma el valor 0 para algún valor de <i>x</i> muy grande. ¿Es correcta su afirmación?</p>`,

N('N','A','Potencias de números negativos','<p>Un estudiante afirma que −3<sup>2</sup> = 9. ¿Es correcta su afirmación?</p>',

N('N','A','Suma de fracciones',`<p>Para sumar ${F(1,2)} + ${F(1,3)}, Valeria suma los numeradores y los denominadores y obtiene ${F(2,5)}. ¿Es correcto su procedimiento?</p>`,

N('A','A','Media y mediana','<p>En una empresa, la edad promedio de los empleados es 30 años. Un gerente afirma que, por lo tanto, la mitad de los empleados tiene más de 30 años. ¿Es correcta su afirmación?</p>',

N('E','A','Volúmenes de sólidos','<p>Un cono y un cilindro tienen la misma base y la misma altura. Un estudiante afirma que tienen el mismo volumen. ¿Es correcta su afirmación?</p>',

N('M','A','Medidas de tiempo','<p>Un estudiante escribe que 1 hora y 30 minutos equivalen a 1,3 horas. ¿Es correcto?</p>',

N('V','A','Sucesiones','<p>Un estudiante afirma que la sucesión 1, 4, 9, 16, 25, … es aritmética. ¿Es correcta su afirmación?</p>',

N('A','A','Representatividad de la muestra','<p>Para estimar la estatura promedio de los estudiantes de un colegio, alguien propone medir solo a los integrantes del equipo de baloncesto. ¿Es adecuada esta propuesta?</p>',

N('N','A','Notación científica','<p>Un estudiante afirma que 9 × 10<sup>4</sup> es mayor que 3 × 10<sup>5</sup>, porque 9 es mayor que 3. ¿Es correcta su afirmación?</p>',

// ================== Figuras geométricas para las preguntas complementarias ==================
// Todas se dibujan en SVG con clases que respetan el tema claro/oscuro. Nunca muestran el valor que se pregunta.
const GF = (() => {
  const f = n => +(+n).toFixed(1);
  const svg = (w, h, b, max = 320, label = 'Figura de la pregunta') => `<figure class="geo" style="max-width:${max}px"><svg viewBox="0 0 ${w} ${h}" role="img" aria-label="${label}">${b}</svg></figure>`;
  const poly = (pts, c = 'g-l') => `<polygon points="${pts.map(p => f(p[0]) + ',' + f(p[1])).join(' ')}" class="${c}"/>`;
  const pl = (pts, c = 'g-l') => `<polyline points="${pts.map(p => f(p[0]) + ',' + f(p[1])).join(' ')}" class="${c}" fill="none"/>`;
  const ln = (x1, y1, x2, y2, c = 'g-l') => `<line x1="${f(x1)}" y1="${f(y1)}" x2="${f(x2)}" y2="${f(y2)}" class="${c}"/>`;
  const circ = (cx, cy, r, c = 'g-l') => `<circle cx="${f(cx)}" cy="${f(cy)}" r="${f(r)}" class="${c}"/>`;
  const ell = (cx, cy, rx, ry, c = 'g-l') => `<ellipse cx="${f(cx)}" cy="${f(cy)}" rx="${f(rx)}" ry="${f(ry)}" class="${c}"/>`;
  const dot = (x, y, c = 'g-dot') => `<circle cx="${f(x)}" cy="${f(y)}" r="3.2" class="${c}"/>`;
  // texto: _x_ se escribe en cursiva matemática
  const tx = (x, y, t, a = 'middle', c = 'g-t') => `<text x="${f(x)}" y="${f(y)}" text-anchor="${a}" class="${c}">${String(t).replace(/_([^_]+)_/g, '<tspan class="g-i">$1</tspan>')}</text>`;
  const pt = (cx, cy, r, deg) => [cx + r * Math.cos(deg * Math.PI / 180), cy - r * Math.sin(deg * Math.PI / 180)];
  // arco de ángulo con centro en (cx, cy), de a1 a a2 grados (sentido antihorario)
  const arc = (cx, cy, r, a1, a2, label, lr, c = 'g-a') => {
    const [x1, y1] = pt(cx, cy, r, a1), [x2, y2] = pt(cx, cy, r, a2), big = ((a2 - a1 + 360) % 360) > 180 ? 1 : 0;
    let s = `<path d="M${f(x1)},${f(y1)} A${r},${r} 0 ${big} 0 ${f(x2)},${f(y2)}" class="${c}" fill="none"/>`;
    if (label) { const m = (a1 + ((a2 - a1 + 360) % 360) / 2); const [lx, ly] = pt(cx, cy, lr || r + 13, m); s += tx(lx, ly + 4, label, 'middle', 'g-t g-small'); }
    return s;
  };
  // marca de ángulo recto en el vértice (x, y) con direcciones (en grados) d1 y d2
  const ra = (x, y, d1, d2, s = 10) => { const [ax, ay] = pt(x, y, s, d1), [bx, by] = pt(x, y, s, d2); return pl([[ax, ay], [ax + bx - x, ay + by - y], [bx, by]], 'g-l g-thin'); };
  // etiqueta en el punto medio de un segmento, desplazada perpendicularmente
  const lab = (x1, y1, x2, y2, t, off = 12) => { const mx = (x1 + x2) / 2, my = (y1 + y2) / 2, dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1; return tx(mx - dy / L * off, my + dx / L * off + 4, t); };
  // cotas con flechas
  const dim = (x1, y1, x2, y2, t, off = 14) => { const dx = x2 - x1, dy = y2 - y1, L = Math.hypot(dx, dy) || 1, nx = -dy / L * off, ny = dx / L * off; return `<line x1="${f(x1 + nx)}" y1="${f(y1 + ny)}" x2="${f(x2 + nx)}" y2="${f(y2 + ny)}" class="g-dim" marker-start="url(#ga)" marker-end="url(#ga)"/>` + lab(x1 + nx, y1 + ny, x2 + nx, y2 + ny, t, Math.sign(off) * 11); };
  const defs = '<defs><marker id="ga" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0,1 L9,5 L0,9" class="g-mk"/></marker><marker id="gv" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" class="g-mkf"/></marker></defs>';
  // caja en perspectiva caballera
  const box = (x, y, w, h, dx, dy, c = 'g-f') => poly([[x, y], [x + w, y], [x + w, y + h], [x, y + h]], c) + poly([[x, y], [x + dx, y - dy], [x + w + dx, y - dy], [x + w, y]], c + ' g-top') + poly([[x + w, y], [x + w + dx, y - dy], [x + w + dx, y + h - dy], [x + w, y + h]], c + ' g-side') + ln(x, y + h, x + dx, y + h - dy, 'g-l g-hid') + ln(x + dx, y + h - dy, x + w + dx, y + h - dy, 'g-l g-hid') + ln(x + dx, y - dy, x + dx, y + h - dy, 'g-l g-hid');
  const cyl = (cx, top, rx, ry, h) => `<path d="M${cx - rx},${top} L${cx - rx},${top + h} A${rx},${ry} 0 0 0 ${cx + rx},${top + h} L${cx + rx},${top} A${rx},${ry} 0 0 1 ${cx - rx},${top}" class="g-f"/>` + `<path d="M${cx - rx},${top + h} A${rx},${ry} 0 0 1 ${cx + rx},${top + h}" class="g-l g-hid" fill="none"/>` + ell(cx, top, rx, ry, 'g-f g-top');
  // plano cartesiano
  const plane = (x0, x1, y0, y1, u, draw, opt = {}) => {
    const W = (x1 - x0) * u + 50, H = (y1 - y0) * u + 40, X = x => 25 + (x - x0) * u, Y = y => 15 + (y1 - y) * u;
    let g = '';
    for (let x = x0; x <= x1; x++) g += ln(X(x), Y(y0), X(x), Y(y1), 'g-grid');
    for (let y = y0; y <= y1; y++) g += ln(X(x0), Y(y), X(x1), Y(y), 'g-grid');
    g += `<line x1="${X(x0)}" y1="${Y(0)}" x2="${X(x1) + 8}" y2="${Y(0)}" class="g-ax" marker-end="url(#gv)"/><line x1="${X(0)}" y1="${Y(y0)}" x2="${X(0)}" y2="${Y(y1) - 8}" class="g-ax" marker-end="url(#gv)"/>`;
    const st = opt.step || 1;
    for (let x = x0; x <= x1; x++) if (x && x % st === 0) g += tx(X(x), Y(0) + 14, x < 0 ? '−' + -x : x, 'middle', 'g-tick');
    for (let y = y0; y <= y1; y++) if (y && y % st === 0) g += tx(X(0) - 6, Y(y) + 4, y < 0 ? '−' + -y : y, 'end', 'g-tick');
    g += tx(X(x1) + 12, Y(0) - 6, '_x_', 'middle', 'g-t') + tx(X(0) + 10, Y(y1) - 2, '_y_', 'start', 'g-t');
    return svg(W, H, defs + g + draw(X, Y), opt.max || 300, 'Plano cartesiano');
  };
  const triFromAngles = (A, B, base, x0, y0) => { // vértice C dados los ángulos en A y B
    const ta = Math.tan(A * Math.PI / 180), tb = Math.tan(B * Math.PI / 180), xc = base * tb / (ta + tb), h = xc * ta; return [x0 + xc, y0 - h];
  };
  const star = (cx, cy, r, n) => Array.from({ length: n }, (_, i) => pt(cx, cy, r, 90 + i * 360 / n));
  const F = {};
  // ---------- Pensamiento métrico ----------
  F.n151 = svg(260, 175, defs + poly([[20, 130], [240, 130], [160, 22]], 'g-f') + ln(160, 22, 160, 130, 'g-l g-dash') + ra(160, 130, 90, 180) + dim(20, 130, 240, 130, '12 cm', 16) + tx(168, 82, '7 cm', 'start'), 280);
  F.n152 = svg(200, 160, circ(100, 80, 62, 'g-f') + dot(100, 80) + ln(100, 80, 162, 80, 'g-l g-acc') + tx(131, 72, '5 cm'), 220);
  F.n153 = svg(200, 160, defs + circ(100, 80, 62, 'g-f') + dot(100, 80) + `<line x1="38" y1="80" x2="162" y2="80" class="g-dim" marker-start="url(#ga)" marker-end="url(#ga)"/>` + tx(100, 72, '10 cm'), 220);
  F.n156 = svg(200, 200, defs + box(30, 60, 100, 100, 40, 30) + dim(30, 160, 130, 160, '4 cm', 14), 220);
  F.n157 = svg(300, 150, defs + box(20, 60, 200, 50, 50, 30) + dim(20, 110, 220, 110, '2 m', 14) + tx(278, 92, '0,5 m', 'start') + tx(250, 52, '1 m', 'start', 'g-t g-small'), 320);
  F.n158 = svg(320, 150, defs + box(20, 60, 220, 40, 50, 35) + dim(20, 100, 240, 100, '10 m', 14) + tx(296, 83, '1,5 m', 'start') + tx(270, 50, '5 m', 'start', 'g-t g-small'), 340);
  F.n159 = svg(230, 230, defs + cyl(100, 30, 55, 16, 170) + dot(100, 30) + ln(100, 30, 155, 30, 'g-l g-acc') + tx(128, 24, '3 cm') + dim(155, 30, 155, 200, '10 cm', -22), 210);
  F.n162 = svg(280, 180, defs + '<g transform="translate(24,0)">' + poly([[20, 20], [140, 20], [140, 100], [220, 100], [220, 140], [20, 140]], 'g-f') + ln(140, 20, 220, 20, 'g-l g-dash') + ln(220, 20, 220, 100, 'g-l g-dash') + dim(20, 140, 220, 140, '10 m', 14) + dim(20, 20, 20, 140, '6 m', 16) + tx(146, 64, '4 m', 'start') + tx(180, 94, '4 m') + '</g>', 290);
  F.n163 = svg(220, 180, defs + (() => { let g = poly([[20, 20], [180, 20], [180, 140], [20, 140]], 'g-f'); for (let x = 36; x < 180; x += 16) g += ln(x, 20, x, 140, 'g-grid'); for (let y = 36; y < 140; y += 16) g += ln(20, y, 180, y, 'g-grid'); return g + poly([[20, 124], [36, 124], [36, 140], [20, 140]], 'g-s'); })() + dim(20, 140, 180, 140, '4 m', 14) + dim(180, 20, 180, 140, '3 m', -16) + tx(42, 120, '40 cm', 'start', 'g-t g-small'), 240);
  F.n164 = svg(270, 160, defs + poly([[20, 20], [220, 20], [220, 120], [20, 120]], 'g-f') + poly([[130, 40], [170, 40], [170, 100], [130, 100]], 'g-s') + dim(20, 120, 220, 120, '5 m', 14) + dim(220, 20, 220, 120, '2,5 m', -18) + tx(150, 36, '1 m', 'middle', 'g-t g-small') + tx(124, 74, '1,5 m', 'end', 'g-t g-small'), 280);
  F.n165 = svg(250, 165, defs + poly([[20, 20], [200, 20], [200, 125], [20, 125]], 'g-f') + tx(110, 78, 'Área = 48 cm²') + dim(20, 125, 200, 125, '8 cm', 14) + tx(212, 78, '?', 'start'), 260);
  F.n173 = svg(280, 170, defs + poly([[20, 125], [260, 125], [220, 25], [60, 25]], 'g-f') + ln(60, 25, 60, 125, 'g-l g-dash') + ra(60, 125, 90, 0) + dim(60, 25, 220, 25, '8 cm', -12) + dim(20, 125, 260, 125, '12 cm', 14) + tx(66, 80, '5 cm', 'start'), 290);
  F.n174 = svg(260, 170, poly([[30, 85], [130, 25], [230, 85], [130, 145]], 'g-f') + ln(30, 85, 230, 85, 'g-l g-dash') + ln(130, 25, 130, 145, 'g-l g-dash') + tx(180, 79, '10 cm') + tx(136, 122, '6 cm', 'start'), 270);
  F.n175 = svg(200, 210, defs + `<path d="M40,170 L100,25 L160,170" class="g-f"/>` + ell(100, 170, 60, 16, 'g-f g-top') + ln(100, 25, 100, 170, 'g-l g-dash') + ln(100, 170, 160, 170, 'g-l g-acc') + ra(100, 170, 90, 0, 8) + tx(130, 190, '3 cm') + tx(106, 105, '4 cm', 'start'), 210);

  F.n183 = svg(300, 130, defs + `<path d="M70,40 L230,40 A32,32 0 0 1 230,104 L70,104 A32,32 0 0 1 70,40 Z" class="g-f"/>` + ln(70, 40, 70, 104, 'g-l g-dash') + ln(230, 40, 230, 104, 'g-l g-dash') + dim(70, 40, 230, 40, '10 m', -12) + tx(76, 76, '4 m', 'start'), 310);

  tip: 'Pregúntate: si aumenta una cantidad, ¿la otra aumenta o disminuye? Si disminuye, la relación es inversa.' },
razon: { t: 'Razones', k: 'Una razón compara dos cantidades mediante un cociente, a : b. El orden importa: no es lo mismo comparar una parte con el todo que una parte con la otra.',
  ex: ['En una caja hay 6 bolas rojas y 4 azules: rojas : azules = 6 : 4 = 3 : 2.', 'En la misma caja, rojas : total = 6 : 10 = 3 : 5.'],
  tip: 'Identifica qué se compara con qué y simplifica al final.' },
frac: { t: 'Fracciones y números racionales', k: 'Para sumar o restar fracciones se necesita un denominador común. Para multiplicar, se multiplican numeradores y denominadores; para dividir, se multiplica por la fracción invertida.',
  ex: ['1/4 + 2/3 = 3/12 + 8/12 = 11/12.', '3/5 ÷ 1/2 = 3/5 × 2/1 = 6/5.', 'Para comparar 2/3 y 5/8, pásalas a decimal: 0,666… y 0,625. Entonces 2/3 es mayor.'],
  tip: 'Nunca sumes numerador con numerador y denominador con denominador.' },
dec: { t: 'Decimales, redondeo y estimación', k: 'Para redondear, mira la cifra siguiente a la posición pedida: si es 5 o más, se aumenta; si es menor, se deja igual. Para estimar, redondea a números fáciles antes de operar.',
  ex: ['7,486 redondeado a las décimas es 7,5.', '9,8 × 31 ≈ 10 × 30 = 300.', '0,3 × 0,2 = 0,06: hay dos cifras decimales en total.'],
  tip: 'Al multiplicar decimales, cuenta el total de cifras decimales de los factores.' },
pot: { t: 'Potencias, raíces y notación científica', k: 'Con potencias de igual base, al multiplicar se suman los exponentes, al dividir se restan y al elevar una potencia se multiplican. Un exponente negativo indica el inverso: a⁻ⁿ = 1/aⁿ. En notación científica, el primer factor va entre 1 y 10.',
  ex: ['3² · 3³ = 3⁵ = 243 y (2³)² = 2⁶ = 64.', '10⁻² = 1/10² = 0,01 y 45.000 = 4,5 × 10⁴.', '√12 = √4 · √3 = 2√3, pero √(9 + 16) = √25 = 5, que no es √9 + √16.'],
  tip: 'La raíz no se reparte en una suma ni la potencia en una suma: √(a + b) ≠ √a + √b.' },
jer: { t: 'Jerarquía de las operaciones', k: 'El orden es: primero paréntesis; luego potencias y raíces; después multiplicaciones y divisiones, de izquierda a derecha; y al final sumas y restas.',
  ex: ['10 − 2 × 3 + 4² = 10 − 6 + 16 = 20.', '(10 − 2) × 3 = 8 × 3 = 24.', '−2² = −4, pero (−2)² = 4.'],
  tip: 'Antes de operar, marca qué parte se resuelve primero.' },
ent: { t: 'Números enteros y valor absoluto', k: 'El valor absoluto |a| es la distancia de a al cero; por eso nunca es negativo. Una variación se calcula como valor final − valor inicial.',
  ex: ['De −4 °C a 9 °C la temperatura sube 9 − (−4) = 13 °C.', '|−0,2| = 0,2 y |5| = 5.'],
  tip: 'Restar un número negativo es lo mismo que sumar su opuesto.' },
irr: { t: 'Números racionales e irracionales', k: 'Un número es racional si se puede escribir como fracción de enteros: sus decimales terminan o se repiten. Los irracionales tienen infinitos decimales sin patrón, como √2 o π.',
  ex: ['0,666… = 2/3 es racional.', '√9 = 3 es racional, pero √5 ≈ 2,236… es irracional.', 'Entre 1/3 y 1/2 está su promedio, 5/12: siempre hay otro racional entre dos racionales.'],
  tip: 'Antes de decidir, simplifica la raíz o el producto: a veces el resultado es entero.' },
div: { t: 'Divisibilidad, MCD y MCM', k: 'El mínimo común múltiplo (mcm) responde cuándo vuelven a coincidir dos ciclos. El máximo común divisor (MCD) responde cuál es la mayor medida que divide exactamente varias cantidades.',
  ex: ['Dos alarmas suenan cada 6 y cada 8 minutos: coinciden cada mcm(6, 8) = 24 minutos.', 'Para cortar cintas de 18 cm y 30 cm en trozos iguales y lo más largos posible: MCD(18, 30) = 6 cm.', 'Todo número par se escribe 2k y todo impar 2k + 1.'],
  tip: 'Coincidir en el tiempo → mcm. Repartir o cortar en partes iguales → MCD.' },
interes: { t: 'Interés simple y compuesto', k: 'En el interés simple, cada periodo se calcula sobre el capital inicial: I = C · r · t. En el compuesto, los intereses se suman al capital y también generan intereses: C · (1 + r)ᵗ.',
  ex: ['$ 100.000 al 10 % simple durante 2 años: 100.000 + 2 × 10.000 = $ 120.000.', '$ 100.000 al 10 % compuesto durante 2 años: 100.000 × 1,1² = $ 121.000.', 'El 2 % mensual compuesto en 3 meses multiplica el capital por 1,02³ ≈ 1,061.'],
  tip: 'Identifica si el interés se calcula sobre el capital inicial o sobre el acumulado.' },
tarifas: { t: 'Tarifas y funciones por tramos', k: 'Muchos cobros tienen un valor fijo más un valor por unidad, o cambian de precio a partir de cierto consumo. Calcula cada tramo por separado y luego suma.',
  ex: ['Un servicio cobra $ 5.000 fijos y $ 300 por unidad: con 20 unidades se paga 5.000 + 20 × 300 = $ 11.000.', 'Si las primeras 50 unidades valen $ 100 y las demás $ 150, con 70 unidades se paga 50 × 100 + 20 × 150 = $ 8.000.'],
  tip: 'Escribe los tramos uno debajo del otro antes de calcular.' },
arit: { t: 'Resolución de problemas', k: 'Identifica qué datos da el problema, qué pregunta y qué operaciones relacionan los datos. A veces la información no alcanza para responder: revisa si falta algún dato.',
  ex: ['Ganancia = ingresos − costos: vender 30 unidades a $ 2.000 que costaron $ 1.200 cada una deja 30 × 800 = $ 24.000.', 'Si sabes cuántos productos se vendieron pero no a qué precio, no puedes calcular el ingreso.'],
  tip: 'Subraya la pregunta y escribe cada paso con su unidad (pesos, kg, horas).' },
lineal: { t: 'Función lineal y modelación', k: 'Una función lineal tiene la forma y = mx + b. La pendiente m es lo que cambia y cada vez que x aumenta 1 (razón de cambio) y b es el valor inicial (cuando x = 0). Si b ≠ 0, no hay proporcionalidad directa.',
  ex: ['Un plan cuesta $ 20.000 fijos más $ 500 por minuto: C(x) = 500x + 20.000.', 'En la tabla x: 0, 1, 2 y y: 7, 10, 13, y aumenta 3 cada vez y empieza en 7: y = 3x + 7.', 'Un equipo de $ 900.000 que pierde $ 150.000 al año vale V(t) = 900.000 − 150.000t.'],
  tip: 'En una tabla, calcula cuánto cambia y cuando x aumenta 1: esa es la pendiente.' },
pend: { t: 'Pendiente y ecuación de la recta', k: 'La pendiente entre dos puntos es m = (y₂ − y₁)/(x₂ − x₁). Las rectas paralelas tienen la misma pendiente y en las perpendiculares el producto de las pendientes es −1. El corte con el eje x se halla haciendo y = 0.',
  ex: ['Entre (1, 2) y (3, 8): m = (8 − 2)/(3 − 1) = 3.', 'Una recta perpendicular a otra de pendiente 3 tiene pendiente −1/3.', 'y = 2x − 6 corta el eje x cuando 2x − 6 = 0, es decir, en x = 3.'],
  tip: 'Una pendiente positiva sube de izquierda a derecha; una negativa baja.' },
ecu: { t: 'Ecuaciones lineales', k: 'Para despejar la incógnita se aplica la misma operación a ambos lados. Si al final queda una igualdad falsa (como 3 = 7), no hay solución; si queda una siempre verdadera (5 = 5), hay infinitas.',
  ex: ['4x − 3 = 2x + 9 → 2x = 12 → x = 6. Comprobación: 4(6) − 3 = 21 = 2(6) + 9.', 'x/2 + x/3 = 10 → 5x/6 = 10 → x = 12.', '“El doble de un número aumentado en 5 es 17” se escribe 2n + 5 = 17, entonces n = 6.'],
  tip: 'Nombra la incógnita, traduce frase por frase y comprueba siempre la solución.' },
despeje: { t: 'Despeje de fórmulas', k: 'Despejar es aislar una variable deshaciendo las operaciones en orden inverso: primero lo que suma o resta y luego lo que multiplica o divide.',
  ex: ['De V = (b · h)/3 se obtiene 3V = b · h, entonces h = 3V/b.', 'De P = 2(a + b) se obtiene P/2 = a + b, entonces a = P/2 − b.'],
  tip: 'Haz exactamente la misma operación en los dos lados de la igualdad.' },
sist: { t: 'Sistemas de ecuaciones', k: 'Un sistema se resuelve por sustitución, igualación o reducción. Gráficamente, la solución es el punto donde se cortan las rectas; si son paralelas, no hay solución.',
  ex: ['x + y = 10 y x − y = 4: al sumarlas, 2x = 14, luego x = 7 y y = 3.', '12 animales entre patos y vacas con 32 patas: p + v = 12 y 2p + 4v = 32, de donde v = 4 y p = 8.'],
  tip: 'Asigna una letra a cada incógnita y escribe una ecuación por cada condición.' },
inec: { t: 'Inecuaciones y desigualdades', k: 'Se resuelven como las ecuaciones, con una regla especial: al multiplicar o dividir por un número negativo, el sentido de la desigualdad se invierte. “Al menos” significa ≥ y “como máximo” significa ≤.',
  ex: ['3x + 2 ≥ 11 → 3x ≥ 9 → x ≥ 3.', '−3x ≤ 12 → x ≥ −4 (se invirtió el signo al dividir entre −3).'],
  tip: 'Prueba un valor de tu respuesta en la desigualdad original.' },
cuad: { t: 'Funciones y ecuaciones cuadráticas', k: 'En f(x) = ax² + bx + c, si a es positivo la parábola abre hacia arriba (tiene mínimo) y si es negativo abre hacia abajo (tiene máximo). El vértice está en x = −b/(2a). Si b² − 4ac es negativo, no hay raíces reales.',
  ex: ['f(x) = x² − 4x + 3 tiene vértice en x = 4/2 = 2, con f(2) = −1.', 'x² − 4x + 3 = 0 → (x − 1)(x − 3) = 0 → x = 1 o x = 3.', '(a + b)² = a² + 2ab + b²; por ejemplo, (x + 3)² = x² + 6x + 9.'],
  tip: 'Si te piden un máximo o un mínimo, busca el vértice.' },
expo: { t: 'Crecimiento y decrecimiento exponencial', k: 'Cuando una cantidad cambia en el mismo porcentaje cada periodo, se multiplica siempre por el mismo factor: P = P₀ · (factor)ᵗ. Crecer un r % es multiplicar por (1 + r/100) y reducirse a la mitad es multiplicar por 1/2.',
  ex: ['Una población de 500 que crece 10 % anual tiene, a los 3 años, 500 × 1,1³ ≈ 666 habitantes.', 'Una sustancia de 80 g que pierde la mitad cada hora tiene 80 × (1/2)³ = 10 g a las 3 horas.', 'Con 3ˣ = 81 = 3⁴, se obtiene x = 4.'],
  tip: 'Si el cambio es una cantidad fija, el modelo es lineal; si es un porcentaje o un factor fijo, es exponencial.' },
log: { t: 'Logaritmos', k: 'log<sub>b</sub>(x) es el exponente al que hay que elevar b para obtener x. Se cumplen log(a · c) = log a + log c y log(aⁿ) = n · log a. En las escalas logarítmicas, cada unidad equivale a multiplicar por 10.',
  ex: ['log₃ 81 = 4, porque 3⁴ = 81.', 'log(1.000) = 3 y log(100 · 10) = 2 + 1 = 3.', 'Una diferencia de 3 unidades de pH equivale a un factor de 10³ = 1.000.'],
  tip: 'Transforma el logaritmo en una potencia para pensar el problema.' },
func: { t: 'Concepto de función, dominio y rango', k: 'Una función asigna a cada valor de x un único valor de y. En el dominio no se permite dividir entre cero ni sacar raíz cuadrada de números negativos. Para evaluar f(a), se reemplaza x por a.',
  ex: ['En f(x) = 1/(x + 3), x no puede ser −3.', 'Si f(x) = 2x + 1 y g(x) = x², entonces f(g(2)) = f(4) = 9.', 'La inversa de f(x) = 2x + 4 es f⁻¹(x) = (x − 4)/2.'],
  tip: 'Usa paréntesis al reemplazar, sobre todo con números negativos.' },
graf: { t: 'Interpretación de gráficas y razón de cambio', k: 'En una gráfica, si la línea sube la cantidad aumenta, si baja disminuye y si es horizontal no cambia. La razón de cambio promedio es (cambio en y)/(cambio en x).',
  ex: ['Si la distancia pasa de 2 km a 8 km entre la hora 1 y la hora 3, la velocidad es (8 − 2)/(3 − 1) = 3 km/h.', 'En una gráfica distancia-tiempo, un tramo horizontal indica que el objeto está quieto.', 'En una gráfica velocidad-tiempo, el área bajo la línea es la distancia recorrida: 10 m/s durante 4 s son 40 m.'],
  tip: 'Lee primero qué representa cada eje y en qué unidades.' },
suc: { t: 'Sucesiones y patrones', k: 'En una sucesión aritmética se suma siempre lo mismo: aₙ = a₁ + (n − 1)d. En una geométrica se multiplica siempre por lo mismo: aₙ = a₁ · rⁿ⁻¹.',
  ex: ['4, 9, 14, … tiene d = 5, así que a₁₀ = 4 + 9 × 5 = 49.', '2, 6, 18, … tiene r = 3, así que a₅ = 2 × 3⁴ = 162.', '1 + 2 + … + 20 = 20 × 21/2 = 210.'],
  tip: 'Calcula las diferencias o los cocientes entre términos seguidos para descubrir el patrón.' },
radabs: { t: 'Ecuaciones con radicales y valor absoluto', k: 'Con una raíz, aíslala y eleva ambos lados al cuadrado; luego comprueba la solución. Con valor absoluto, |x − a| = k da dos casos: x − a = k o x − a = −k.',
  ex: ['√(x − 1) = 3 → x − 1 = 9 → x = 10.', '|x + 2| = 4 → x = 2 o x = −6.'],
  tip: 'No olvides el segundo caso del valor absoluto.' },
area: { t: 'Perímetros y áreas', k: 'El perímetro es la longitud del borde y el área es la superficie interior. Rectángulo: b · h. Triángulo: (b · h)/2, con la altura perpendicular a la base. Círculo: πr², con circunferencia 2πr. Trapecio: (B + b) · h/2.',
  ex: ['Un triángulo de base 8 cm y altura 5 cm tiene área (8 × 5)/2 = 20 cm².', 'Un círculo de radio 3 cm tiene área 9π ≈ 28,3 cm² y circunferencia 6π ≈ 18,8 cm.', 'Una figura en L se divide en dos rectángulos y se suman sus áreas.'],
  tip: 'No confundas perímetro con área, ni radio con diámetro.' },
vol: { t: 'Volumen y capacidad', k: 'Prisma y cilindro: V = área de la base × altura. Cono y pirámide: la tercera parte de eso. Esfera: (4/3)πr³. Además, 1 dm³ = 1 litro y 1 m³ = 1.000 litros.',
  ex: ['Una caja de 20 × 10 × 5 cm tiene 1.000 cm³ = 1 litro.', 'Un cilindro de radio 1 m y altura 3 m tiene 3π ≈ 9,42 m³, unos 9.420 litros.', 'Un cono con la misma base y altura que ese cilindro tiene π m³: la tercera parte.'],
  tip: 'Antes de calcular, pasa todas las medidas a la misma unidad.' },
unid: { t: 'Unidades y magnitudes', k: 'Para convertir, multiplica o divide por la equivalencia: 1 km = 1.000 m, 1 h = 3.600 s, 1 t = 1.000 kg. En áreas la equivalencia se eleva al cuadrado. Velocidad = distancia/tiempo y densidad = masa/volumen.',
  ex: ['54 km/h = 54.000 m ÷ 3.600 s = 15 m/s.', '2 h 45 min = 2,75 h, no 2,45 h, porque 45/60 = 0,75.', '1 m² = 100 cm × 100 cm = 10.000 cm².'],
  tip: 'Escribe las unidades en cada paso: te ayudan a detectar errores.' },
escala: { t: 'Escalas', k: 'En una escala 1 : n, cada medida real es n veces la del plano. Las longitudes se multiplican por n, pero las áreas se multiplican por n².',
  ex: ['En escala 1 : 200, 3 cm del plano son 600 cm = 6 m reales.', 'En escala 1 : 200, un área de 2 cm² representa 2 × 200² = 80.000 cm² = 8 m².', 'En un mapa 1 : 25.000, 4 cm equivalen a 100.000 cm = 1 km.'],
  tip: 'Convierte el resultado a una unidad razonable (m o km).' },
varmed: { t: 'Cómo cambian áreas y volúmenes', k: 'Si todas las longitudes de una figura se multiplican por k, el perímetro se multiplica por k, el área por k² y el volumen por k³.',
  ex: ['Si el lado de un cuadrado se triplica, su área se multiplica por 3² = 9.', 'Si las aristas de una caja se duplican, su volumen se multiplica por 2³ = 8.', 'Si el radio de un círculo pasa de 2 a 4, el área pasa de 4π a 16π.'],
  tip: 'Cuenta cuántas longitudes se multiplican en la fórmula: el área usa dos y el volumen tres.' },
pit: { t: 'Teorema de Pitágoras', k: 'En un triángulo rectángulo se cumple a² + b² = c², donde c es la hipotenusa (el lado opuesto al ángulo recto). Si tres lados cumplen esa igualdad, el triángulo es rectángulo. Solo aplica a triángulos rectángulos.',
  ex: ['Con catetos 6 y 8: c = √(36 + 64) = √100 = 10.', 'Con hipotenusa 13 y un cateto 5: el otro cateto es √(169 − 25) = √144 = 12.', 'La diagonal de un cuadrado de lado 4 mide √(16 + 16) = 4√2.'],
  tip: 'Identifica cuál lado es la hipotenusa antes de reemplazar.' },
trig: { t: 'Razones trigonométricas', k: 'En un triángulo rectángulo, respecto a un ángulo: seno = opuesto/hipotenusa, coseno = adyacente/hipotenusa y tangente = opuesto/adyacente. Se cumplen sen²θ + cos²θ = 1 y 180° = π radianes.',
  ex: ['Con hipotenusa 10 y ángulo de 30°, el cateto opuesto mide 10 × sen 30° = 10 × 1/2 = 5.', 'Desde 15 m de un árbol, con ángulo de elevación de 45°, la altura es 15 × tan 45° = 15 m.', 'Si sen θ = 5/13 y θ es agudo, cos θ = 12/13.'],
  tip: 'Dibuja el triángulo y marca cuál cateto es opuesto y cuál es adyacente al ángulo.' },
leyes: { t: 'Leyes del seno y del coseno', k: 'Sirven en cualquier triángulo. Ley del seno: a/(sen A) = b/(sen B). Ley del coseno: c² = a² + b² − 2ab · cos C, útil cuando conoces dos lados y el ángulo entre ellos.',
  ex: ['Con lados 3 y 4 y un ángulo de 60° entre ellos: c² = 9 + 16 − 24 × 0,5 = 13, así que c = √13.', 'Si A = 30°, B = 90° y a = 4, entonces b = 4 × (sen 90°)/(sen 30°) = 8.'],
  tip: 'Empareja cada lado con el ángulo que tiene enfrente.' },
ang: { t: 'Ángulos y polígonos', k: 'Los ángulos de un triángulo suman 180° y los de un polígono de n lados, (n − 2) × 180°. Los suplementarios suman 180° y los complementarios 90°. Entre paralelas, los ángulos alternos internos son iguales.',
  ex: ['Un pentágono suma (5 − 2) × 180° = 540°; si es regular, cada ángulo mide 108°.', 'Si dos ángulos de un triángulo miden 40° y 60°, el tercero mide 80°.', 'Un polígono de n lados tiene n(n − 3)/2 diagonales: un pentágono tiene 5.'],
  tip: 'Haz un dibujo y marca los ángulos iguales.' },
circ: { t: 'Circunferencia y ángulos', k: 'Un ángulo inscrito mide la mitad del ángulo central que abarca el mismo arco, y si abarca un diámetro mide 90°. La circunferencia de centro (h, k) y radio r es (x − h)² + (y − k)² = r².',
  ex: ['Si el ángulo central mide 80°, el inscrito sobre el mismo arco mide 40°.', 'Centro (−1, 3) y radio 2: (x + 1)² + (y − 3)² = 4.'],
  tip: 'Cuida los signos: el centro (−1, 3) aparece como (x + 1).' },
clas: { t: 'Clasificación y propiedades de figuras', k: 'Para que tres segmentos formen un triángulo, la suma de dos lados cualesquiera debe ser mayor que el tercero. Comparando a² + b² con c² (c es el lado mayor) se sabe si el triángulo es acutángulo, rectángulo u obtusángulo.',
  ex: ['Con 2, 3 y 6 no se forma triángulo, porque 2 + 3 es menor que 6.', 'Con lados 4, 5 y 7: 16 + 25 = 41 es menor que 49, así que el triángulo es obtusángulo.', 'Todo cuadrado es rectángulo y también rombo, pero no todo rombo es cuadrado.'],
  tip: 'Revisa la definición exacta de cada figura: qué lados y qué ángulos exige.' },
sem: { t: 'Semejanza y teorema de Tales', k: 'Dos triángulos son semejantes si tienen los mismos ángulos, y entonces sus lados son proporcionales. Rectas paralelas cortan segmentos proporcionales en dos transversales (teorema de Tales).',
  ex: ['Un poste de 2 m da una sombra de 3 m; un edificio con sombra de 15 m mide 2 × 15/3 = 10 m.', 'Si AB = 2, BC = 5 y el segmento correspondiente a AB mide 4, el de BC mide 10.'],
  tip: 'Escribe la proporción emparejando los lados que se corresponden.' },
plano: { t: 'Plano cartesiano', k: 'La distancia entre (x₁, y₁) y (x₂, y₂) es ' + RAD('(x₂ − x₁)² + (y₂ − y₁)²') + '. El punto medio es el promedio de las coordenadas. Cuadrantes: I (+, +), II (−, +), III (−, −) y IV (+, −).',
  ex: ['Entre (1, 1) y (4, 5): distancia √(9 + 16) = √25 = 5.', 'El punto medio entre (−2, 6) y (4, 0) es (1, 3).', 'El punto (3, −2) está en el cuarto cuadrante.'],
  tip: 'Resta las coordenadas en el mismo orden y cuida los signos.' },
transf: { t: 'Transformaciones y simetría', k: 'Reflexión en el eje x: (x, y) → (x, −y). En el eje y: (x, y) → (−x, y). Rotación de 90° antihoraria: (x, y) → (−y, x). Traslación: se suma el vector. Las rotaciones, reflexiones y traslaciones conservan forma y tamaño.',
  ex: ['(3, 1) reflejado en el eje y queda en (−3, 1).', '(3, 1) rotado 90° en sentido antihorario queda en (−1, 3).', 'La gráfica de y = (x − 2)² + 1 es la de y = x² trasladada 2 a la derecha y 1 hacia arriba.'],
  tip: 'Prueba la transformación con un punto sencillo antes de responder.' },
solidos: { t: 'Sólidos geométricos', k: 'Un poliedro cumple C + V − A = 2 (caras + vértices − aristas). El desarrollo plano de un cilindro son dos círculos y un rectángulo. Un corte paralelo a la base produce una figura igual o semejante a la base.',
  ex: ['Un prisma de base cuadrada tiene 6 caras, 8 vértices y 12 aristas: 6 + 8 − 12 = 2.', 'Una pirámide de base hexagonal tiene 7 caras: la base y 6 triángulos.'],
  tip: 'Cuenta por partes: primero las bases y luego las caras laterales.' },
tc: { t: 'Medidas de tendencia central', k: 'La media es la suma de los datos dividida entre la cantidad de datos. La mediana es el dato central de los datos ordenados. La moda es el dato más frecuente. La media se ve muy afectada por valores extremos; la mediana no.',
  ex: ['Para 2, 3, 3, 8, 14: media = 30/5 = 6, mediana = 3 y moda = 3.', 'Si en una tabla 5 familias tienen 2 hijos, aportan 5 × 2 = 10 hijos a la suma total.', 'Notas de 4,0 (60 %) y 3,0 (40 %): promedio ponderado = 0,6 × 4,0 + 0,4 × 3,0 = 3,6.'],
  tip: 'Ordena los datos antes de buscar la mediana y usa las frecuencias en la media.' },
disp: { t: 'Medidas de dispersión y posición', k: 'Indican qué tan separados están los datos. Rango = máximo − mínimo. Los cuartiles dividen los datos ordenados en cuatro partes. La varianza es el promedio de los cuadrados de las distancias a la media.',
  ex: ['Para 4, 6, 8: el rango es 4 y la varianza es (4 + 0 + 4)/3 = 8/3.', 'Los grupos 5, 5, 5 y 1, 5, 9 tienen media 5, pero el segundo está mucho más disperso.', 'Estar en el percentil 70 significa que cerca del 70 % obtuvo un resultado igual o menor.'],
  tip: 'La dispersión no depende de la media sino de qué tan lejos están los datos de ella.' },
tablas: { t: 'Lectura de tablas y gráficos estadísticos', k: 'Lee el título, las categorías y la escala de cada eje. La frecuencia relativa es frecuencia/total, y en un diagrama circular cada porcentaje equivale a porcentaje × 360°. Para comparar grupos de distinto tamaño, usa porcentajes.',

    if (done) fb = `<div class="fb ok" role="status"><b>${mode === 'review' ? '¡Respuesta correcta!' : tried.length ? '¡Ahora sí, correcto!' : '¡Correcto!'}</b>${MF(esc(q.e))}</div>`;
    else if (tried.length) fb = conceptHTML(q, mode === 'review' ? 'Tu respuesta no es correcta. Repasa este tema y vuelve a intentar la pregunta en la sección Practicar.' : tried.length >= 3 ? 'Tampoco es esa opción. Lee de nuevo el repaso, piensa en la que queda o pasa a la siguiente pregunta.' : 'Esa no es la respuesta correcta. Lee este repaso y vuelve a intentarlo, o pasa a la siguiente pregunta.');
    else if (mode === 'review') fb = conceptHTML(q, 'No respondiste esta pregunta. Repasa el tema y practícala después.');
  }
  if (fb) fb = fb.replace(/<\/div>$/, `<div class="fbtools">${ACC.btn('fb')}</div></div>`);
  return `<div class="qhead"><div class="qtop"><span class="qnum">Pregunta ${num}${total ? `<small> de ${total}</small>` : ''}</span>${ACC.btn('q')}</div><div class="chips"><span class="chip">Pensamiento ${PN[q.p].toLowerCase()}</span><span class="chip">${CN[q.c]}</span><span class="chip">${esc(q.t)}</span></div></div>
  <div class="qbody">${q.ctx ? `<div class="ctx">${MF(q.ctx)}</div>` : ''}${MF(q.s)}</div><div class="opts">${opts}</div>${fb}`;
}

const PF = { p: '', c: '', src: '', st: '', n: 10 };

// ================== Simulacro ==================
let SIM = null, timerId = null;
const SC = { n: 20, src: '', p: '' };
function stopTimer() { clearInterval(timerId); timerId = null; }
function vSim() {
  if (!SIM) {
    return `<div class="stack" style="padding-top:22px"><h1>Simulacro</h1>
    <p class="muted" style="margin:0">Cada simulacro es distinto: las preguntas se eligen al azar y primero salen las que aún no has visto. No verás si acertaste hasta que termines. Tienes 2 minutos por pregunta, como referencia del ritmo de la prueba.</p>

     ${sel('ss', 'Fuente', SC.src, [['', 'Todo el banco'], ['Icfes', 'Solo Icfes'], ['Complementaria', 'Solo complementarias']])}
     ${sel('sp', 'Pensamiento', SC.p, [['', 'Todos'], ...Object.entries(PN)])}

  <div class="panel"><div class="row" style="justify-content:space-between;margin-bottom:8px"><span class="lbl">Amarillo: respondida</span><span class="muted num" style="font-size:14px">${answered} de ${SIM.ids.length} respondidas</span></div><div class="navgrid" id="snav">${nav}</div></div>

function startSim() {
  const pool = BANK.filter(q => (!SC.src || q.src === SC.src) && (!SC.p || q.p === SC.p));

  const nuevas = shuffle(pool.filter(q => !(q.id in S.ans))), malas = shuffle(pool.filter(q => S.ans[q.id] === 0)), buenas = shuffle(pool.filter(q => S.ans[q.id] === 1));

function finishSim() {

          <b style="color:var(--accent);display:block;margin-bottom:4px">Opción 1: Instalar como App directa (Inmediato)</b>
          <p class="muted" style="margin:0 0 6px">En tu teléfono Android con <b>Google Chrome</b>:</p>
          <ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px" class="muted">
            <li>Toca los <b>tres puntos (⋮)</b> del navegador.</li>
            <li>Selecciona <b>"Instalar aplicación"</b> o <b>"Agregar a la pantalla principal"</b>.</li>
            <li>¡Listo! Se instala con ícono en tu pantalla de inicio y funciona sin internet.</li>
          </ol>
        </div>
        <div style="background:var(--surface2);padding:12px 14px;border-radius:10px;border-left:4px solid var(--pencil)">
          <b style="color:var(--pencil-ink);display:block;margin-bottom:4px">Opción 2: Descargar el archivo APK compilado</b>
          <p class="muted" style="margin:0 0 6px">Para obtener el archivo <code>app-debug.apk</code> y compartirlo por WhatsApp o memoria USB:</p>
          <ol style="margin:0;padding-left:20px;display:flex;flex-direction:column;gap:4px" class="muted">
            <li>Entra a tu repositorio en GitHub: <code>licdagobertojulio-web/Saber-Mate</code>.</li>
            <li>Abre la pestaña <b>Actions</b> (arriba).</li>
            <li>Haz clic en el flujo <i>"Construir APK de SABER MATE"</i>.</li>
            <li>En la sección <b>Artifacts</b> (abajo), descarga <b>SaberMate-apk</b>. Dentro está <code>app-debug.apk</code>.</li>
          </ol>
        </div>
      </div>
      <button class="btn" id="closeinstallmodal2" style="width:100%;margin-top:6px">Entendido</button>
    </div>`;
    document.body.appendChild(m);
    m.querySelector('#closeinstallmodal').onclick = () => m.remove();
    m.querySelector('#closeinstallmodal2').onclick = () => m.remove();
    m.onclick = e => { if (e.target === m) m.remove(); };
  }
}

// ================== Formulario de nombre ==================
function bindCommon() {
  const f = $('#who'); if (f) f.onsubmit = e => { e.preventDefault(); const n = $('#fname').value.trim(); if (!n) return; S.name = n; S.grupo = $('#fgrupo').value.trim(); persist(); SYNC.add('registro', {}); setStatus(remoteOK || SYNC.enabled ? 'Datos guardados. Tu docente verá tu progreso.' : 'Datos guardados en este dispositivo.'); render(); };
  const sd = $('#soydoc'); if (sd) sd.onclick = () => go('docente');
  const ib = $('#installbtn'); if (ib) ib.onclick = showInstallModal;
  const cb = $('#cardinstallbtn'); if (cb) cb.onclick = showInstallModal;
}

// ================== Arranque ==================
renderTabs(); renderSoundBtn(); renderAccBtn(); render();
(async () => {
  if (SYNC.enabled) { syncStatus(); SYNC.on(() => { syncStatus(); }); }
  if (!window.claude || !window.claude.use) { if (!SYNC.enabled) setStatus('Tu progreso se guarda solo en este dispositivo.', true); return; }
  try {
    [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
    isOwner = user ? await user.isOwner() : false;
    uid = user ? await user.id() : null;
    if (db && uid) {
      remoteOK = true;
      try { const snap = await db.doc('results/' + uid).get(); if (snap.exists) load(snap.data()); } catch (e) { }
      setStatus(S.name ? 'Tu progreso se guarda en tu cuenta y tu docente puede verlo.' : 'Escribe tu nombre para que tu docente vea tu progreso.');
      if (Object.keys(S.ans).length || S.name) persist();
    } else setStatus('Tu progreso se guarda solo en este dispositivo.', true);
    if (isOwner && db) {
      unsub = db.collection('results').onSnapshot(snap => { ROWS = snap.docs.map(d => ({ id: d.id, ...d.data() })); rowsReady = true; if (tab === 'docente') render(); }, () => { rowsReady = true; });
    }
    renderTabs(); if (tab !== 'simulacro' || !SIM) render();
  } catch (e) { setStatus('Tu progreso se guarda solo en este dispositivo.', true); }
})();
</script>
