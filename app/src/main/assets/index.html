N('V','F','Ecuaciones exponenciales','<p>¿Qué valor de <i>x</i> satisface 3<sup><i>x</i> + 1</sup> = 81?</p>',
['3','4','26','27'],'81 = 3⁴, entonces x + 1 = 4 y x = 3.');
N('V','A','Escalas logarítmicas','<p>El pH se define como pH = −log[H<sup>+</sup>]. Una sustancia tiene pH 3 y otra pH 5. Lina afirma que la primera tiene una concentración de iones H<sup>+</sup> 100 veces mayor que la segunda. ¿Es correcta su afirmación?</p>',
['Sí, porque [H⁺] es 10⁻³ en la primera y 10⁻⁵ en la segunda, y 10⁻³ ÷ 10⁻⁵ = 100.','No, porque la diferencia de pH es 2, así que la concentración es el doble.','No, porque un pH mayor indica mayor concentración de H⁺.','Sí, porque 5 × 3 = 15, que se aproxima a 100.'],'En una escala logarítmica, cada unidad de diferencia es un factor de 10. Dos unidades son un factor de 10² = 100.');
N('V','I','Escalas logarítmicas','<p>En la escala de Richter, cada unidad que aumenta la magnitud de un sismo corresponde a una amplitud de onda 10 veces mayor. ¿Cuántas veces mayor es la amplitud de un sismo de magnitud 7 que la de uno de magnitud 5?</p>',
['100 veces','2 veces','20 veces','1,4 veces'],'Son dos unidades de diferencia: 10 × 10 = 100 veces.');
N('V','F','Sucesiones geométricas','<p>En la sucesión 5, 15, 45, 135, …, cada término se obtiene multiplicando el anterior por el mismo número. ¿Cuál es el sexto término?</p>',
['1.215','405','3.645','810'],'La razón es 3: a₆ = 5 × 3⁵ = 5 × 243 = 1.215.');
N('V','F','Series aritméticas','<p>¿Cuál es el resultado de la suma 1 + 2 + 3 + … + 100?</p>',
['5.050','5.000','10.100','4.950'],'Hay 50 parejas que suman 101 (1 + 100, 2 + 99, …): 50 × 101 = 5.050.');
N('V','I','Patrones',`<p>Con palillos se forman figuras de triángulos unidos en fila: la figura 1 tiene 1 triángulo (3 palillos), la figura 2 tiene 2 triángulos (5 palillos) y la figura 3 tiene 3 triángulos (7 palillos).</p>${tbl([['Figura','1','2','3'],['Palillos','3','5','7']])}<p>¿Cuántos palillos se necesitan para la figura 20?</p>`,
['41','60','43','40'],'Cada triángulo nuevo agrega 2 palillos: P = 2n + 1. Para n = 20: 41.');
N('V','F','Evaluación de funciones','<p>Si <i>f</i>(<i>x</i>) = 2<i>x</i><sup>2</sup> − 3<i>x</i>, ¿cuál es el valor de <i>f</i>(−2)?</p>',
['14','2','−14','−2'],'f(−2) = 2(4) − 3(−2) = 8 + 6 = 14. El cuadrado de un negativo es positivo.');
N('V','I','Dominio','<p>¿Cuál es el dominio de la función <i>f</i>(<i>x</i>) = √(<i>x</i> − 4) en los números reales?</p>',
['Todos los números reales mayores o iguales que 4.','Todos los números reales mayores que 4.','Todos los números reales excepto 4.','Todos los números reales mayores o iguales que 2.'],'La raíz cuadrada solo está definida para valores no negativos: x − 4 ≥ 0, entonces x ≥ 4.');
N('V','I','Dominio',`<p>¿Cuál es el dominio de la función <i>g</i>(<i>x</i>) = ${F(1,'<i>x</i> − 2')}?</p>`,
['Todos los números reales excepto 2.','Todos los números reales mayores que 2.','Todos los números reales excepto 0.','Todos los números reales.'],'No se puede dividir entre cero: x − 2 ≠ 0, entonces x ≠ 2.');
N('V','F','Composición de funciones','<p>Si <i>f</i>(<i>x</i>) = <i>x</i> + 3 y <i>g</i>(<i>x</i>) = 2<i>x</i>, ¿cuál es el valor de <i>f</i>(<i>g</i>(4))?</p>',
['11','14','8','7'],'g(4) = 8 y f(8) = 11. (14 sería g(f(4))).');
N('V','A','Concepto de función','<p>¿Cuál de las siguientes tablas <b>NO</b> representa a <i>y</i> como función de <i>x</i>?</p>',
[tbl([['<i>x</i>','1','2','2','3'],['<i>y</i>','4','5','6','7']]),tbl([['<i>x</i>','1','2','3','4'],['<i>y</i>','5','5','5','5']]),tbl([['<i>x</i>','−1','0','1','2'],['<i>y</i>','1','0','1','4']]),tbl([['<i>x</i>','0','1','2','3'],['<i>y</i>','3','2','1','0']])],
'En una función, cada valor de x tiene un único valor de y. En la tabla que no lo es, x = 2 tiene dos valores (5 y 6). Que varios x tengan la misma y sí está permitido.');
N('V','I','Intervalos de crecimiento',`<p>La gráfica muestra la temperatura registrada en una ciudad durante un día.</p>${LG([{pts:[[0,12],[4,10],[8,14],[12,22],[16,24],[20,18],[24,13]]}],{xmax:24,xstep:4,ymin:8,ymax:26,ystep:2,xl:'Hora',yl:'°C'})}<p>¿En qué intervalo de tiempo la temperatura aumentó?</p>`,
['Entre las 4 y las 16 horas.','Entre las 0 y las 12 horas.','Entre las 12 y las 24 horas.','Entre las 16 y las 24 horas.'],'La temperatura bajó de 0 a 4 h, subió de 4 a 16 h (de 10 °C a 24 °C) y luego bajó.');
N('V','I','Razón de cambio en gráficas',`<p>La gráfica muestra la temperatura registrada en una ciudad durante un día.</p>${LG([{pts:[[0,12],[4,10],[8,14],[12,22],[16,24],[20,18],[24,13]]}],{xmax:24,xstep:4,ymin:8,ymax:26,ystep:2,xl:'Hora',yl:'°C'})}<p>¿En cuál intervalo de 4 horas la temperatura disminuyó más rápidamente?</p>`,
['Entre las 16 y las 20 horas.','Entre las 20 y las 24 horas.','Entre las 0 y las 4 horas.','Entre las 12 y las 16 horas.'],'Disminuciones: de 0 a 4 h, 2 °C; de 16 a 20 h, 6 °C; de 20 a 24 h, 5 °C. La mayor caída es entre las 16 y las 20 h.');
N('V','A','Lineal vs. exponencial','<p>A Julián le ofrecen dos opciones de pago por un trabajo de 30 días: la opción 1 es recibir $ 1.000 diarios; la opción 2 es recibir $ 1 el primer día, $ 2 el segundo, $ 4 el tercero, y así duplicando cada día. Julián elige la opción 1 porque “empieza ganando más”. ¿Es la mejor decisión?</p>',
['No, porque el día 30 la opción 2 paga 2²⁹ pesos, más de 500 millones, y supera ampliamente los $ 30.000 de la opción 1.','Sí, porque durante los primeros días la opción 1 paga más.','Sí, porque la opción 2 crece de forma lineal.','No, porque la opción 2 paga $ 60 el último día.'],'El crecimiento exponencial termina superando al lineal. Solo el pago del día 30 de la opción 2 es 2²⁹ = 536.870.912 pesos.');
N('V','I','Interés compuesto','<p>Un capital C<sub>0</sub> se invierte al 2 % mensual de interés compuesto. ¿Qué expresión da el capital después de <i>n</i> meses?</p>',
['C<sub>0</sub>(1,02)<sup><i>n</i></sup>','C<sub>0</sub>(1 + 0,02<i>n</i>)','C<sub>0</sub>(0,02)<sup><i>n</i></sup>','C<sub>0</sub> + 1,02<i>n</i>'],'Cada mes el capital se multiplica por 1,02. (1 + 0,02n) es la fórmula del interés simple.');
N('V','I','Funciones cuadráticas en tablas',`<p>¿Qué expresión relaciona los valores de la tabla?</p>${tbl([['<i>x</i>','0','1','2','3'],['<i>y</i>','1','2','5','10']])}`,
['<i>y</i> = <i>x</i><sup>2</sup> + 1','<i>y</i> = 3<i>x</i> + 1','<i>y</i> = 2<i>x</i> + 1','<i>y</i> = <i>x</i><sup>2</sup> + <i>x</i>'],'Cada valor es el cuadrado de x más 1: 0 + 1, 1 + 1, 4 + 1, 9 + 1.');
N('V','A','Diferencias finitas',`<p>En la tabla, las diferencias entre valores consecutivos de <i>y</i> son 3, 5, 7, 9.</p>${tbl([['<i>x</i>','0','1','2','3','4'],['<i>y</i>','2','5','10','17','26']])}<p>Un estudiante concluye que la relación no es lineal sino cuadrática. ¿Es correcta su conclusión?</p>`,
['Sí, porque las primeras diferencias no son constantes pero las segundas diferencias sí lo son (siempre 2).','No, porque y siempre aumenta, y eso indica una relación lineal.','No, porque para ser cuadrática las primeras diferencias deben ser constantes.','Sí, porque los valores de y son todos números primos.'],'Una relación lineal tiene primeras diferencias constantes. Una cuadrática tiene segundas diferencias constantes. Aquí y = x² + 2x + 2.');
N('V','F','Ingreso máximo','<p>Una empresa estima que si vende un producto a <i>p</i> miles de pesos, venderá (100 − 2<i>p</i>) unidades. ¿Con qué precio obtiene el mayor ingreso?</p>',
['25 mil pesos','50 mil pesos','100 mil pesos','20 mil pesos'],'I(p) = p(100 − 2p) = 100p − 2p². El máximo está en p = −100/(2 · (−2)) = 25. Ese ingreso es 1.250 mil pesos.');
N('V','I','Traslaciones','<p>¿Cómo se obtiene la gráfica de <i>y</i> = (<i>x</i> − 2)<sup>2</sup> + 1 a partir de la gráfica de <i>y</i> = <i>x</i><sup>2</sup>?</p>',
['Trasladándola 2 unidades a la derecha y 1 unidad hacia arriba.','Trasladándola 2 unidades a la izquierda y 1 unidad hacia arriba.','Trasladándola 2 unidades a la derecha y 1 unidad hacia abajo.','Estirándola verticalmente al doble.'],'(x − h)² + k traslada el vértice a (h, k) = (2, 1).');
N('V','F','Ecuaciones con radicales','<p>¿Qué valor de <i>x</i> satisface √(<i>x</i> + 5) = 4?</p>',
['11','−1','3','21'],'Elevando al cuadrado: x + 5 = 16, entonces x = 11. Comprobación: √16 = 4.');
N('V','F','Funciones a trozos','<p>Un parqueadero cobra $ 3.000 por la primera hora y $ 2.000 por cada hora adicional o fracción. ¿Cuánto paga una persona que deja su carro 3 horas y 20 minutos?</p>',
['$ 9.000','$ 7.000','$ 9.666','$ 11.000'],'Primera hora: 3.000. Quedan 2 h 20 min, que se cobran como 3 horas adicionales (por la fracción): 3 × 2.000 = 6.000. Total: 9.000.');
N('V','I','Logaritmos','<p>El número <i>x</i> que satisface 2<sup><i>x</i></sup> = 10 está entre</p>',
['3 y 4','2 y 3','4 y 5','5 y 10'],'2³ = 8 y 2⁴ = 16. Como 8 < 10 < 16, x está entre 3 y 4 (x ≈ 3,32).');
N('V','F','Crecimiento exponencial',`<p>La cantidad de bacterias en un cultivo después de <i>t</i> horas es N = 500 · 2<sup><i>t</i>/3</sup>. ¿Después de cuántas horas habrá 8.000 bacterias?</p>`,
['12 horas','16 horas','4 horas','48 horas'],'2^(t/3) = 16 = 2⁴, entonces t/3 = 4 y t = 12 horas.');
N('V','A','Lineal vs. exponencial','<p>Un estudiante compara <i>f</i>(<i>x</i>) = 100<i>x</i> y <i>g</i>(<i>x</i>) = 2<sup><i>x</i></sup> para valores positivos de <i>x</i>, y afirma que <i>f</i> siempre será mayor que <i>g</i> porque para <i>x</i> = 5, <i>f</i>(5) = 500 y <i>g</i>(5) = 32. ¿Es correcta su afirmación?</p>',
['No, porque para x = 10, f(10) = 1.000 y g(10) = 1.024; la función exponencial termina superando a la lineal.','Sí, porque la pendiente de f es 100 y la de g es 2.','Sí, porque una función lineal siempre crece más rápido que una exponencial.','No, porque g(5) = 100 y f(5) = 32.'],'Comprobar unos pocos valores no demuestra una afirmación general. Desde x = 10, 2ˣ supera a 100x y la diferencia crece cada vez más.');
N('V','F','Función inversa','<p>Si <i>f</i>(<i>x</i>) = 3<i>x</i> − 6, ¿cuál es su función inversa?</p>',
[`<i>f</i><sup>−1</sup>(<i>x</i>) = ${F('<i>x</i> + 6',3)}`,`<i>f</i><sup>−1</sup>(<i>x</i>) = ${F(1,'3<i>x</i> − 6')}`,`<i>f</i><sup>−1</sup>(<i>x</i>) = 3<i>x</i> + 6`,`<i>f</i><sup>−1</sup>(<i>x</i>) = ${F('<i>x</i>',3)} − 6`],'Despejando x de y = 3x − 6: x = (y + 6)/3. La inversa deshace las operaciones en orden contrario.');
N('V','I','Funciones periódicas','<p>La altura de una cabina de una rueda de Chicago se repite cada 8 minutos. Si a los 3 minutos de iniciado el recorrido la cabina está a 12 m de altura, ¿a qué altura estará a los 19 minutos?</p>',
['A 12 m','A 76 m','A 24 m','A 4 m'],'19 = 3 + 2 × 8. Han pasado dos periodos completos, así que la altura es la misma: 12 m.');
N('V','I','Modelos exponenciales','<p>¿Cuál de las siguientes situaciones se modela mejor con una función exponencial decreciente?</p>',
['El valor de un carro que pierde el 15 % de su valor cada año.','El agua de un tanque que se desocupa a razón de 10 litros por minuto.','El costo de un taxi que cobra un valor fijo por kilómetro.','La distancia recorrida por un tren que viaja a velocidad constante.'],'Perder un porcentaje fijo cada periodo equivale a multiplicar por 0,85 cada año. Las otras situaciones cambian una cantidad fija por unidad de tiempo: son lineales.');
N('V','F','Sistemas no lineales','<p>¿En qué puntos se cortan la parábola <i>y</i> = <i>x</i><sup>2</sup> y la recta <i>y</i> = <i>x</i> + 2?</p>',
['(2, 4) y (−1, 1)','(2, 4) y (1, 1)','(−2, 4) y (1, 1)','Solo en (0, 0)'],'x² = x + 2, entonces x² − x − 2 = 0 y (x − 2)(x + 1) = 0. Con x = 2, y = 4; con x = −1, y = 1.');
N('V','I','Gráficas velocidad-tiempo',`<p>La gráfica muestra la velocidad de un carro durante un recorrido corto.</p>${LG([{pts:[[0,0],[2,20],[6,20],[8,0]]}],{xmax:8,ymax:25,ystep:5,xl:'Tiempo (s)',yl:'Velocidad (m/s)'})}<p>¿Qué sucedió entre los segundos 2 y 6?</p>`,
['El carro se movió con velocidad constante de 20 m/s.','El carro estuvo detenido.','El carro aceleró de forma constante.','El carro recorrió 20 metros.'],'El tramo horizontal indica que la velocidad no cambia (20 m/s). No significa que esté quieto: en ese tramo recorrió 20 × 4 = 80 m.');
N('V','F','Área bajo la curva',`<p>La gráfica muestra la velocidad de un carro durante un recorrido corto.</p>${LG([{pts:[[0,0],[2,20],[6,20],[8,0]]}],{xmax:8,ymax:25,ystep:5,xl:'Tiempo (s)',yl:'Velocidad (m/s)'})}<p>La distancia recorrida corresponde al área bajo la gráfica. ¿Qué distancia recorrió el carro en los 8 segundos?</p>`,

N('V','F','Ecuaciones cuadráticas en contexto','<p>Un terreno rectangular tiene un largo 4 m mayor que su ancho y su área es 96 m². ¿Cuánto mide el ancho?</p>',
['8 m','12 m','6 m','24 m'],'x(x + 4) = 96, entonces x² + 4x − 96 = 0 y (x + 12)(x − 8) = 0. Como una longitud no puede ser negativa, x = 8 m.');
N('V','A','Soluciones en contexto','<p>Para hallar el lado de un cuadrado de 25 m² de área, Juan resolvió <i>x</i><sup>2</sup> = 25 y concluyó que el lado puede medir 5 m o −5 m. ¿Es correcta su conclusión?</p>',
['No, porque aunque la ecuación tiene dos soluciones, una longitud no puede ser negativa; el lado mide 5 m.','Sí, porque ambas soluciones satisfacen la ecuación.','No, porque la solución de x² = 25 es x = 12,5.','Sí, porque el lado puede medirse en ambos sentidos.'],'Las soluciones de una ecuación deben interpretarse en el contexto del problema. −5 cumple la ecuación, pero no tiene sentido como medida de un lado.');
N('V','F','Notación funcional','<p>Si <i>f</i>(<i>x</i>) = <i>x</i><sup>2</sup>, ¿a qué es igual <i>f</i>(<i>x</i> + 1)?</p>',
['<i>x</i><sup>2</sup> + 2<i>x</i> + 1','<i>x</i><sup>2</sup> + 1','<i>x</i><sup>2</sup> + <i>x</i>','2<i>x</i> + 1'],'f(x + 1) = (x + 1)² = x² + 2x + 1. El binomio al cuadrado no es la suma de los cuadrados.');
N('V','I','Rango','<p>¿Cuál es el rango de la función <i>f</i>(<i>x</i>) = <i>x</i><sup>2</sup> + 3?</p>',
['Todos los números reales mayores o iguales que 3.','Todos los números reales.','Todos los números reales mayores que 0.','Todos los números reales menores o iguales que 3.'],'Como x² ≥ 0, x² + 3 ≥ 3. El valor mínimo, 3, se alcanza en x = 0.');
N('V','F','Ecuaciones exponenciales','<p>¿Qué valor de <i>x</i> satisface 4<sup><i>x</i></sup> = 2<sup><i>x</i> + 3</sup>?</p>',
['3','1','6','−3'],'4ˣ = 2²ˣ. Igualando exponentes: 2x = x + 3, entonces x = 3.');
N('V','A','Porcentajes repetidos','<p>El precio de un servicio aumenta 10 % cada año durante 3 años. Felipe afirma que en total el precio aumentó 30 %. ¿Es correcta su afirmación?</p>',
['No, aumentó 33,1 %, porque cada aumento se aplica sobre el precio ya aumentado: 1,1³ = 1,331.','Sí, porque 10 % + 10 % + 10 % = 30 %.','No, aumentó 1.000 %, porque 10³ = 1.000.','No, aumentó 27,1 %, porque 0,9³ = 0,729.'],'Los aumentos sucesivos se multiplican: 1,1 × 1,1 × 1,1 = 1,331, un aumento total del 33,1 %.');
N('V','F','Logaritmos en contexto','<p>El nivel de intensidad de un sonido en decibelios es L = 10 · log(I / I<sub>0</sub>). ¿Cuál es el nivel de un sonido cuya intensidad es I = 10<sup>6</sup> · I<sub>0</sub>?</p>',
['60 dB','6 dB','10<sup>6</sup> dB','16 dB'],'L = 10 · log(10⁶) = 10 × 6 = 60 dB.');

N('M','F','Longitud de la circunferencia','<p>Una rueda tiene 10 cm de diámetro. ¿Qué distancia aproximada recorre en una vuelta completa? (Usa π ≈ 3,14).</p>',

N('M','F','Unidades de área','<p>¿A cuántos centímetros cuadrados equivalen 3 m²?</p>',

N('M','F','Volumen y capacidad','<p>Un tanque tiene forma de prisma rectangular de 2 m de largo, 1 m de ancho y 0,5 m de alto. ¿Cuántos litros de agua le caben?</p>',

N('M','F','Volumen y capacidad','<p>Una piscina rectangular mide 10 m de largo, 5 m de ancho y 1,5 m de profundidad. ¿Cuántos litros de agua se necesitan para llenarla?</p>',

N('M','F','Volumen del cilindro','<p>¿Cuál es el volumen aproximado de un cilindro de 3 cm de radio y 10 cm de altura? (Usa π ≈ 3,14).</p>',

N('M','A','Variación del área','<p>Mariana afirma que si se duplica el radio de un círculo, su área también se duplica. ¿Es correcta su afirmación?</p>',
['No, porque el área depende del cuadrado del radio: π(2r)² = 4πr², es decir, se cuadruplica.','Sí, porque el área es proporcional al radio.','No, porque el área se triplica.','Sí, porque la longitud de la circunferencia también se duplica.'],'La longitud de la circunferencia sí se duplica (2π · 2r), pero el área se multiplica por 2² = 4.');
N('M','A','Variación del volumen','<p>Un estudiante afirma que si se duplica la arista de un cubo, su volumen se duplica. ¿Es correcta su afirmación?</p>',
['No, porque el volumen se multiplica por 2³ = 8.','Sí, porque todas las medidas se duplican.','No, porque el volumen se multiplica por 4.','Sí, porque el volumen es proporcional a la arista.'],'(2a)³ = 8a³. Las longitudes se multiplican por k, las áreas por k² y los volúmenes por k³.');
N('M','F','Áreas compuestas','<p>Un terreno tiene forma de rectángulo de 10 m por 6 m, al que le falta una esquina cuadrada de 4 m de lado. ¿Cuál es el área del terreno?</p>',

N('E','A','Semejanza','<p>Un estudiante afirma que todos los rectángulos son semejantes porque todos tienen cuatro ángulos rectos. ¿Es verdadera su afirmación?</p>',
['No, porque además de tener ángulos iguales, sus lados deben ser proporcionales; un rectángulo de 1 × 2 y otro de 1 × 3 no son semejantes.','Sí, porque tener ángulos iguales basta para que dos polígonos sean semejantes.','Sí, porque todos los rectángulos tienen lados opuestos iguales.','No, porque los rectángulos no tienen ángulos iguales.'],'En los triángulos, tener ángulos iguales basta, pero en los cuadriláteros no. Los cuadrados sí son todos semejantes.');
N('E','A','Congruencia de triángulos','<p>¿Cuál de las siguientes condiciones garantiza que dos triángulos sean congruentes?</p>',
['Tener dos lados respectivamente iguales y el ángulo comprendido entre ellos igual.','Tener sus tres ángulos respectivamente iguales.','Tener la misma área.','Tener el mismo perímetro.'],'El criterio LAL garantiza la congruencia. Con los ángulos iguales solo se garantiza semejanza, y triángulos distintos pueden tener la misma área o el mismo perímetro.');
N('E','F','Triángulo equilátero','<p>¿Cuál es la altura de un triángulo equilátero de 6 cm de lado?</p>',
[`3${R(3)} cm`,'6 cm','3 cm',`6${R(3)} cm`],'La altura divide al triángulo en dos triángulos rectángulos: h² + 3² = 6², entonces h = √27 = 3√3 ≈ 5,2 cm.');
N('E','F','Diagonal del cubo','<p>¿Cuánto mide la diagonal de un cubo de 2 cm de arista (la que une dos vértices opuestos atravesando el cubo)?</p>',
[`2${R(3)} cm`,`2${R(2)} cm`,'6 cm','4 cm'],'La diagonal de una cara mide 2√2. Luego D² = (2√2)² + 2² = 8 + 4 = 12, y D = 2√3 cm.');
N('E','I','Rectas perpendiculares',`<p>¿Cuál es la posición relativa de las rectas <i>y</i> = 3<i>x</i> + 1 y <i>y</i> = −${F('<i>x</i>',3)} + 2?</p>`,
['Son perpendiculares, porque el producto de sus pendientes es −1.','Son paralelas, porque sus pendientes son recíprocas.','Son coincidentes.','Se cortan, pero no forman ángulo recto.'],'Las pendientes son 3 y −1/3, y 3 × (−1/3) = −1.');
N('E','F','Áreas en el plano cartesiano','<p>¿Cuál es el área del triángulo con vértices en (0, 0), (6, 0) y (0, 4)?</p>',
['12 unidades cuadradas','24 unidades cuadradas','10 unidades cuadradas','7,2 unidades cuadradas'],'Es un triángulo rectángulo con catetos 6 y 4 sobre los ejes: (6 × 4)/2 = 12.');
N('E','I','Cuadriláteros','<p>Los vértices de un cuadrilátero son (0, 0), (4, 0), (5, 3) y (1, 3). ¿Qué tipo de cuadrilátero es?</p>',
['Un paralelogramo que no es rectángulo.','Un rectángulo.','Un cuadrado.','Un trapecio con un solo par de lados paralelos.'],'Los lados opuestos son paralelos: dos lados horizontales de longitud 4 y dos lados con la misma pendiente 3. No tiene ángulos rectos, así que no es rectángulo.');
N('E','I','Secciones de sólidos','<p>Si se corta un cono con un plano paralelo a su base, ¿qué figura se obtiene en el corte?</p>',
['Un círculo','Un triángulo','Una elipse','Un rectángulo'],'Un corte paralelo a la base produce una figura semejante a la base: un círculo más pequeño.');
N('E','I','Secciones de sólidos','<p>Si se corta un cilindro con un plano vertical que contiene su eje, ¿qué figura se obtiene en el corte?</p>',
['Un rectángulo','Un círculo','Un triángulo','Un trapecio'],'El corte tiene como lados la altura del cilindro y el diámetro de la base.');
N('E','F','Ángulos suplementarios','<p>Dos ángulos son suplementarios y uno de ellos mide el doble del otro. ¿Cuánto mide el mayor?</p>',
['120°','60°','90°','135°'],'x + 2x = 180°, entonces x = 60° y el mayor mide 120°.');
N('E','F','Ángulo exterior','<p>En un triángulo, dos ángulos interiores miden 40° y 75°. ¿Cuánto mide el ángulo exterior adyacente al tercer ángulo?</p>',
['115°','65°','245°','35°'],'El ángulo exterior es igual a la suma de los dos interiores no adyacentes: 40° + 75° = 115°. El tercer ángulo interior mide 65°.');
N('E','A','Clasificación por lados','<p>Un triángulo tiene lados de 6, 8 y 11 cm. Laura afirma que es un triángulo rectángulo. ¿Tiene razón?</p>',
['No, porque 6² + 8² = 100 es menor que 11² = 121; el triángulo es obtusángulo.','Sí, porque 6 + 8 > 11.','No, porque es un triángulo acutángulo.','Sí, porque es parecido al triángulo de lados 6, 8 y 10.'],'Si a² + b² < c², el ángulo opuesto al lado mayor es obtuso. Que 6 + 8 > 11 solo prueba que el triángulo existe.');
N('E','I','Razones trigonométricas','<p>¿Cuáles son los valores de sen 150° y cos 150°?</p>',
[`sen 150° = ${F(1,2)} y cos 150° = −${F(R(3),2)}`,`sen 150° = −${F(1,2)} y cos 150° = ${F(R(3),2)}`,`sen 150° = ${F(R(3),2)} y cos 150° = −${F(1,2)}`,`sen 150° = ${F(1,2)} y cos 150° = ${F(R(3),2)}`],'150° está en el segundo cuadrante: el seno es positivo y el coseno negativo. Su ángulo de referencia es 30°.');
N('E','I','Medida en radianes','<p>¿A cuántos radianes equivale un ángulo de 90°?</p>',
[F('π',2),'π',F('π',4),'2π'],'180° = π rad, así que 90° = π/2 rad.');
N('E','F','Desplazamientos','<p>Un barco navega 3 km hacia el norte y luego 4 km hacia el este. ¿A qué distancia en línea recta queda del punto de partida?</p>',
['5 km','7 km','1 km','12 km'],'Los desplazamientos son perpendiculares: d = √(3² + 4²) = 5 km. Los 7 km son el recorrido total.');
N('E','A','Distancias en cuadrículas','<p>En un barrio con calles en cuadrícula, la casa de Pedro está en (0, 0) y el colegio en (−3, 4), donde cada unidad es una cuadra. Pedro dice que camina 5 cuadras para llegar al colegio. ¿Es correcto?</p>',
['No, por las calles debe recorrer al menos 3 + 4 = 7 cuadras; 5 cuadras sería la distancia en línea recta.','Sí, porque la distancia entre los dos puntos es √(9 + 16) = 5.','No, debe recorrer 12 cuadras.','Sí, porque −3 + 4 + 4 = 5.'],'La distancia euclidiana (5) supone atravesar las manzanas en línea recta. Caminando por las calles la menor distancia es |−3| + |4| = 7.');
N('E','I','Homotecias','<p>Una figura se amplía con una homotecia de centro en el origen y razón 3. ¿Cuál es la imagen del punto (2, −1)?</p>',
['(6, −3)','(5, 2)','(2/3, −1/3)','(6, 3)'],'Una homotecia de razón 3 con centro en el origen multiplica cada coordenada por 3.');
N('E','A','Teselaciones','<p>¿Con cuál de los siguientes polígonos regulares <b>NO</b> es posible cubrir un piso sin dejar huecos ni superponer piezas?</p>',
['Pentágono regular','Triángulo equilátero','Cuadrado','Hexágono regular'],'Los ángulos que se juntan en un vértice deben sumar 360°. El pentágono tiene ángulos de 108°, y 360 no es múltiplo de 108. Los otros tienen ángulos de 60°, 90° y 120°.');
N('E','F','Longitud de arco','<p>¿Cuál es la longitud de un arco de 60° en una circunferencia de 6 cm de radio? (Usa π ≈ 3,14).</p>',
['6,28 cm','37,68 cm','18,84 cm','3,14 cm'],'El arco es 60/360 = 1/6 de la circunferencia: (1/6) × 2π × 6 = 2π ≈ 6,28 cm.');
N('E','A','Ángulos inscritos','<p>Un triángulo está inscrito en una circunferencia de modo que uno de sus lados es un diámetro. Un estudiante afirma que el ángulo opuesto a ese lado siempre mide 90°. ¿Es correcta su afirmación?</p>',
['Sí, porque es un ángulo inscrito que abarca una semicircunferencia (180°), y mide la mitad.','No, porque depende de dónde se ubique el tercer vértice.','Sí, porque todos los triángulos inscritos son rectángulos.','No, porque mide 180°.'],'Un ángulo inscrito mide la mitad del arco que abarca. Una semicircunferencia mide 180°, así que el ángulo mide 90°.');
N('E','F','Ley del seno','<p>En un triángulo, el ángulo A mide 30°, el ángulo B mide 45° y el lado <i>a</i>, opuesto a A, mide 10 cm. ¿Cuánto mide el lado <i>b</i>, opuesto a B? (sen 30° = 0,5; sen 45° ≈ 0,71).</p>',
['Aproximadamente 14,1 cm','Aproximadamente 7,1 cm','15 cm','Aproximadamente 5 cm'],'b/sen 45° = a/sen 30°, entonces b = 10 × 0,71/0,5 ≈ 14,1 cm (exactamente 10√2).');
N('E','I','Ángulo de inclinación','<p>¿Qué ángulo forma con el eje <i>x</i> positivo la recta <i>y</i> = <i>x</i> + 3?</p>',
['45°','30°','60°','90°'],'La pendiente es igual a la tangente del ángulo de inclinación: tan θ = 1, entonces θ = 45°.');
N('E','F','Diagonales de polígonos','<p>¿Cuántas diagonales tiene un hexágono?</p>',
['9','6','12','18'],'D = n(n − 3)/2 = 6 × 3/2 = 9. Desde cada vértice salen 3 diagonales, y cada una se cuenta dos veces.');
N('E','A','Paralelismo','<p>En un plano, dos rectas son perpendiculares a una misma tercera recta. ¿Qué se puede concluir sobre esas dos rectas?</p>',
['Son paralelas entre sí, porque forman ángulos correspondientes de 90° con la tercera recta.','Son perpendiculares entre sí.','Se cortan formando un ángulo de 45°.','No se puede concluir nada.'],'Si una transversal forma ángulos correspondientes iguales con dos rectas, estas son paralelas. Aquí ambos ángulos miden 90°.');

N('A','F','Media aritmética','<p>Las notas de Juliana en cinco evaluaciones fueron 3,0; 4,5; 3,5; 4,0 y 5,0. ¿Cuál es su promedio?</p>',
['4,0','3,5','4,5','20'],'Suma: 20,0. Promedio: 20 ÷ 5 = 4,0.');
N('A','F','Mediana','<p>¿Cuál es la mediana del conjunto de datos 7, 3, 9, 5, 11, 2?</p>',
['6','5','7','6,2'],'Ordenados: 2, 3, 5, 7, 9, 11. Como hay un número par de datos, la mediana es el promedio de los dos centrales: (5 + 7)/2 = 6.');
N('A','I','Moda',`<p>Una tienda registró las tallas de camisetas vendidas en una semana.</p>${tbl([['Talla','S','M','L','XL'],['Unidades vendidas','5','12','8','3']])}<p>¿Cuál es la moda de las tallas vendidas?</p>`,
['M','12','L','XL'],'La moda es el dato con mayor frecuencia: la talla M (12 unidades). La moda es la talla, no su frecuencia.');
N('A','F','Rango','<p>Las temperaturas máximas de una semana fueron 18 °C, 22 °C, 15 °C, 25 °C y 20 °C. ¿Cuál es el rango de los datos?</p>',
['10 °C','25 °C','20 °C','7 °C'],'Rango = valor máximo − valor mínimo = 25 − 15 = 10 °C.');
N('A','I','Diagramas de barras',`<p>El diagrama muestra las ventas de empanadas de una cafetería escolar durante una semana.</p>${BG(['Lun','Mar','Mié','Jue','Vie'],[30,45,25,50,40],{ymax:60,ystep:10,yl:'Unidades'})}<p>¿Cuántas empanadas se vendieron en total durante la semana?</p>`,
['190','50','38','200'],'30 + 45 + 25 + 50 + 40 = 190. (50 es el máximo y 38 el promedio diario).');
N('A','F','Media con frecuencias',`<p>Se preguntó a 20 estudiantes cuántos libros leyeron el mes pasado.</p>${tbl([['Libros leídos','0','1','2','3'],['Número de estudiantes','4','8','6','2']])}<p>¿Cuál es el promedio de libros leídos por estudiante?</p>`,
['1,3','1,5','5','6,5'],'Total de libros: 0 × 4 + 1 × 8 + 2 × 6 + 3 × 2 = 26. Promedio: 26 ÷ 20 = 1,3. No se promedian 0, 1, 2 y 3 directamente.');
N('A','F','Mediana con frecuencias',`<p>Se preguntó a 20 estudiantes cuántos libros leyeron el mes pasado.</p>${tbl([['Libros leídos','0','1','2','3'],['Número de estudiantes','4','8','6','2']])}<p>¿Cuál es la mediana de los datos?</p>`,
['1','1,5','2','8'],'Con 20 datos ordenados, la mediana es el promedio de los datos 10 y 11. Los datos 1 a 4 son 0 y los datos 5 a 12 son 1, así que la mediana es 1.');
N('A','A','Medidas de tendencia central','<p>En una pequeña empresa, cuatro empleados ganan $ 1.500.000 cada uno y el gerente gana $ 20.000.000. El gerente dice que el salario promedio es de $ 5.200.000 y que por eso los salarios son altos. ¿Es apropiado usar el promedio para describir los salarios de esta empresa?</p>',
['No, porque la media se ve muy afectada por el salario extremo del gerente; la mediana ($ 1.500.000) representa mejor a la mayoría.','Sí, porque la media siempre es la mejor medida de tendencia central.','Sí, porque el cálculo del promedio es correcto.','No, porque el promedio real es $ 1.500.000.'],'La media es (4 × 1,5 + 20)/5 = 5,2 millones, y el cálculo es correcto. Pero ningún empleado gana algo cercano a eso: la mediana resiste mejor los valores extremos.');
N('A','F','Promedio ponderado','<p>En una asignatura, el primer corte vale 30 %, el segundo 30 % y el tercero 40 %. Si un estudiante obtuvo 4,0; 3,5 y 4,5, ¿cuál es su nota definitiva?</p>',
['4,05','4,0','3,95','4,1'],'0,3 × 4,0 + 0,3 × 3,5 + 0,4 × 4,5 = 1,2 + 1,05 + 1,8 = 4,05. El promedio simple sería 4,0.');
N('A','F','Frecuencia relativa','<p>En una encuesta a 50 personas, 15 dijeron que su deporte favorito es el fútbol. ¿Qué porcentaje de los encuestados prefiere el fútbol?</p>',
['30 %','15 %','35 %','50 %'],'15 ÷ 50 = 0,30 = 30 %.');
N('A','F','Diagramas circulares','<p>En un diagrama circular que representa las preferencias de 250 personas, el sector de “jugos naturales” corresponde al 40 %. ¿Cuántas personas prefieren jugos naturales?</p>',
['100','40','144','160'],'0,40 × 250 = 100 personas. (144° sería el ángulo del sector).');
N('A','A','Gráficas engañosas','<p>Un diagrama de barras muestra las ventas de dos marcas: la marca A vendió 1.020 unidades y la B, 1.000. El eje vertical empieza en 990, así que la barra de A se ve el triple de alta que la de B. ¿Qué se puede afirmar de esta gráfica?</p>',
['Exagera la diferencia, porque A vendió solo un 2 % más que B, aunque visualmente parezca el triple.','Es correcta, porque A vendió el triple que B.','Es correcta, porque la escala no afecta la lectura de los datos.','Exagera la diferencia, porque B vendió más que A.'],'Cuando el eje no empieza en cero, las alturas de las barras no son proporcionales a los valores. La diferencia real es 20 unidades sobre 1.000.');
N('A','F','Media aritmética','<p>El promedio de cuatro números es 10. Tres de ellos son 8, 12 y 9. ¿Cuál es el cuarto número?</p>',
['11','10','9,7','29'],'La suma de los cuatro es 4 × 10 = 40. El cuarto es 40 − (8 + 12 + 9) = 11.');
N('A','A','Propiedades de la media','<p>Un profesor decide sumar 0,2 a la nota de cada uno de sus estudiantes. ¿Qué sucede con el promedio del curso?</p>',
['Aumenta exactamente 0,2, porque la suma total aumenta 0,2 por cada estudiante.','No cambia, porque la cantidad de estudiantes es la misma.','Aumenta 0,2 multiplicado por el número de estudiantes.','Aumenta, pero no se puede saber cuánto sin conocer las notas.'],'Si cada dato aumenta en c, la suma aumenta en n·c y la media en (n·c)/n = c. El rango no cambia.');
N('A','A','Propiedades de la dispersión','<p>Si cada dato de un conjunto se multiplica por 2, ¿qué ocurre con la media y el rango?</p>',
['Ambos se duplican.','La media se duplica y el rango no cambia.','La media no cambia y el rango se duplica.','Ninguno cambia.'],'Multiplicar todos los datos por k multiplica por k la media y también las distancias entre datos, incluido el rango.');
N('A','F','Cuartiles','<p>Para los datos 2, 4, 5, 7, 8, 10, 12, el primer cuartil es 4 y el tercer cuartil es 10. ¿Cuál es el rango intercuartílico?</p>',
['6','10','7','14'],'Rango intercuartílico = Q3 − Q1 = 10 − 4 = 6. Mide la dispersión del 50 % central de los datos.');
N('A','I','Tipos de variables','<p>En una encuesta se pregunta a los estudiantes cuántos hermanos tienen. ¿De qué tipo es esta variable?</p>',
['Cuantitativa discreta','Cuantitativa continua','Cualitativa nominal','Cualitativa ordinal'],'Es un número (cuantitativa) que solo toma valores enteros (discreta). La estatura, por ejemplo, sería continua.');
N('A','I','Población y muestra','<p>Un colegio tiene 1.500 estudiantes. Para conocer su opinión sobre el menú del restaurante escolar, se encuesta a 200 estudiantes elegidos al azar. ¿Qué representan los 200 estudiantes?</p>',
['La muestra','La población','La variable','La frecuencia'],'La población son los 1.500 estudiantes; la muestra es el subconjunto de 200 que se encuesta.');
N('A','A','Sesgo de muestreo','<p>Para estimar cuántas horas de ejercicio hacen los habitantes de una ciudad, se encuestó a 300 personas a la salida de un gimnasio. ¿Son confiables los resultados para toda la ciudad?</p>',
['No, porque la muestra no es representativa: las personas que van al gimnasio probablemente hacen más ejercicio que el promedio.','Sí, porque 300 personas es una muestra grande.','Sí, porque todos los encuestados viven en la ciudad.','No, porque se debió encuestar exactamente al 10 % de la ciudad.'],'El tamaño no corrige un sesgo de selección. La muestra debe elegirse de forma que cualquier habitante pueda quedar incluido.');
N('A','I','Tablas de datos agrupados',`<p>La tabla muestra las estaturas de los estudiantes de un curso.</p>${tbl([['Estatura (cm)','[150, 160)','[160, 170)','[170, 180)','[180, 190)'],['Estudiantes','6','14','8','2']])}<p>¿Qué porcentaje de los estudiantes mide 170 cm o más?</p>`,
['33,3 %','26,7 %','10 %','46,7 %'],'Miden 170 cm o más 8 + 2 = 10 de 30 estudiantes: 10/30 ≈ 33,3 %.');
N('A','F','Media de datos agrupados',`<p>La tabla muestra las estaturas de los estudiantes de un curso.</p>${tbl([['Estatura (cm)','[150, 160)','[160, 170)','[170, 180)','[180, 190)'],['Estudiantes','6','14','8','2']])}<p>Usando las marcas de clase (155, 165, 175 y 185), ¿cuál es la estatura promedio aproximada?</p>`,

N('A','I','Variación en gráficas',`<p>El diagrama muestra la precipitación mensual en un municipio durante el primer semestre.</p>${BG(['Ene','Feb','Mar','Abr','May','Jun'],[50,80,120,150,100,60],{ymax:160,ystep:40,yl:'mm'})}<p>¿En qué mes se presentó el mayor aumento de lluvia respecto al mes anterior?</p>`,
['Marzo','Abril','Febrero','Mayo'],'Aumentos: febrero +30, marzo +40, abril +30. En mayo y junio la lluvia disminuyó. Abril es el mes con más lluvia, pero no el de mayor aumento.');
N('A','A','Dispersión','<p>Dos grupos de datos tienen la misma media: el grupo A es 5, 5, 5, 5 y el grupo B es 1, 3, 7, 9. ¿Cuál de las siguientes afirmaciones es correcta?</p>',
['El grupo B tiene mayor dispersión, porque sus datos están más alejados de la media.','Ambos grupos tienen la misma dispersión, porque tienen la misma media.','El grupo A tiene mayor dispersión, porque todos sus datos son iguales.','No se puede comparar la dispersión de dos grupos con la misma media.'],'Ambos tienen media 5, pero en A todos los datos coinciden con la media (dispersión 0), mientras en B se alejan hasta 4 unidades.');
N('A','F','Tablas de doble entrada',`<p>La tabla muestra el género musical preferido por los estudiantes de grados 10.° y 11.° de un colegio.</p>${tbl([['','Rock','Pop','Urbano','Total'],['Grado 10.°','15','25','20','60'],['Grado 11.°','20','15','25','60'],['Total','35','40','45','120']])}<p>¿Qué porcentaje de los estudiantes de grado 11.° prefiere la música urbana?</p>`,

N('A','F','Tablas de doble entrada',`<p>La tabla muestra el género musical preferido por los estudiantes de grados 10.° y 11.° de un colegio.</p>${tbl([['','Rock','Pop','Urbano','Total'],['Grado 10.°','15','25','20','60'],['Grado 11.°','20','15','25','60'],['Total','35','40','45','120']])}<p>De los estudiantes que prefieren el rock, ¿qué porcentaje es de grado 10.°?</p>`,

N('A','F','Diagrama de tallo y hojas','<p>El siguiente diagrama de tallo y hojas muestra las edades de los asistentes a un taller:</p><p class="eq">2 | 3 5 8<br>3 | 0 4 4 9<br>4 | 1 6</p><p>¿Cuál es la mediana de las edades?</p>',
['34 años','30 años','33,3 años','39 años'],'Los datos son 23, 25, 28, 30, 34, 34, 39, 41, 46. Con 9 datos, la mediana es el quinto: 34.');
N('A','F','Media con frecuencias',`<p>La tabla muestra la cantidad de goles marcados por un equipo en los partidos de un torneo.</p>${tbl([['Goles en el partido','0','1','2','3','4'],['Número de partidos','3','5','4','2','1']])}<p>¿Cuál es el promedio aproximado de goles por partido?</p>`,
['1,53','2','3','1,7'],'Total de goles: 0 + 5 + 8 + 6 + 4 = 23, en 15 partidos: 23 ÷ 15 ≈ 1,53.');
N('A','A','Interpretación de la media','<p>Un equipo marcó en promedio 1,53 goles por partido en un torneo. Un hincha afirma que eso significa que en algún partido el equipo marcó 1,53 goles. ¿Es correcta su afirmación?</p>',
['No, porque el promedio es un valor representativo del conjunto y no tiene que coincidir con ningún dato; los goles son números enteros.','Sí, porque el promedio siempre es uno de los datos.','Sí, porque el promedio es el valor que más se repite.','No, porque el promedio de goles siempre es un número entero.'],'La media no tiene que ser uno de los datos, y puede ser un decimal aunque los datos sean enteros. El valor que más se repite es la moda.');
N('A','F','Gráficas de líneas',`<p>La gráfica muestra el número de estudiantes matriculados en un colegio entre 2019 y 2023.</p>${LG([{pts:[[2019,400],[2020,420],[2021,380],[2022,450],[2023,480]]}],{xmin:2019,xmax:2023,ymin:350,ymax:500,ystep:25,xl:'Año',yl:'Estudiantes'})}<p>¿En qué porcentaje aproximado aumentó la matrícula de 2021 a 2023?</p>`,
['26,3 %','20,8 %','100 %','10 %'],'Aumento: 480 − 380 = 100. Respecto a 2021: 100/380 ≈ 26,3 %. (20,8 % resulta de dividir entre 480).');
N('A','I','Pictogramas','<p>En un pictograma, cada ícono de una persona representa 50 habitantes. Si una vereda aparece con 7 íconos y medio, ¿cuántos habitantes tiene?</p>',
['375','350','75','400'],'7,5 × 50 = 375 habitantes.');
N('A','I','Elección de gráficos','<p>Se quiere mostrar qué parte del presupuesto mensual de una familia se dedica a vivienda, alimentación, transporte y otros gastos. ¿Qué tipo de gráfico es el más adecuado?</p>',
['Un diagrama circular, porque muestra cómo se reparte un total en partes.','Una gráfica de líneas, porque muestra cambios en el tiempo.','Un diagrama de dispersión, porque relaciona dos variables numéricas.','Un histograma, porque agrupa datos continuos en intervalos.'],'El diagrama circular representa la proporción de cada categoría respecto al total (100 %).');
N('A','I','Elección de gráficos','<p>Se quiere mostrar cómo ha variado el precio del dólar día a día durante un mes. ¿Qué tipo de gráfico es el más adecuado?</p>',
['Una gráfica de líneas','Un diagrama circular','Un pictograma','Un diagrama de tallo y hojas'],'La gráfica de líneas permite ver tendencias y cambios de una variable a lo largo del tiempo.');
N('A','A','Medidas de tendencia central','<p>El dueño de una zapatería quiere saber qué talla de zapato debe pedir en mayor cantidad. ¿Qué medida estadística le resulta más útil?</p>',
['La moda, porque indica la talla que más se vende.','La media, porque es el promedio de las tallas.','El rango, porque indica la talla más grande.','La mediana, porque divide las ventas en dos partes iguales.'],'Le interesa la talla más frecuente. Una talla promedio como 38,6 no existe.');
N('A','F','Media de grupos combinados','<p>Un grupo A de 20 estudiantes tiene promedio 3,5 y un grupo B de 30 estudiantes tiene promedio 4,0. ¿Cuál es el promedio de los 50 estudiantes juntos?</p>',
['3,8','3,75','4,0','3,6'],'Suma total: 20 × 3,5 + 30 × 4,0 = 70 + 120 = 190. Promedio: 190 ÷ 50 = 3,8.');
N('A','A','Media de grupos combinados','<p>Un grupo de 20 estudiantes tiene promedio 3,5 y otro de 30 estudiantes tiene promedio 4,0. Pablo calcula el promedio de todos así: (3,5 + 4,0)/2 = 3,75. ¿Es correcto?</p>',
['No, porque los grupos tienen distinto número de estudiantes; se debe ponderar y el promedio correcto es 3,8.','Sí, porque el promedio de dos promedios es el promedio total.','No, porque el promedio correcto es 7,5.','Sí, porque ambos grupos pertenecen al mismo curso.'],'El grupo más grande pesa más en el promedio total. Solo si ambos grupos tuvieran el mismo tamaño se podría promediar así.');
N('A','I','Percentiles','<p>En los resultados de una prueba, Daniela quedó en el percentil 80. ¿Qué significa esto?</p>',
['Que aproximadamente el 80 % de los evaluados obtuvo un puntaje igual o menor que el de ella.','Que respondió correctamente el 80 % de las preguntas.','Que obtuvo 80 puntos.','Que el 80 % de los evaluados obtuvo un puntaje mayor que el de ella.'],'El percentil indica la posición relativa respecto a los demás evaluados, no el porcentaje de aciertos.');
N('A','F','Frecuencia acumulada',`<p>La tabla muestra las edades de los estudiantes de un curso.</p>${tbl([['Edad (años)','15','16','17','18'],['Estudiantes','4','10','12','4']])}<p>¿Cuántos estudiantes tienen 16 años o menos?</p>`,
['14','10','26','4'],'Frecuencia acumulada hasta 16 años: 4 + 10 = 14.');
N('A','F','Diagramas de barras',`<p>El diagrama muestra el medio de transporte que usan 200 estudiantes para llegar al colegio.</p>${BG(['Bus','Bicicleta','A pie','Carro'],[80,40,50,30],{ymax:100,ystep:20,yl:'Estudiantes'})}<p>¿Qué porcentaje de los estudiantes llega en bicicleta o a pie?</p>`,
['45 %','90 %','20 %','25 %'],'(40 + 50)/200 = 90/200 = 45 %.');
N('A','A','Interpretación de gráficos',`<p>El diagrama muestra el medio de transporte que usan 200 estudiantes para llegar al colegio.</p>${BG(['Bus','Bicicleta','A pie','Carro'],[80,40,50,30],{ymax:100,ystep:20,yl:'Estudiantes'})}<p>Un estudiante afirma que la mitad de los estudiantes llega en bus porque es la barra más alta. ¿Es correcta su afirmación?</p>`,
['No, porque 80 de 200 es el 40 %, que es menos de la mitad.','Sí, porque el bus es el medio más usado.','Sí, porque 80 es mayor que la suma de bicicleta y carro.','No, porque la mayoría llega a pie.'],'Ser la categoría más frecuente (la moda) no implica representar más de la mitad. Para eso el bus tendría que tener más de 100 estudiantes.');
N('A','A','Datos atípicos','<p>Los tiempos, en minutos, que tardaron 6 estudiantes en resolver un ejercicio fueron 12, 14, 15, 15, 16 y 60. ¿Qué medida describe mejor el tiempo típico?</p>',
['La mediana (15 min), porque no se ve afectada por el dato atípico de 60 min.','La media (22 min), porque utiliza todos los datos.','El rango (48 min), porque muestra la variación.','El dato máximo (60 min).'],'El 60 eleva la media a 132/6 = 22 min, que es mayor que 5 de los 6 tiempos. La mediana, (15 + 15)/2 = 15, sí es representativa.');
N('A','F','Media aritmética','<p>Un estudiante tiene un promedio de 3,2 en cuatro evaluaciones. ¿Qué nota debe obtener en una quinta evaluación para que su promedio suba a 3,4?</p>',
['4,2','3,6','3,4','5,0'],'Suma actual: 4 × 3,2 = 12,8. Suma necesaria: 5 × 3,4 = 17. Nota requerida: 17 − 12,8 = 4,2.');
N('A','I','Media y mediana','<p>¿En cuál de los siguientes conjuntos de datos la media es igual a la mediana?</p>',
['2, 4, 6, 8, 10','1, 2, 3, 10, 20','5, 5, 6, 9, 15','1, 1, 1, 2, 10'],'En 2, 4, 6, 8, 10 la mediana es 6 y la media es 30/5 = 6. Los datos son simétricos alrededor de 6.');
N('A','F','Tablas de frecuencia','<p>En una tabla de frecuencias con 40 datos en total, tres categorías tienen frecuencias 8, 12 y 6. ¿Cuál es la frecuencia de la cuarta categoría?</p>',
['14','26','10','12'],'Las frecuencias suman el total: 40 − (8 + 12 + 6) = 14.');
N('A','F','Frecuencia relativa','<p>En una encuesta a 40 estudiantes, 14 eligieron la opción “matemáticas” como su materia favorita. ¿Cuál es la frecuencia relativa de esta opción?</p>',
['35 %','14 %','26 %','0,14'],'14 ÷ 40 = 0,35 = 35 %.');
N('A','F','Diagramas circulares','<p>En un diagrama circular se representan las respuestas de 120 personas. Si 30 personas eligieron la opción A, ¿cuántos grados mide el sector de esa opción?</p>',
['90°','30°','25°','120°'],'30/120 = 1/4 del total, y 1/4 × 360° = 90°.');
N('A','A','Correlación y causalidad','<p>Un estudio muestra que en los meses en que aumentan las ventas de helado también aumentan los casos de insolación. Alguien concluye que comer helado produce insolación. ¿Es válida esta conclusión?</p>',
['No, porque que dos variables aumenten juntas no prueba que una cause la otra; ambas pueden depender de un tercer factor, como el calor.','Sí, porque los datos muestran que las dos variables aumentan al mismo tiempo.','Sí, porque el estudio se hizo con datos reales.','No, porque las ventas de helado disminuyen en verano.'],'La correlación no implica causalidad. Aquí la temperatura alta explica ambos fenómenos.');
N('A','I','Relación entre variables',`<p>La tabla muestra las horas de estudio de cinco estudiantes y su nota en un examen.</p>${tbl([['Horas de estudio','1','2','3','4','5'],['Nota','2,5','3,0','3,6','4,1','4,6']])}<p>¿Qué tipo de relación se observa entre las variables?</p>`,
['Una relación positiva: a más horas de estudio, mayor nota.','Una relación negativa: a más horas de estudio, menor nota.','No hay relación entre las variables.','Una relación en la que la nota es constante.'],'Cuando una variable aumenta, la otra también aumenta: la relación es positiva (directa).');
N('A','I','Moda','<p>¿Cuál es la moda del conjunto de datos 2, 3, 3, 5, 7, 7, 8?</p>',
['3 y 7 (es bimodal)','5','3','No tiene moda'],'Tanto el 3 como el 7 aparecen dos veces, más que cualquier otro dato: el conjunto es bimodal.');
N('A','F','Varianza','<p>¿Cuál es la varianza poblacional de los datos 2, 4 y 6?</p>',
[`${F(8,3)} ≈ 2,67`,'4','8','2'],'Media: 4. Desviaciones al cuadrado: 4, 0 y 4. Varianza: 8/3 ≈ 2,67.');
N('A','A','Inferencia estadística','<p>En una encuesta a 1.000 personas elegidas al azar en un país, el 60 % dijo estar de acuerdo con una propuesta. Un periodista afirma que exactamente el 60 % de toda la población está de acuerdo. ¿Es correcta su afirmación?</p>',
['No, porque el resultado de una muestra es una estimación; el porcentaje real de la población puede ser cercano a 60 %, pero no necesariamente exacto.','Sí, porque la muestra se eligió al azar.','Sí, porque 1.000 personas son suficientes para conocer el valor exacto.','No, porque una muestra nunca da información sobre la población.'],'Una muestra aleatoria permite estimar el valor de la población con cierto margen de error, no conocerlo exactamente. La opción D exagera en sentido contrario.');

N('A','F','Probabilidad clásica','<p>Se lanza un dado de seis caras. ¿Cuál es la probabilidad de obtener un número mayor que 4?</p>',
[F(1,3),F(1,2),F(2,3),F(1,6)],'Casos favorables: 5 y 6 (2 de 6). P = 2/6 = 1/3.');
N('A','F','Probabilidad clásica','<p>Se lanzan dos monedas al aire. ¿Cuál es la probabilidad de obtener dos caras?</p>',
[F(1,4),F(1,2),F(1,3),F(2,3)],'Espacio muestral: CC, CS, SC, SS (4 resultados igualmente probables). Solo uno es favorable.');
N('A','F','Probabilidad con dos dados','<p>Se lanzan dos dados. ¿Cuál es la probabilidad de que la suma de los resultados sea 7?</p>',
[F(1,6),F(7,36),F(1,12),F(1,11)],'Hay 36 resultados. Suman 7: (1,6), (2,5), (3,4), (4,3), (5,2), (6,1). P = 6/36 = 1/6.');
N('A','A','Probabilidad con dos dados','<p>Al lanzar dos dados, Tomás apuesta a que la suma será 7 y Sara a que será 12. Sara dice que tienen la misma probabilidad de ganar porque cada uno eligió un solo número. ¿Tiene razón?</p>',
['No, porque la suma 7 se obtiene de 6 maneras y la suma 12 de una sola, así que Tomás tiene 6 veces más probabilidad.','Sí, porque todas las sumas posibles son igualmente probables.','No, porque la suma 12 es más probable al ser un número mayor.','Sí, porque cada uno tiene probabilidad 1/11.'],'Las sumas no son equiprobables: P(7) = 6/36 y P(12) = 1/36 (solo con (6, 6)).');
N('A','F','Probabilidad clásica','<p>En una bolsa hay 4 balotas rojas y 6 azules. Si se saca una balota al azar, ¿cuál es la probabilidad de que sea roja?</p>',
[F(2,5),F(2,3),F(3,5),F(1,4)],'P = 4/10 = 2/5. (2/3 sería la razón entre rojas y azules).');
N('A','F','Extracciones sin reemplazo','<p>En una bolsa hay 4 balotas rojas y 6 azules. Se sacan dos balotas, una tras otra, sin devolver la primera. ¿Cuál es la probabilidad de que ambas sean rojas?</p>',
[F(2,15),F(4,25),F(4,10),F(1,5)],'P = 4/10 × 3/9 = 12/90 = 2/15. Al no devolver la balota, en la segunda extracción quedan 3 rojas de 9.');
N('A','F','Extracciones con reemplazo','<p>En una bolsa hay 4 balotas rojas y 6 azules. Se saca una balota, se devuelve y se saca otra. ¿Cuál es la probabilidad de que ambas sean rojas?</p>',
[F(4,25),F(2,15),F(4,5),F(8,10)],'Las extracciones son independientes: (4/10) × (4/10) = 16/100 = 4/25.');
N('A','F','Evento complementario','<p>Según el pronóstico, la probabilidad de lluvia para mañana es 0,35. ¿Cuál es la probabilidad de que no llueva?</p>',
['0,65','0,35','1,35','0,5'],'P(no A) = 1 − P(A) = 1 − 0,35 = 0,65.');
N('A','F','Principio multiplicativo','<p>Un restaurante ofrece un menú con 3 entradas, 4 platos fuertes y 2 postres. Si un almuerzo incluye una entrada, un plato fuerte y un postre, ¿cuántos almuerzos diferentes se pueden armar?</p>',
['24','9','12','36'],'Por el principio multiplicativo: 3 × 4 × 2 = 24.');
N('A','F','Principio multiplicativo','<p>Las placas de los carros en Colombia tienen 3 letras seguidas de 3 dígitos. Si se pueden usar 26 letras y 10 dígitos, con repetición, ¿cuántas placas diferentes se pueden formar?</p>',
['26³ × 10³ = 17.576.000','26 × 3 + 10 × 3 = 108','(26 + 10)⁶','26 × 25 × 24 × 10 × 9 × 8'],'Cada posición es independiente: 26 × 26 × 26 × 10 × 10 × 10. La última opción no permite repetir.');
N('A','F','Permutaciones','<p>¿De cuántas formas diferentes se pueden ubicar 5 personas en una fila para una foto?</p>',
['120','25','5','60'],'5! = 5 × 4 × 3 × 2 × 1 = 120.');
N('A','F','Combinaciones','<p>De un grupo de 8 estudiantes se quiere elegir un comité de 3 personas, sin cargos. ¿Cuántos comités diferentes se pueden formar?</p>',
['56','336','24','512'],'Como no importa el orden: C(8, 3) = 8!/(3! · 5!) = 336/6 = 56.');
N('A','A','Permutaciones y combinaciones','<p>Para elegir presidente, vicepresidente y tesorero entre 8 candidatos, Ana calculó C(8, 3) = 56 posibilidades. ¿Es correcto su razonamiento?</p>',
['No, porque los cargos son distintos y el orden importa; hay 8 × 7 × 6 = 336 posibilidades.','Sí, porque se eligen 3 personas de 8.','No, porque hay 8³ = 512 posibilidades.','Sí, porque una persona no puede ocupar dos cargos.'],'Elegir a A como presidente y a B como vicepresidente es distinto de lo contrario. Con cargos el orden importa (permutaciones); en un comité sin cargos no (combinaciones).');
N('A','F','Permutaciones con repetición','<p>¿Cuántas palabras diferentes (con o sin sentido) se pueden formar con todas las letras de la palabra CASA?</p>',
['12','24','6','4'],'Hay 4 letras con la A repetida 2 veces: 4!/2! = 24/2 = 12.');
N('A','I','Diagramas de árbol','<p>Se lanza una moneda tres veces seguidas y se anota el resultado de cada lanzamiento. ¿Cuántos resultados posibles hay?</p>',
['8','6','3','9'],'Cada lanzamiento tiene 2 resultados: 2 × 2 × 2 = 8 (CCC, CCS, CSC, …).');
N('A','F','Evento complementario','<p>Se lanza una moneda tres veces. ¿Cuál es la probabilidad de obtener al menos una cara?</p>',
[F(7,8),F(3,8),F(1,2),F(1,8)],'Por el complemento: P(ninguna cara) = (1/2)³ = 1/8, entonces P(al menos una) = 1 − 1/8 = 7/8.');
N('A','F','Eventos independientes','<p>Los eventos A y B son independientes, con P(A) = 0,5 y P(B) = 0,4. ¿Cuál es la probabilidad de que ocurran ambos?</p>',
['0,2','0,9','0,1','0,45'],'Para eventos independientes: P(A y B) = P(A) × P(B) = 0,5 × 0,4 = 0,2.');
N('A','F','Probabilidad de la unión','<p>Si P(A) = 0,5, P(B) = 0,4 y P(A y B) = 0,2, ¿cuál es la probabilidad de que ocurra A o B?</p>',
['0,7','0,9','0,2','1,1'],'P(A o B) = P(A) + P(B) − P(A y B) = 0,5 + 0,4 − 0,2 = 0,7. Se resta la intersección para no contarla dos veces.');
N('A','F','Eventos mutuamente excluyentes','<p>Se lanza un dado. ¿Cuál es la probabilidad de obtener un número par o un 5?</p>',
[F(2,3),F(1,2),F(1,6),F(5,6)],'Los eventos no tienen resultados en común: 3/6 + 1/6 = 4/6 = 2/3.');
N('A','A','Probabilidad de la unión','<p>Al lanzar un dado, Martín calcula la probabilidad de obtener “un número par o un número mayor que 3” así: 3/6 + 3/6 = 1. ¿Es correcto su cálculo?</p>',
['No, porque el 4 y el 6 cumplen ambas condiciones y los contó dos veces; la probabilidad es 4/6 = 2/3.','Sí, porque ambos eventos tienen probabilidad 1/2.','No, porque la probabilidad es 1/4.','Sí, porque todos los resultados son pares o mayores que 3.'],'Los eventos no son excluyentes. La unión es {2, 4, 5, 6} y P = 4/6. El 1 y el 3 no cumplen ninguna de las dos condiciones.');
N('A','F','Probabilidad condicional',`<p>La tabla muestra cuántos estudiantes de un curso practican algún deporte.</p>${tbl([['','Practica deporte','No practica','Total'],['Hombres','25','15','40'],['Mujeres','30','30','60'],['Total','55','45','100']])}<p>Si se elige al azar una mujer del curso, ¿cuál es la probabilidad de que practique deporte?</p>`,
[F(1,2),F(3,10),F(6,11),F(11,20)],'Se restringe a las 60 mujeres: 30/60 = 1/2. (3/10 sería la probabilidad de ser mujer y deportista entre los 100).');
N('A','F','Probabilidad condicional',`<p>La tabla muestra cuántos estudiantes de un curso practican algún deporte.</p>${tbl([['','Practica deporte','No practica','Total'],['Hombres','25','15','40'],['Mujeres','30','30','60'],['Total','55','45','100']])}<p>Si se elige al azar un estudiante que practica deporte, ¿cuál es la probabilidad de que sea mujer?</p>`,
[F(6,11),F(1,2),F(3,10),F(3,5)],'Se restringe a los 55 deportistas: 30/55 = 6/11.');
N('A','A','Frecuencia relativa','<p>Julieta lanzó una moneda 10 veces y obtuvo 7 caras. Concluye que la moneda está trucada porque la probabilidad de obtener cara es 0,7. ¿Es válida su conclusión?</p>',
['No, porque con pocos lanzamientos la frecuencia relativa puede alejarse de 0,5; se necesitan muchos más lanzamientos para sacar una conclusión.','Sí, porque 7 de 10 es 0,7.','Sí, porque una moneda normal siempre da 5 caras en 10 lanzamientos.','No, porque la probabilidad de cara es siempre 0,7.'],'Por la ley de los grandes números, la frecuencia relativa se acerca a la probabilidad real con muchas repeticiones. 7 caras en 10 lanzamientos es un resultado posible con una moneda justa.');
N('A','A','Independencia','<p>Una moneda justa ha caído cara 5 veces seguidas. Un jugador afirma que en el siguiente lanzamiento es más probable que salga sello. ¿Es correcta su afirmación?</p>',
['No, porque cada lanzamiento es independiente de los anteriores y la probabilidad de sello sigue siendo 1/2.','Sí, porque los resultados deben equilibrarse.','Sí, porque la probabilidad de sello ahora es 5/6.','No, porque ahora es más probable que salga cara.'],'Es la “falacia del jugador”: la moneda no tiene memoria.');
N('A','F','Probabilidad geométrica','<p>Un dardo cae al azar dentro de un tablero cuadrado de 10 cm de lado, en el que hay dibujado un círculo de 5 cm de radio que toca los cuatro lados. ¿Cuál es la probabilidad de que el dardo caiga dentro del círculo? (Usa π ≈ 3,14).</p>',
['0,785','0,5','0,314','0,25'],'P = área del círculo / área del cuadrado = 78,5/100 = 0,785.');
N('A','F','Probabilidad clásica','<p>En una rifa se venden 200 boletas y Andrés compra 5. ¿Cuál es la probabilidad de que Andrés gane?</p>',
['2,5 %','5 %','0,5 %','25 %'],'5/200 = 1/40 = 0,025 = 2,5 %.');
N('A','F','Valor esperado','<p>En un juego se paga $ 3.000 por participar. Se gana un premio de $ 10.000 con probabilidad 1/5 y en otro caso no se gana nada. ¿Cuál es la ganancia esperada por cada juego?</p>',
['−$ 1.000','$ 2.000','$ 7.000','$ 0'],'Premio esperado: 10.000 × 1/5 = 2.000. Ganancia esperada: 2.000 − 3.000 = −1.000. En promedio se pierden $ 1.000 por juego.');
N('A','A','Juegos justos','<p>En un juego con dos dados, Ana gana si la suma es par y Beto gana si la suma es impar. ¿Es justo el juego?</p>',
['Sí, porque de los 36 resultados, 18 dan suma par y 18 dan suma impar.','No, porque hay más sumas pares (2, 4, 6, 8, 10, 12) que impares.','No, porque la suma 7, que es impar, es la más probable.','Sí, porque cada jugador eligió una opción distinta.'],'Hay que contar los resultados del espacio muestral, no los valores de la suma: P(par) = P(impar) = 1/2.');
N('A','A','Juegos justos','<p>En un juego con dos dados, Ana gana si el producto de los resultados es par y Beto gana si es impar. ¿Es justo el juego?</p>',
['No, porque el producto es impar solo si ambos dados son impares (9 de 36 casos), así que Ana gana con probabilidad 3/4.','Sí, porque cada jugador tiene probabilidad 1/2.','No, porque Beto gana con probabilidad 3/4.','Sí, porque hay igual cantidad de números pares e impares en un dado.'],'P(impar) = (3/6) × (3/6) = 1/4, entonces P(par) = 3/4.');
N('A','F','Conteo de caminos','<p>En una cuadrícula de 2 × 2 cuadras, una persona va de la esquina inferior izquierda a la esquina superior derecha, moviéndose solo hacia la derecha o hacia arriba. ¿Cuántos caminos diferentes puede tomar?</p>',
['6','4','8','2'],'Debe hacer 2 movimientos a la derecha y 2 hacia arriba en algún orden: C(4, 2) = 6.');
N('A','F','Probabilidad desde frecuencias',`<p>La tabla muestra el tipo de sangre de 100 donantes.</p>${tbl([['Tipo','O','A','B','AB'],['Donantes','45','35','15','5']])}<p>Si se elige un donante al azar, ¿cuál es la probabilidad de que su sangre <b>no</b> sea tipo O?</p>`,
['0,55','0,45','0,35','0,65'],'P(no O) = 1 − 45/100 = 0,55, que es igual a (35 + 15 + 5)/100.');
N('A','F','Variaciones','<p>¿Cuántas claves de 4 dígitos se pueden formar si no se puede repetir ningún dígito?</p>',
['5.040','10.000','210','40'],'10 × 9 × 8 × 7 = 5.040.');
N('A','F','Combinaciones','<p>En una reunión hay 10 personas y cada una saluda de mano a todas las demás una sola vez. ¿Cuántos saludos hay en total?</p>',
['45','90','100','20'],'Cada saludo es una pareja sin orden: C(10, 2) = 10 × 9/2 = 45. Con 90 se cuenta cada saludo dos veces.');
N('A','F','Combinaciones','<p>En un torneo de 6 equipos, cada equipo juega una vez contra cada uno de los demás. ¿Cuántos partidos se juegan?</p>',
['15','30','36','12'],'C(6, 2) = 6 × 5/2 = 15 partidos.');
N('A','F','Probabilidad con combinaciones','<p>En un juego se eligen al azar 2 números distintos del 1 al 10, sin importar el orden. Si Lucía apostó por la pareja {3, 7}, ¿cuál es la probabilidad de que gane?</p>',
[F(1,45),F(1,90),F(1,20),F(1,100)],'Hay C(10, 2) = 45 parejas posibles y solo una es favorable.');
N('A','F','Distribución binomial','<p>Se lanza una moneda tres veces. ¿Cuál es la probabilidad de obtener exactamente dos caras?</p>',
[F(3,8),F(1,4),F(2,3),F(1,8)],'Resultados favorables: CCS, CSC, SCC (3 de 8).');
N('A','I','Espacio muestral','<p>¿Cuántos elementos tiene el espacio muestral del experimento de lanzar dos dados y anotar el resultado de cada uno?</p>',
['36','12','11','21'],'Cada dado tiene 6 resultados: 6 × 6 = 36 parejas ordenadas. (11 es la cantidad de sumas distintas).');
N('A','F','Probabilidad frecuencial','<p>En un control de calidad, de 500 bombillos revisados, 15 resultaron defectuosos. Si se fabrica un lote de 2.000 bombillos, ¿cuántos defectuosos se esperan aproximadamente?</p>',
['60','15','30','150'],'La frecuencia de defectuosos es 15/500 = 0,03, y 0,03 × 2.000 = 60.');
N('A','I','Eventos seguros','<p>Al lanzar un dado de seis caras, ¿cuál de los siguientes eventos tiene probabilidad 1?</p>',
['Obtener un número menor que 7.','Obtener un número par.','Obtener un 6.','Obtener un número mayor que 6.'],'Todos los resultados (1 a 6) son menores que 7: es un evento seguro. Obtener un número mayor que 6 es imposible.');
N('A','I','Eventos imposibles','<p>Al lanzar dos dados, ¿cuál de los siguientes eventos es imposible?</p>',
['Que la suma sea 13.','Que la suma sea 2.','Que los dos resultados sean iguales.','Que la suma sea 12.'],'La suma máxima es 6 + 6 = 12, así que obtener 13 tiene probabilidad 0.');
N('A','A','Con y sin reemplazo','<p>En una caja hay 3 fichas verdes y 2 blancas. Se saca una ficha verde y no se devuelve. Mario dice que la probabilidad de que la siguiente ficha sea verde sigue siendo 3/5. ¿Tiene razón?</p>',
['No, porque ahora quedan 2 verdes de 4 fichas, así que la probabilidad es 1/2.','Sí, porque la proporción de fichas no cambia.','No, porque ahora la probabilidad es 2/5.','Sí, porque las extracciones son independientes.'],'Sin reemplazo, la primera extracción modifica la composición de la caja: las extracciones son dependientes.');
N('A','F','Conteo con restricciones','<p>Con los dígitos 1, 2, 3, 4 y 5, sin repetir, ¿cuántos números pares de tres cifras se pueden formar?</p>',
['24','60','12','30'],'La última cifra debe ser 2 o 4 (2 opciones). Para las otras dos quedan 4 y 3 opciones: 2 × 4 × 3 = 24.');
N('A','F','Probabilidad y conteo','<p>Con los dígitos 1, 2, 3, 4 y 5 se forma al azar un número de tres cifras diferentes. ¿Cuál es la probabilidad de que el número sea par?</p>',
[F(2,5),F(1,2),F(3,5),F(1,5)],'Total: 5 × 4 × 3 = 60. Pares: 24. P = 24/60 = 2/5. También se ve así: la última cifra es par en 2 de 5 casos.');
N('A','F','Combinaciones','<p>De un grupo de 6 hombres y 4 mujeres se quiere formar un comité de 2 hombres y 1 mujer. ¿Cuántos comités diferentes se pueden formar?</p>',
['60','120','19','24'],'C(6, 2) × C(4, 1) = 15 × 4 = 60.');
N('A','F','Probabilidad con naipes','<p>De una baraja de 52 cartas (4 palos de 13 cartas cada uno) se saca una carta al azar. ¿Cuál es la probabilidad de que sea un as?</p>',
[F(1,13),F(1,52),F(1,4),F(4,13)],'Hay 4 ases entre 52 cartas: 4/52 = 1/13.');
N('A','F','Probabilidad de la unión','<p>De una baraja de 52 cartas (26 rojas y 26 negras) se saca una carta al azar. ¿Cuál es la probabilidad de que sea roja o una figura (J, Q o K)? En la baraja hay 12 figuras, 6 de ellas rojas.</p>',
[F(8,13),F(19,26),F(1,2),F(3,13)],'P = 26/52 + 12/52 − 6/52 = 32/52 = 8/13. Las figuras rojas se restan para no contarlas dos veces.');
N('A','F','Probabilidad geométrica','<p>Una ruleta está dividida en 8 sectores iguales, de los cuales 3 son azules. ¿Cuál es la probabilidad de que la ruleta no se detenga en un sector azul?</p>',
[F(5,8),F(3,8),F(3,5),F(1,8)],'Sectores no azules: 5 de 8.');
N('A','F','Eventos independientes','<p>La probabilidad de que un bus llegue tarde es 0,2 y la probabilidad de que llueva es 0,3, y los eventos son independientes. ¿Cuál es la probabilidad de que el bus no llegue tarde y no llueva?</p>',
['0,56','0,5','0,06','0,44'],'P(no tarde) = 0,8 y P(no lluvia) = 0,7. Por independencia: 0,8 × 0,7 = 0,56.');
N('A','F','Valor esperado','<p>Un estudiante responde al azar las 10 preguntas de un examen. Cada pregunta tiene 4 opciones y solo una es correcta. ¿Cuántas respuestas correctas se espera que obtenga?</p>',
['2,5','4','1','5'],'Valor esperado: 10 × 1/4 = 2,5 preguntas.');
N('A','I','Frecuencia esperada','<p>Si se lanza un dado justo 600 veces, ¿aproximadamente cuántas veces se espera obtener un 3?</p>',
['100','300','200','50'],'P(3) = 1/6, entonces se espera 600 × 1/6 = 100 veces. Esto es aproximado, no exacto.');
// ---------- Argumentación: validar afirmaciones y procedimientos en todos los pensamientos ----------
N('N','A','Validación de afirmaciones','<p>Un estudiante afirma: “El cuadrado de un número siempre es mayor que el número”. ¿Es verdadera esta afirmación?</p>',
['No, porque, por ejemplo, 0,5² = 0,25, que es menor que 0,5.','Sí, porque elevar al cuadrado siempre aumenta el valor.','Sí, porque el cuadrado de cualquier número es positivo.','No, porque el cuadrado de un número negativo es negativo.'],'Para números entre 0 y 1, el cuadrado es menor; para 0 y 1 es igual. El cuadrado de un negativo es positivo, por eso D es falsa.');
N('N','A','Propiedades de la radicación','<p>Para calcular √(9 + 16), Sebastián escribe √9 + √16 = 3 + 4 = 7. ¿Es correcto su procedimiento?</p>',
['No, porque la raíz de una suma no es la suma de las raíces; √(9 + 16) = √25 = 5.','Sí, porque la raíz se distribuye sobre la suma.','No, porque el resultado correcto es 25.','Sí, porque 3 + 4 = 7.'],'La raíz se distribuye sobre productos (√(ab) = √a · √b), pero no sobre sumas.');
N('V','A','Productos notables','<p>Daniela afirma que (<i>a</i> + <i>b</i>)<sup>2</sup> = <i>a</i><sup>2</sup> + <i>b</i><sup>2</sup>. ¿Es correcta su afirmación?</p>',
['No, porque (a + b)² = a² + 2ab + b²; por ejemplo, (3 + 4)² = 49, mientras que 3² + 4² = 25.','Sí, porque la potencia se distribuye sobre la suma.','Sí, pero solo cuando a y b son positivos.','No, porque (a + b)² = 2a + 2b.'],'Al desarrollar (a + b)(a + b) aparecen los productos cruzados ab + ba = 2ab.');
N('N','A','Orden en los reales',`<p>Un estudiante afirma: “Si <i>a</i> &gt; <i>b</i>, entonces ${F(1,'<i>a</i>')} &lt; ${F(1,'<i>b</i>')}”. ¿Es verdadera la afirmación para cualquier par de números reales distintos de cero?</p>`,
['No siempre; por ejemplo, con a = 2 y b = −1, 1/a = 0,5 es mayor que 1/b = −1.','Sí, porque al invertir números siempre se invierte la desigualdad.','No, porque 1/a siempre es mayor que 1/b.','Sí, porque el recíproco de un número mayor es siempre menor.'],'La afirmación es cierta solo si a y b tienen el mismo signo. Un contraejemplo basta para mostrar que no es válida en general.');
N('V','A','Inecuaciones','<p>Pedro resolvió −2<i>x</i> &gt; 6 dividiendo entre −2 y obtuvo <i>x</i> &gt; −3. ¿Es correcta su solución?</p>',
['No, porque al dividir entre un número negativo se invierte la desigualdad: x < −3.','Sí, porque dividió ambos lados entre el mismo número.','No, porque la solución es x > 3.','Sí, porque −6/2 = −3.'],'Por ejemplo, x = 0 cumple x > −3, pero −2(0) = 0 no es mayor que 6. Al multiplicar o dividir por un negativo, el sentido de la desigualdad cambia.');
N('A','A','Interpretación de la probabilidad',`<p>Un estudiante afirma: “Si la probabilidad de un evento es ${F(1,2)}, entonces al repetir el experimento dos veces el evento ocurre exactamente una vez”. ¿Es correcta su afirmación?</p>`,
['No, porque la probabilidad describe lo que ocurre a largo plazo; en dos intentos el evento puede ocurrir 0, 1 o 2 veces.','Sí, porque la mitad de 2 es 1.','Sí, porque los resultados deben equilibrarse.','No, porque el evento ocurrirá dos veces.'],'Con una moneda, en dos lanzamientos P(exactamente una cara) = 1/2, no 1. La probabilidad no garantiza resultados en pocos intentos.');
N('M','A','Perímetro y área','<p>Un estudiante afirma que si una figura tiene mayor perímetro que otra, entonces también tiene mayor área. ¿Es verdadera su afirmación?</p>',
['No; por ejemplo, un rectángulo de 1 × 10 tiene perímetro 22 y área 10, y un cuadrado de 5 × 5 tiene perímetro 20 y área 25.','Sí, porque el área depende del perímetro.','Sí, porque una figura más grande tiene más área.','No, porque una figura con mayor perímetro siempre tiene menor área.'],'El perímetro y el área no están ligados de esa forma. Con un solo contraejemplo se refuta la afirmación.');
N('E','A','Clasificación de cuadriláteros','<p>Juan afirma: “Si un cuadrilátero tiene sus cuatro lados iguales, entonces es un cuadrado”. ¿Es verdadera la afirmación?</p>',
['No, porque un rombo tiene cuatro lados iguales y no necesariamente tiene ángulos rectos.','Sí, porque el cuadrado es el único cuadrilátero con cuatro lados iguales.','Sí, porque un cuadrilátero con lados iguales tiene ángulos iguales.','No, porque un rectángulo también tiene cuatro lados iguales.'],'Para que sea un cuadrado, además de lados iguales necesita ángulos rectos. Todo cuadrado es un rombo, pero no todo rombo es un cuadrado.');
N('E','A','Clasificación de cuadriláteros','<p>¿Es verdadera la afirmación “todo cuadrado es un rectángulo”?</p>',
['Sí, porque un cuadrado tiene cuatro ángulos rectos, que es la condición que define a un rectángulo.','No, porque el rectángulo tiene dos lados más largos que los otros dos.','No, porque el cuadrado es un rombo.','Sí, pero solo si sus lados miden más de 1 cm.'],'Un rectángulo es un cuadrilátero con cuatro ángulos rectos. El cuadrado lo cumple, y además tiene los lados iguales.');
N('V','A','Monotonía','<p>¿Por qué la función <i>f</i>(<i>x</i>) = −3<i>x</i> + 7 es decreciente?</p>',
['Porque su pendiente es negativa: cada vez que x aumenta 1, f(x) disminuye 3.','Porque su intercepto con el eje y es positivo.','Porque toma valores negativos para todo x.','Porque su gráfica pasa por el origen.'],'En una función lineal, el signo de la pendiente determina si crece (m > 0) o decrece (m < 0).');
N('N','A','Paridad','<p>¿Cuál de los siguientes argumentos demuestra que la suma de dos números impares siempre es par?</p>',
['Si los impares son 2m + 1 y 2n + 1, su suma es 2m + 2n + 2 = 2(m + n + 1), que es múltiplo de 2.','Porque 3 + 5 = 8 y 7 + 9 = 16 son pares.','Porque los números impares terminan en 1, 3, 5, 7 o 9.','Porque la suma de dos números iguales es par.'],'Unos ejemplos no demuestran una propiedad general. La demostración usa la forma general de un impar, 2k + 1.');
N('N','A','Divisibilidad','<p>Carla afirma que el producto de tres números enteros consecutivos siempre es divisible entre 6. ¿Cuál es la mejor justificación?</p>',
['Entre tres consecutivos siempre hay al menos un número par y exactamente un múltiplo de 3, así que el producto es divisible entre 2 y entre 3.','Porque 1 × 2 × 3 = 6.','Porque los tres números suman un múltiplo de 3.','Porque cualquier producto de tres números es divisible entre 6.'],'Ser divisible entre 2 y entre 3 implica ser divisible entre 6. Un solo ejemplo, como 1 × 2 × 3, no demuestra el caso general.');
N('V','A','Demostraciones algebraicas','<p>Un estudiante observa que 4² − 3² = 7 = 4 + 3 y que 6² − 5² = 11 = 6 + 5, y concluye que la diferencia de los cuadrados de dos enteros consecutivos es igual a su suma. ¿Cuál argumento lo demuestra?</p>',
['(n + 1)² − n² = n² + 2n + 1 − n² = 2n + 1 = n + (n + 1).','Porque se cumple para los ejemplos 4 y 3, y 6 y 5.','Porque la diferencia de cuadrados siempre es 1.','Porque (n + 1)² − n² = 1² = 1.'],'La demostración algebraica vale para cualquier entero n. Los ejemplos solo sugieren la conjetura.');
N('A','A','Tamaño de la muestra','<p>Un anuncio dice: “El 70 % de los consumidores prefiere el producto X”. Al leer la letra pequeña, se descubre que se encuestó solo a 10 personas. ¿Qué se puede afirmar del anuncio?</p>',
['La conclusión es poco confiable, porque una muestra de 10 personas es muy pequeña para generalizar a todos los consumidores.','La conclusión es confiable, porque el porcentaje es alto.','La conclusión es correcta, porque 7 de 10 es el 70 %.','La conclusión es falsa, porque el porcentaje debería ser 7 %.'],'El cálculo es correcto, pero con una muestra tan pequeña el resultado puede variar mucho y no permite generalizar.');
N('A','A','Porcentajes y totales','<p>En el colegio A aprobó el 40 % de 200 estudiantes, y en el colegio B aprobó el 60 % de 100 estudiantes. Un periodista afirma que el colegio B tuvo más estudiantes aprobados. ¿Es correcta su afirmación?</p>',
['No, porque en A aprobaron 80 estudiantes y en B aprobaron 60.','Sí, porque 60 % es mayor que 40 %.','Sí, porque B tiene menos estudiantes.','No, porque ambos colegios tuvieron la misma cantidad de aprobados.'],'Un porcentaje mayor no implica una cantidad mayor si los totales son distintos: 0,4 × 200 = 80 y 0,6 × 100 = 60.');
N('M','A','Unidades de volumen','<p>Un estudiante afirma que un tanque de 1 m³ tiene capacidad para 100 litros. ¿Es correcta su afirmación?</p>',
['No, porque 1 m³ = 1.000 dm³ y 1 dm³ = 1 litro; el tanque tiene capacidad para 1.000 litros.','Sí, porque 1 m = 100 cm.','No, porque tiene capacidad para 10 litros.','Sí, porque 1 m³ = 100 dm³.'],'1 m = 10 dm, así que 1 m³ = 10 × 10 × 10 dm³ = 1.000 dm³ = 1.000 L.');
N('E','A','Desigualdad triangular','<p>Con tres listones de 3 cm, 4 cm y 8 cm, Andrea quiere armar un triángulo uniendo sus extremos. ¿Puede lograrlo?</p>',
['No, porque 3 + 4 = 7 es menor que 8, y en todo triángulo la suma de dos lados debe ser mayor que el tercero.','Sí, porque con tres segmentos siempre se puede formar un triángulo.','Sí, porque 3 + 4 + 8 = 15 es impar.','No, porque los lados de un triángulo deben ser iguales.'],'Los listones de 3 y 4 cm no alcanzan a cerrar la figura sobre el de 8 cm.');
N('V','A','Ecuaciones sin solución','<p>Al resolver 2(<i>x</i> + 1) = 2<i>x</i> + 5, Felipe obtiene 2 = 5. ¿Qué puede concluir?</p>',
['Que la ecuación no tiene solución, porque se llega a una igualdad falsa sin importar el valor de x.','Que x = 0 es la solución.','Que cometió un error, porque toda ecuación lineal tiene una solución.','Que la ecuación tiene infinitas soluciones.'],'Las x se cancelan y queda una contradicción. Gráficamente, son dos rectas paralelas que no se cortan.');
N('V','A','Identidades','<p>Al resolver 3(<i>x</i> + 2) = 3<i>x</i> + 6, Mariana obtiene 6 = 6. ¿Qué puede concluir?</p>',
['Que la igualdad se cumple para cualquier valor de x: tiene infinitas soluciones.','Que la ecuación no tiene solución.','Que la única solución es x = 6.','Que la única solución es x = 0.'],'Los dos lados son la misma expresión (es una identidad), así que cualquier número la satisface.');
N('N','A','Porcentajes sucesivos','<p>Luisa gastó el 30 % de su dinero el lunes y el 30 % de lo que le quedaba el martes. Ella dice que en total gastó el 60 % de su dinero. ¿Tiene razón?</p>',
['No, gastó el 51 %, porque el segundo 30 % se calcula sobre el 70 % restante.','Sí, porque 30 % + 30 % = 60 %.','No, gastó el 9 %.','No, gastó el 49 %.'],'Con 100: el lunes gasta 30 y quedan 70; el martes gasta 0,3 × 70 = 21. Total gastado: 51 (le queda el 49 %).');
N('A','A','Interpretación de la media','<p>Un estudiante afirma: “Si la media de un conjunto de datos es 5, entonces al menos uno de los datos es 5”. ¿Es verdadera esta afirmación?</p>',
['No; por ejemplo, el conjunto 4 y 6 tiene media 5 y ningún dato es 5.','Sí, porque la media siempre es uno de los datos.','Sí, porque la media es el dato central.','No, porque la media siempre es mayor que todos los datos.'],'La media es un valor de equilibrio y no tiene que ser uno de los datos.');
N('A','A','Probabilidad de la unión','<p>Si P(A) = 0,3 y P(B) = 0,5, Laura afirma que P(A o B) = 0,8. ¿En qué caso es correcta su afirmación?</p>',
['Solo si A y B son mutuamente excluyentes, es decir, si no pueden ocurrir al mismo tiempo.','Siempre, porque las probabilidades se suman.','Solo si A y B son independientes.','Nunca, porque P(A o B) = 0,15.'],'En general P(A o B) = P(A) + P(B) − P(A y B). Solo si P(A y B) = 0 la unión vale 0,8.');
N('E','A','Ángulos del triángulo','<p>¿Por qué un triángulo no puede tener dos ángulos obtusos?</p>',
['Porque dos ángulos mayores que 90° sumarían más de 180°, y los tres ángulos de un triángulo suman exactamente 180°.','Porque los ángulos obtusos solo existen en cuadriláteros.','Porque un triángulo debe tener al menos un ángulo recto.','Sí puede tenerlos, si los lados son muy largos.'],'Con dos ángulos mayores que 90°, el tercer ángulo tendría que ser negativo.');
N('M','A','Variación del área','<p>Un estudiante afirma que cada vez que el radio de un círculo aumenta 1 cm, su área aumenta siempre la misma cantidad. ¿Es correcta su afirmación?</p>',
['No, porque el aumento es π(r + 1)² − πr² = π(2r + 1), que depende del radio: es mayor cuanto más grande es el círculo.','Sí, porque el radio aumenta siempre lo mismo.','Sí, el área aumenta siempre π cm².','No, porque el área disminuye al aumentar el radio.'],'El área no es una función lineal del radio. De r = 1 a 2 aumenta 3π, y de r = 5 a 6 aumenta 11π.');
N('V','A','Rectas perpendiculares','<p>Kevin afirma que las rectas <i>y</i> = 2<i>x</i> + 1 y <i>y</i> = −2<i>x</i> + 3 son perpendiculares porque sus pendientes tienen signos contrarios. ¿Tiene razón?</p>',
['No, porque para ser perpendiculares el producto de las pendientes debe ser −1, y aquí es 2 × (−2) = −4.','Sí, porque una recta sube y la otra baja.','Sí, porque las pendientes son opuestas.','No, porque las rectas son paralelas.'],'La pendiente perpendicular a 2 es −1/2: debe tener signo contrario y ser el recíproco.');
N('N','A','Densidad de los racionales','<p>¿Es cierto que entre dos números racionales distintos siempre existe otro número racional?</p>',
['Sí, porque el promedio de los dos, (a + b)/2, es racional y está entre ellos.','No, porque entre 1/2 y 1/3 no hay ningún racional.','No, porque los racionales son enteros.','Sí, pero solo si los dos números son enteros.'],'El promedio de dos racionales es racional y está entre ellos, así que el proceso se puede repetir infinitamente. Por ejemplo, entre 1/3 y 1/2 está 5/12.');
N('N','A','Números irracionales',`<p>Un estudiante afirma que ${R(2)} × ${R(2)} es un número irracional porque ${R(2)} es irracional. ¿Es correcta su afirmación?</p>`,
['No, porque √2 × √2 = 2, que es racional.','Sí, porque el producto de dos irracionales siempre es irracional.','Sí, porque √2 tiene infinitas cifras decimales.','No, porque √2 × √2 = 4.'],'El producto de dos irracionales puede ser racional; este es un contraejemplo.');
N('V','A','Propiedades de las potencias','<p>Al simplificar 2<sup>3</sup> · 2<sup>4</sup>, Óscar escribe 4<sup>7</sup>. ¿Es correcto?</p>',
['No, porque al multiplicar potencias de igual base se conserva la base y se suman los exponentes: 2⁷ = 128.','Sí, porque se multiplican las bases y se suman los exponentes.','No, el resultado es 2¹² porque se multiplican los exponentes.','Sí, porque 2 + 2 = 4.'],'2³ · 2⁴ = 8 × 16 = 128 = 2⁷, mientras que 4⁷ = 16.384.');
N('V','A','Funciones','<p>Si <i>f</i>(<i>x</i>) = <i>x</i><sup>2</sup>, Camilo afirma que <i>f</i>(<i>a</i> + <i>b</i>) = <i>f</i>(<i>a</i>) + <i>f</i>(<i>b</i>). ¿Es correcta su afirmación?</p>',
['No, porque f(a + b) = (a + b)² = a² + 2ab + b², que en general es distinto de a² + b².','Sí, porque toda función cumple esa propiedad.','Sí, porque la función es cuadrática.','No, porque f(a + b) = 2a + 2b.'],'Por ejemplo, f(1 + 2) = 9 mientras que f(1) + f(2) = 5. La igualdad solo se cumple si ab = 0.');
N('A','A','Conteo','<p>Para formar códigos de 3 letras distintas usando solo A, B y C, Santiago calculó 3 × 3 × 3 = 27 posibilidades. ¿Es correcto?</p>',
['No, porque las letras no se pueden repetir; hay 3 × 2 × 1 = 6 códigos.','Sí, porque cada posición tiene 3 opciones.','No, porque hay 9 posibilidades.','Sí, porque 3³ = 27.'],'Si las letras deben ser distintas, cada letra usada ya no está disponible: ABC, ACB, BAC, BCA, CAB y CBA.');
N('E','A','Semejanza','<p>Un estudiante afirma que si se duplican las longitudes de los lados de un triángulo, también se duplican sus ángulos. ¿Es correcta su afirmación?</p>',
['No, porque el nuevo triángulo es semejante al original y conserva sus ángulos; además, los ángulos duplicados sumarían 360°.','Sí, porque todas las medidas se duplican.','Sí, porque los ángulos dependen de los lados.','No, porque los ángulos se reducen a la mitad.'],'En una ampliación las longitudes cambian en proporción y los ángulos se conservan.');
N('M','A','Escalas','<p>Un edificio mide 30 m de alto. Un estudiante construye una maqueta a escala 1 : 50 y afirma que la maqueta debe medir 1,5 m. ¿Es correcto?</p>',

N('V','A','Gráficas distancia-tiempo','<p>En una gráfica de distancia (eje vertical) contra tiempo (eje horizontal), un tramo es horizontal. Un estudiante afirma que en ese tramo el objeto se movió a velocidad constante. ¿Es correcta su afirmación?</p>',
