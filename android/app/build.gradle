plugins {
    id 'com.android.application'
}

android {
    namespace 'co.sabermate.app'
    compileSdk 34

    defaultConfig {
        applicationId "co.sabermate.app"
        minSdk 21
        targetSdk 34
        versionCode 2
        versionName "1.1"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}
